</main><script>window.ACT={"kind": "exam", "id": "m07-sim", "title": "Simulado do módulo 7", "minutes": 15, "goal": 13, "qs": [{"q": "<p>Quantos bits tem um endereço IPv6? <b>(a)<\/b> 32 <b>(b)<\/b> 64 <b>(c)<\/b> 128 <b>(d)<\/b> 256<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> 128 bits.<\/p>"}, {"q": "<p>Qual a forma abreviada correta de <code>2001:0db8:0000:0000:0000:0000:0000:0001<\/code>? <b>(a)<\/b> <code>2001:db8:1<\/code> <b>(b)<\/b> <code>2001:db8::1<\/code> <b>(c)<\/b> <code>2001::db8::1<\/code> <b>(d)<\/b> <code>2001:db8:0::1:0<\/code><\/p>", "type": "open", "expl": "<p><b>(b)<\/b> <code>2001:db8::1<\/code>.<\/p>"}, {"q": "<p>Quantas vezes o <code>::<\/code> pode aparecer em um endereço? <b>(a)<\/b> 1 <b>(b)<\/b> 2 <b>(c)<\/b> 3 <b>(d)<\/b> ilimitado<\/p>", "type": "open", "expl": "<p><b>(a)<\/b> Uma só vez; senão haveria ambiguidade.<\/p>"}, {"q": "<p>O prefixo <code>fe80::/10<\/code> identifica: <b>(a)<\/b> global unicast <b>(b)<\/b> ULA <b>(c)<\/b> link-local <b>(d)<\/b> multicast<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> link-local.<\/p>"}, {"q": "<p>Qual endereço é multicast \"todos os roteadores do enlace\"? <b>(a)<\/b> ff02::1 <b>(b)<\/b> ff02::2 <b>(c)<\/b> ff02::5 <b>(d)<\/b> ::1<\/p>", "type": "open", "expl": "<p><b>(b)<\/b> ff02::2 (ff02::1 = todos os nós; ff02::5 = OSPFv3).<\/p>"}, {"q": "<p>Quantas sub-redes /64 há em um /48? <b>(a)<\/b> 256 <b>(b)<\/b> 1024 <b>(c)<\/b> 65.536 <b>(d)<\/b> 4.096<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> 2^16 = 65.536.<\/p>"}, {"q": "<p>O EUI-64 do MAC <code>00:1A:2B:3C:4D:5E<\/code> é: <b>(a)<\/b> 001A:2BFF:FE3C:4D5E <b>(b)<\/b> 021A:2BFF:FE3C:4D5E <b>(c)<\/b> 021A:2BFE:FF3C:4D5E <b>(d)<\/b> 001A:2B3C:4D5E:FFFE<\/p>", "type": "open", "expl": "<p><b>(b)<\/b> <code>021A:2BFF:FE3C:4D5E<\/code>: insere FF:FE e inverte o bit U/L (00 → 02).<\/p>"}, {"q": "<p>Qual mensagem ICMPv6 substitui o ARP Request? <b>(a)<\/b> RS <b>(b)<\/b> RA <b>(c)<\/b> NS <b>(d)<\/b> NA<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> NS (Neighbor Solicitation); a resposta é NA.<\/p>"}, {"q": "<p>O DHCPv6 fornece o gateway padrão? <b>(a)<\/b> Sim <b>(b)<\/b> Não: o gateway vem do RA<\/p>", "type": "open", "expl": "<p><b>(b)<\/b> Não: o gateway vem do RA.<\/p>"}, {"q": "<p>Qual comando habilita o roteamento IPv6 e RAs em um roteador Cisco? <b>(a)<\/b> <code>ipv6 enable<\/code> <b>(b)<\/b> <code>ipv6 unicast-routing<\/code> <b>(c)<\/b> <code>ip routing<\/code> <b>(d)<\/b> <code>ipv6 address dhcp<\/code><\/p>", "type": "open", "expl": "<p><b>(b)<\/b> <code>ipv6 unicast-routing<\/code>.<\/p>"}, {"q": "<p>O tamanho do cabeçalho IPv6 básico é: <b>(a)<\/b> 20 bytes <b>(b)<\/b> 32 bytes <b>(c)<\/b> 40 bytes <b>(d)<\/b> variável<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> 40 bytes, fixo.<\/p>"}, {"q": "<p>Qual técnica executa IPv4 e IPv6 ao mesmo tempo no mesmo dispositivo? <b>(a)<\/b> NAT64 <b>(b)<\/b> tunelamento <b>(c)<\/b> dual stack <b>(d)<\/b> 6to4 obrigatório<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> dual stack.<\/p>"}, {"q": "<p>O prefixo <code>2001:db8::/32<\/code> é usado para: <b>(a)<\/b> Internet pública <b>(b)<\/b> documentação <b>(c)<\/b> link-local <b>(d)<\/b> ULA<\/p>", "type": "open", "expl": "<p><b>(b)<\/b> documentação.<\/p>"}, {"q": "<p>Para o SLAAC funcionar, o comprimento do prefixo da LAN deve ser: <b>(a)<\/b> /48 <b>(b)<\/b> /56 <b>(c)<\/b> /64 <b>(d)<\/b> /128<\/p>", "type": "open", "expl": "<p><b>(c)<\/b> /64.<\/p>"}, {"q": "<p>O solicited-node multicast do endereço <code>2001:db8::1:2:3c:4d5e<\/code> usa: <b>(a)<\/b> os 24 primeiros bits <b>(b)<\/b> os 24 últimos bits em <code>ff02::1:ff00:0/104<\/code> <b>(c)<\/b> o MAC <b>(d)<\/b> os 64 últimos bits<\/p>", "type": "open", "expl": "<p><b>(b)<\/b> Os 24 últimos bits (<code>3c:4d5e<\/code>) em <code>ff02::1:ff00:0/104<\/code>: <code>ff02::1:ff3c:4d5e<\/code>.<\/p>"}], "scoring": null};</script><script src="../../assets/app.js"></script></body></html>
