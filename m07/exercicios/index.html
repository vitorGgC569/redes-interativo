</main><script>window.ACT={"kind": "cards", "id": "m07-ex", "sections": [{"title": "Fácil: abreviar e expandir", "intro": "", "items": [{"id": "s1all", "n": null, "q": "<p>Abrevie: (1) <code>2001:0db8:0000:0000:0000:0000:0000:0001<\/code> (2) <code>fe80:0000:0000:0000:0202:b3ff:fe1e:8329<\/code> (3) <code>ff02:0000:0000:0000:0000:0000:0000:0005<\/code>. Expanda: (4) <code>2001:db8::1<\/code> (5) <code>::1<\/code> (6) <code>fd12:3456:789a::1<\/code>.<\/p>", "a": "<ol><li><b>2001:db8::1<\/b>.<\/li><li><b>fe80::202:b3ff:fe1e:8329<\/b>.<\/li><li><b>ff02::5<\/b> (OSPFv3, todos os roteadores OSPF).<\/li><li>2001:0db8:0000:0000:0000:0000:0000:0001.<\/li><li>0000:0000:0000:0000:0000:0000:0000:0001.<\/li><li>fd12:3456:789a:0000:0000:0000:0000:0001 (o <code>::<\/code> substitui 4 grupos).<\/li><\/ol>", "kw": []}], "tail": ""}, {"title": "Fácil/médio: identifique o tipo", "intro": "", "items": [{"id": "s2all", "n": null, "q": "<p><code>2001:db8:acad:1::10<\/code>, <code>fe80::1<\/code>, <code>ff02::2<\/code>, <code>fd00:abcd::5<\/code>, <code>::1<\/code>, <code>2a00:1450::1<\/code>, <code>::<\/code>, <code>ff02::1:ff3c:4d5e<\/code>.<\/p>", "a": "<table><thead><tr><th>Endereço<\/th><th>Tipo<\/th><\/tr><\/thead><tbody><tr><td>2001:db8:acad:1::10<\/td><td>Global unicast, na faixa de documentação 2001:db8::/32<\/td><\/tr><tr><td>fe80::1<\/td><td>Link-local<\/td><\/tr><tr><td>ff02::2<\/td><td>Multicast: todos os roteadores do enlace<\/td><\/tr><tr><td>fd00:abcd::5<\/td><td>Unique local (ULA)<\/td><\/tr><tr><td>::1<\/td><td>Loopback<\/td><\/tr><tr><td>2a00:1450::1<\/td><td>Global unicast (2000::/3)<\/td><\/tr><tr><td>::<\/td><td>Não especificado<\/td><\/tr><tr><td>ff02::1:ff3c:4d5e<\/td><td>Multicast solicited-node (últimos 24 bits 3c:4d5e)<\/td><\/tr><\/tbody><\/table>", "kw": []}], "tail": ""}, {"title": "Médio: EUI-64", "intro": "", "items": [{"id": "s3all", "n": null, "q": "<p>Calcule o ID de interface, o link-local e o GUA (prefixo <code>2001:db8:acad:1::/64<\/code>) para os MACs: (1) <code>00:1A:2B:3C:4D:5E<\/code> (2) <code>52:54:00:12:34:56<\/code> (3) <code>AC:DE:48:00:11:22<\/code>.<\/p>", "a": "<p>Insira FF:FE e inverta o 7º bit do primeiro byte (some ou subtraia 2).<\/p>\n<ol><li><b>021A:2BFF:FE3C:4D5E<\/b> → link-local <code>fe80::21a:2bff:fe3c:4d5e<\/code>; GUA <code>2001:db8:acad:1:21a:2bff:fe3c:4d5e<\/code>.<\/li><li>Primeiro byte 52 = 01010010 → 01010000 = 50 → <b>5054:00FF:FE12:3456<\/b> → link-local <code>fe80::5054:ff:fe12:3456<\/code>; GUA <code>2001:db8:acad:1:5054:ff:fe12:3456<\/code>.<\/li><li>AC = 10101100 → 10101110 = AE → <b>AEDE:48FF:FE00:1122<\/b> → link-local <code>fe80::aede:48ff:fe00:1122<\/code>; GUA <code>2001:db8:acad:1:aede:48ff:fe00:1122<\/code>.<\/li><\/ol>\n<p>Note: o <code>00<\/code> do grupo <code>5054:00ff<\/code> aparece como <code>0<\/code> e é omitido na abreviação (<code>5054:ff<\/code>).<\/p>", "kw": []}], "tail": ""}, {"title": "Médio: sub-redes IPv6", "intro": "", "items": [{"id": "s4q1", "n": 1, "q": "<p>A empresa recebeu <code>2001:db8:acad::/48<\/code>. Quantas sub-redes /64 ela pode criar? Liste as 4 primeiras.<\/p>", "a": "<p>64 − 48 = 16 bits → 2^16 = <b>65.536<\/b>. As quatro primeiras: <code>2001:db8:acad::/64<\/code> (ID 0000), <code>2001:db8:acad:1::/64<\/code>, <code>2001:db8:acad:2::/64<\/code>, <code>2001:db8:acad:3::/64<\/code>.<\/p>", "kw": ["65.536"]}, {"id": "s4q2", "n": 2, "q": "<p>Do /56 entregue a uma residência, quantas /64?<\/p>", "a": "<p>64 − 56 = 8 bits → 2^8 = <b>256<\/b>.<\/p>", "kw": ["256"]}, {"id": "s4q3", "n": 3, "q": "<p>Divida <code>2001:db8:acad::/48<\/code> em /52. Qual é a 4ª sub-rede?<\/p>", "a": "<p>/48 → /52 empresta 4 bits: 16 sub-redes, que avançam de 1000 hex em 1000 hex no 4º grupo (0000, 1000, 2000, 3000, ...). A 4ª é <b><code>2001:db8:acad:3000::/52<\/code><\/b>.<\/p>", "kw": ["2001:db8:acad:3000::/52"]}, {"id": "s4q4", "n": 4, "q": "<p>O bloco <code>2001:db8:acad:10::/60<\/code> contém quais /64? Qual a primeira e a última?<\/p>", "a": "<p>/60 → /64: 4 bits: 16 sub-redes, do 4º grupo <code>0010<\/code> até <code>001f<\/code>: primeira <b><code>2001:db8:acad:10::/64<\/code><\/b>, última <b><code>2001:db8:acad:1f::/64<\/code><\/b>.<\/p>", "kw": ["2001:db8:acad:10::/64", "2001:db8:acad:1f::/64"]}, {"id": "s4q5", "n": 5, "q": "<p>O endereço <code>2001:db8:0:abcd::5<\/code> pertence a <code>2001:db8:0:ab00::/56<\/code>?<\/p>", "a": "<p>/56 = 3 grupos completos (48 bits) + os 8 primeiros bits do 4º grupo. O 4º grupo do prefixo é <code>ab00<\/code> (byte <code>ab<\/code>) e o do endereço é <code>abcd<\/code> (também byte <code>ab<\/code>): <b>sim<\/b>, pertence.<\/p>", "kw": ["sim"]}], "tail": ""}, {"title": "Médio/difícil: multicast solicited-node e MAC", "intro": "", "items": [{"id": "s5all", "n": null, "q": "<p>Para o endereço <code>2001:db8:acad:1:21a:2bff:fe3c:4d5e<\/code>: (1) qual o endereço multicast solicited-node? (2) qual o MAC multicast de camada 2 correspondente?<\/p>", "a": "<ol><li>Pegue os últimos 24 bits (<code>3c:4d5e<\/code>) e coloque em <code>ff02::1:ff00:0/104<\/code>: <b><code>ff02::1:ff3c:4d5e<\/code><\/b>.<\/li><li>Para IPv6, o MAC multicast é <code>33:33<\/code> + os últimos 32 bits do endereço multicast IPv6: <code>ff3c:4d5e<\/code> → <b><code>33:33:ff:3c:4d:5e<\/code><\/b>.<\/li><\/ol>", "kw": []}], "tail": ""}, {"title": "Difícil: protocolos e cabeçalhos", "intro": "", "items": [{"id": "s6q1", "n": 1, "q": "<p>Qual a principal diferença entre ARP e NDP quanto ao tipo de endereço de destino?<\/p>", "a": "<p>ARP usa <b>broadcast<\/b>; o NDP usa <b>multicast<\/b> (solicited-node) e unicast; o IPv6 não tem broadcast.<\/p>", "kw": ["broadcast", "multicast"]}, {"id": "s6q2", "n": 2, "q": "<p>Por que não há campo de checksum no cabeçalho IPv6?<\/p>", "a": "<p>Para reduzir o trabalho dos roteadores (o TTL/Hop Limit muda em cada salto); a verificação de erros fica na camada de enlace (FCS) e de transporte (TCP/UDP têm checksum e, em IPv6, o checksum UDP é obrigatório).<\/p>", "kw": []}, {"id": "s6q3", "n": 3, "q": "<p>Um host recebeu um RA com A = 1, M = 0, O = 1. Como ele obtém (a) o endereço? (b) o DNS? (c) o gateway?<\/p>", "a": "<p>(a) Por <b>SLAAC<\/b> (A = 1); (b) por <b>DHCPv6 sem estado<\/b> (O = 1); (c) pelo próprio <b>RA<\/b> (endereço link-local do roteador).<\/p>", "kw": ["SLAAC", "DHCPv6 sem estado", "RA"]}, {"id": "s6q4", "n": 4, "q": "<p>O que significa o Next Header = 58?<\/p>", "a": "<p>Que o próximo cabeçalho é o do <b>ICMPv6<\/b>.<\/p>", "kw": ["ICMPv6"]}, {"id": "s6q5", "n": 5, "q": "<p>Qual o tamanho mínimo da MTU IPv6 exigido de um enlace?<\/p>", "a": "<p><b>1280 bytes<\/b>.<\/p>", "kw": ["1280 bytes"]}], "tail": ""}, {"title": "Desafio: diagnóstico", "intro": "", "items": [{"id": "s7q1", "n": 1, "q": "<p>Um PC recebe <code>fe80::<\/code> mas nunca obtém um endereço global. O roteador está ligado com <code>ipv6 address 2001:db8:acad:1::1/64<\/code>. Qual comando provavelmente falta?<\/p>", "a": "<p><b><code>ipv6 unicast-routing<\/code><\/b>. Sem ele, o roteador não envia RAs (e não roteia IPv6), então o host nunca recebe o prefixo.<\/p>", "kw": ["ipv6 unicast-routing"]}, {"id": "s7q2", "n": 2, "q": "<p>Um host tem GUA correto e acessa a LAN, mas não acessa a Internet. <code>show ipv6 route<\/code> do PC não mostra gateway padrão. O que verificar?<\/p>", "a": "<p>Se há RA, o gateway é o link-local do roteador. Verifique se o RA está sendo enviado (<code>ipv6 unicast-routing<\/code>, interface <code>no shutdown<\/code>, flags corretas), se há filtros bloqueando RAs, e se o PC aceita RA. Se o gateway for estático, confira o link-local.<\/p>", "kw": []}, {"id": "s7q3", "n": 3, "q": "<p>Um técnico configurou <code>ipv6 address 2001:db8:acad:1::1/48<\/code> em uma LAN e SLAAC não funcionou. Por quê?<\/p>", "a": "<p>O SLAAC exige <b>/64<\/b>. Com /48, a parte de interface teria 80 bits e o host não consegue montar o endereço. Use /64 em LANs.<\/p>", "kw": ["/64"]}, {"id": "s7q4", "n": 4, "q": "<p>Dois hosts mostram \"duplicate address detected\". O que isso significa e qual a solução?<\/p>", "a": "<p>Dois nós tentaram usar o mesmo endereço (DAD detectou a duplicidade) e o segundo não o ativa. Corrija mudando o endereço estático, ou verifique MACs duplicados/máquinas clonadas (EUI-64 igual).<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
