</main><script>window.ACT={"kind": "exam", "id": "m06-sim", "title": "Simulado do módulo 6", "minutes": 15, "goal": 13, "qs": [{"q": "<p>Máscara e hosts úteis de /26.<\/p>", "type": "open", "expl": "<p><b>255.255.255.192<\/b> e <b>62<\/b> hosts.<\/p>"}, {"q": "<p>Rede e broadcast de 172.16.130.5/18.<\/p>", "type": "open", "expl": "<p>/18 → máscara 255.255.192.0, bloco 64 no 3º octeto; 130 está em 128 a 191. Rede <b>172.16.128.0<\/b>, broadcast <b>172.16.191.255<\/b>.<\/p>"}, {"q": "<p>Quantas sub-redes /27 existem em um /24?<\/p>", "type": "open", "expl": "<p><b>8<\/b>.<\/p>"}, {"q": "<p>Qual o menor prefixo para 60 hosts?<\/p>", "type": "open", "expl": "<p>2^6 − 2 = 62 ≥ 60: <b>/26<\/b>.<\/p>"}, {"q": "<p>Qual o prefixo para um link ponto a ponto tradicional (sem /31)?<\/p>", "type": "open", "expl": "<p><b>/30<\/b> (2 hosts).<\/p>"}, {"q": "<p>Rede e broadcast de 10.0.0.37/29.<\/p>", "type": "open", "expl": "<p>/29 → bloco 8; 37 está em 32 a 39. Rede <b>10.0.0.32<\/b>, broadcast <b>10.0.0.39<\/b>.<\/p>"}, {"q": "<p>Resuma 10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24 e 10.1.3.0/24.<\/p>", "type": "open", "expl": "<p><b>10.1.0.0/22<\/b>.<\/p>"}, {"q": "<p>192.168.5.130/25 e 192.168.5.200/25 estão na mesma sub-rede?<\/p>", "type": "open", "expl": "<p><b>Sim<\/b>: ambos em 192.168.5.128/25 (128 a 255).<\/p>"}, {"q": "<p>Quantos bits emprestar de um /24 para ter pelo menos 10 sub-redes? Qual o prefixo e os hosts por sub-rede?<\/p>", "type": "open", "expl": "<p>2^3 = 8 (insuficiente), 2^4 = 16 ≥ 10: <b>4 bits<\/b>, prefixo <b>/28<\/b>, <b>14<\/b> hosts por sub-rede.<\/p>"}, {"q": "<p>192.168.1.32/27 pode ser atribuído a um host?<\/p>", "type": "open", "expl": "<p><b>Não<\/b>: é o endereço de <b>rede<\/b> do bloco 32 a 63.<\/p>"}, {"q": "<p>Qual a wildcard de /26?<\/p>", "type": "open", "expl": "<p><b>0.0.0.63<\/b>.<\/p>"}, {"q": "<p>Quantos hosts úteis tem um /23?<\/p>", "type": "open", "expl": "<p>2^9 − 2 = <b>510<\/b>.<\/p>"}, {"q": "<p>Em VLSM, por que se aloca da maior para a menor sub-rede?<\/p>", "type": "open", "expl": "<p>Para que os blocos grandes fiquem <b>alinhados<\/b> e não se criem buracos inutilizáveis; os pequenos se encaixam nas sobras.<\/p>"}, {"q": "<p>Qual a máscara e o último endereço de 172.16.0.0/12?<\/p>", "type": "open", "expl": "<p>Máscara <b>255.240.0.0<\/b>; último endereço <b>172.31.255.255<\/b>.<\/p>"}, {"q": "<p>Por que usar /30 em links entre roteadores?<\/p>", "type": "open", "expl": "<p>Economizam endereços: só 2 hosts úteis são necessários (um /24 desperdiçaria 252); o /30 tem exatamente 2.<\/p>"}], "scoring": "Pontuação: 13 a 15 = excelente; 10 a 12 = repita os níveis 2 e 3; abaixo de 10 = refaça a seção 2 e os níveis 1 e 2."};</script><script src="../../assets/app.js"></script></body></html>
