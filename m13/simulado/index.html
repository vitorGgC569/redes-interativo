</main><script>window.ACT={"kind": "exam", "id": "m13-sim", "title": "Simulado do módulo 13", "minutes": 15, "goal": 13, "qs": [{"q": "Qual propriedade garante que a informação não foi alterada sem autorização?", "type": "mc", "opts": ["Confidencialidade", "Integridade", "Disponibilidade", "Autenticidade"], "ans": [1], "expl": "<p>A integridade garante que a informação não foi alterada.<\/p>"}, {"q": "O que é um exploit?", "type": "mc", "opts": ["Uma fraqueza em um sistema", "A técnica ou código que explora uma fraqueza", "Um tipo de firewall", "Uma política de senhas"], "ans": [1], "expl": "<p>O exploit é a técnica ou o código que se aproveita da vulnerabilidade.<\/p>"}, {"q": "Qual ataque faz o switch se comportar como um hub?", "type": "mc", "opts": ["ARP spoofing", "MAC flooding", "DHCP starvation", "Phishing"], "ans": [1], "expl": "<p>O MAC flooding enche a tabela de endereços, e o switch passa a inundar os quadros.<\/p>"}, {"q": "Qual recurso protege contra servidor DHCP falso?", "type": "mc", "opts": ["Port security", "DHCP snooping", "PortFast", "BPDU Guard"], "ans": [1], "expl": "<p>O DHCP snooping só aceita respostas de servidor em portas confiáveis.<\/p>"}, {"q": "Qual recurso valida as respostas ARP usando a tabela de bindings do DHCP snooping?", "type": "mc", "opts": ["DAI", "NAT", "STP", "CDP"], "ans": [0], "expl": "<p>O Dynamic ARP Inspection (DAI).<\/p>"}, {"q": "Qual o modo de violação padrão do port security?", "type": "mc", "opts": ["protect", "restrict", "shutdown", "none"], "ans": [2], "expl": "<p>O padrão é shutdown, que coloca a porta em err-disabled.<\/p>"}, {"q": "Qual protocolo AAA usa TCP 49 e criptografa o pacote inteiro?", "type": "mc", "opts": ["RADIUS", "TACACS+", "LDAP", "Kerberos"], "ans": [1], "expl": "<p>O TACACS+ usa TCP 49.<\/p>"}, {"q": "Quais as faixas de ACL padrão numerada?", "type": "mc", "opts": ["100 a 199", "1 a 99 e 1300 a 1999", "200 a 299", "1000 a 1099"], "ans": [1], "expl": "<p>De 1 a 99 e de 1300 a 1999 (a 100 a 199 é da estendida).<\/p>"}, {"q": "Onde se coloca preferencialmente uma ACL padrão?", "type": "mc", "opts": ["Perto da origem", "Perto do destino", "No servidor DNS", "Não importa"], "ans": [1], "expl": "<p>A padrão só olha a origem, então fica perto do destino para não bloquear demais.<\/p>"}, {"q": "Qual a máscara curinga correspondente a /27?", "type": "mc", "opts": ["0.0.0.15", "0.0.0.31", "0.0.0.63", "0.0.0.255"], "ans": [1], "expl": "<p>/27 é 255.255.255.224, então curinga 0.0.0.31.<\/p>"}, {"q": "O que acontece com um pacote que não casa com nenhuma linha da ACL?", "type": "mc", "opts": ["É permitido", "É negado (deny implícito)", "É enviado à nuvem", "Gera um alerta e passa"], "ans": [1], "expl": "<p>O deny implícito no final da lista.<\/p>"}, {"q": "Qual comando aplica uma ACL na linha VTY?", "type": "mc", "opts": ["<code>ip access-group<\/code>", "<code>access-class<\/code>", "<code>ip filter<\/code>", "<code>traffic-filter<\/code>"], "ans": [1], "expl": "<p><code>access-class<\/code> na linha VTY. O <code>ip access-group<\/code> é para interfaces.<\/p>"}, {"q": "Quais itens uma ACL estendida pode filtrar e a padrão não?", "type": "mc", "opts": ["Somente a origem", "Destino, protocolo e portas", "Somente o MAC", "Somente a VLAN"], "ans": [1], "expl": "<p>A estendida filtra origem, destino, protocolo e portas.<\/p>"}, {"q": "Qual a vantagem de uma ACL nomeada?", "type": "mc", "opts": ["É mais rápida", "Pode ser editada por número de sequência", "Funciona em qualquer sentido ao mesmo tempo", "Substitui o firewall"], "ans": [1], "expl": "<p>A ACL nomeada permite inserir e apagar linhas por número de sequência.<\/p>"}, {"q": "Qual a melhor forma de administrar um roteador remotamente?", "type": "mc", "opts": ["Telnet", "HTTP", "SSH", "TFTP"], "ans": [2], "expl": "<p>O SSH criptografa a sessão, e o telnet e o HTTP não.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
