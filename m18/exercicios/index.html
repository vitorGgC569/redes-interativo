</main><script>window.ACT={"kind": "cards", "id": "m18-ex", "sections": [{"title": "Conceitos (fácil)", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Quantos exames são necessários para o CCNP Enterprise, e de que tipo?<\/p>", "a": "<p>Dois: o exame core (ENCOR 350-401) e um exame de concentração à sua escolha.<\/p>", "kw": []}, {"id": "s1q2", "n": 2, "q": "<p>Qual exame serve, ao mesmo tempo, para o CCNP Enterprise e como qualificação para o laboratório do CCIE Enterprise Infrastructure?<\/p>", "a": "<p>A ENCOR 350-401. Passar nela qualifica para o laboratório do CCIE Enterprise Infrastructure.<\/p>", "kw": []}, {"id": "s1q3", "n": 3, "q": "<p>Para onde foi o conteúdo de wireless que saiu da ENCOR em 2026?<\/p>", "a": "<p>Para a trilha própria CCNP Wireless, cujo exame core é o 350-101 WLCOR.<\/p>", "kw": []}, {"id": "s1q4", "n": 4, "q": "<p>Qual o domínio de maior peso na ENCOR v1.2, e quanto ele vale?<\/p>", "a": "<p>Infraestrutura (3.0), com 30%.<\/p>", "kw": []}, {"id": "s1q5", "n": 5, "q": "<p>A CCNA é pré-requisito obrigatório para fazer a ENCOR?<\/p>", "a": "<p>Não. A Cisco não exige pré-requisito formal, mas a ENCOR assume tudo o que a CCNA cobra, então ela é a base recomendada.<\/p>", "kw": []}, {"id": "s1q6", "n": 6, "q": "<p>O que é uma VRF, em uma frase?<\/p>", "a": "<p>É uma tabela de roteamento independente dentro do mesmo roteador, o que permite separar clientes ou departamentos, até com endereços repetidos.<\/p>", "kw": []}, {"id": "s1q7", "n": 7, "q": "<p>Por que o GRE costuma ser combinado com o IPsec?<\/p>", "a": "<p>Porque o GRE carrega multicast e protocolos de roteamento, mas não criptografa, e o IPsec criptografa, mas tradicionalmente só carrega unicast IP. Juntos, um cobre a falta do outro.<\/p>", "kw": []}, {"id": "s1q8", "n": 8, "q": "<p>Qual a função do IP SLA?<\/p>", "a": "<p>Enviar sondas sintéticas (ICMP, UDP e outras) para medir latência, jitter e perda, e com isso acompanhar a qualidade de um caminho.<\/p>", "kw": []}], "tail": ""}, {"title": "Associações (fácil)", "intro": "", "items": [{"id": "s2all", "n": null, "q": "<p>Ligue cada descrição ao item certo.<\/p>\n<ol><li>Concentração voltada a roteamento avançado, VPNs e serviços de infraestrutura.<\/li><li>Concentração de projeto de redes.<\/li><li>Concentração de automação, que também vale para o CCNP Automation.<\/li><li>Concentração de SD-WAN.<\/li><li>Porta UDP do VXLAN.<\/li><li>Distância administrativa do EIGRP interno.<\/li><li>Copia o tráfego de uma porta para um analisador em outro switch, pela rede, usando uma VLAN.<\/li><li>Criptografa o enlace de camada 2 (802.1AE).<\/li><\/ol>\n<p>Itens: (a) ENSDWI. (b) 90. (c) MACsec. (d) ENARSI. (e) RSPAN. (f) ENAUTO. (g) 4789. (h) ENSLD.<\/p>", "a": "<ol><li>d. 2. h. 3. f. 4. a. 5. g. 6. b. 7. e. 8. c.<\/li><\/ol>", "kw": []}], "tail": ""}, {"title": "EIGRP na ponta do lápis (médio)", "intro": "", "items": [{"id": "s3all", "n": null, "q": "<p>O roteador R1 quer chegar à rede 10.9.9.0/24 e tem três vizinhos. A tabela mostra a distância anunciada (o custo do vizinho até o destino, que a Cisco também chama de reported distance) e a distância total de R1 até o destino passando por cada vizinho (a feasible distance de cada caminho).<\/p>\n<table><thead><tr><th>Vizinho<\/th><th>Distância anunciada<\/th><th>Distância total por ele<\/th><\/tr><\/thead><tbody><tr><td>R2<\/td><td>2.000<\/td><td>3.000<\/td><\/tr><tr><td>R3<\/td><td>2.500<\/td><td>4.000<\/td><\/tr><tr><td>R4<\/td><td>3.500<\/td><td>3.800<\/td><\/tr><\/tbody><\/table>\n<p><b>C1.<\/b> Quem é o sucessor?<\/p>\n<p><b>C2.<\/b> Quais vizinhos são sucessores viáveis?<\/p>\n<p><b>C3.<\/b> Se o link com R2 cair, o R1 precisa sair consultando os vizinhos (estado ativo) ou já tem para onde ir?<\/p>", "a": "<p>C1. R2, porque tem a menor distância total (3.000). Essa passa a ser a feasible distance (FD) do R1 para o destino.<\/p>\n<p>C2. A condição de viabilidade diz que a distância anunciada do vizinho precisa ser menor que a FD do sucessor (3.000). R3 anuncia 2.500, que é menor que 3.000, então é sucessor viável. R4 anuncia 3.500, que é maior que 3.000, então não é, mesmo tendo distância total (3.800) menor que a do R3. Essa é a pegadinha: o critério olha a distância anunciada, e não a total.<\/p>\n<p>C3. Já tem para onde ir. O R3 é sucessor viável, então o R1 o promove a sucessor na hora, sem consultar ninguém. Só se não houvesse sucessor viável a rota entraria em estado ativo.<\/p>", "kw": []}], "tail": ""}, {"title": "Seleção de caminho do BGP (médio)", "intro": "<p>O roteador R1 recebe duas rotas para 203.0.113.0/24. Em cada item, diga qual rota ele escolhe e por qual critério, sabendo que os outros atributos são iguais.<\/p>", "items": [{"id": "s4q1", "n": 1, "q": "<p>Rota X com weight 200 e local preference 100. Rota Y com weight 0 e local preference 300.<\/p>", "a": "<p>X. O weight é o primeiro critério da Cisco, e o maior vence (200 contra 0). A local preference nem chega a ser comparada.<\/p>", "kw": []}, {"id": "s4q2", "n": 2, "q": "<p>Rota X com local preference 150 e AS-path de 4 ASes. Rota Y com local preference 100 e AS-path de 1 AS.<\/p>", "a": "<p>X. A local preference vem antes do AS-path, e a maior vence (150 contra 100).<\/p>", "kw": []}, {"id": "s4q3", "n": 3, "q": "<p>As duas com o mesmo weight e a mesma local preference. Rota X com AS-path 65010 65020. Rota Y com AS-path 65030.<\/p>", "a": "<p>Y, pelo AS-path mais curto (1 AS contra 2).<\/p>", "kw": []}, {"id": "s4q4", "n": 4, "q": "<p>Tudo igual até o AS-path e a origem. Rota X com MED 50, rota Y com MED 10, as duas vindas do mesmo AS vizinho.<\/p>", "a": "<p>Y. No MED, o menor vence (10 contra 50). Lembre que, por padrão, o MED só é comparado entre rotas vindas do mesmo AS vizinho, que é o caso aqui.<\/p>", "kw": []}], "tail": ""}, {"title": "Qual tecnologia resolve? (médio)", "intro": "<p>Para cada situação, diga a tecnologia do módulo que melhor resolve.<\/p>", "items": [{"id": "s5q1", "n": 1, "q": "<p>Um provedor pequeno precisa atender dois clientes que usam a mesma faixa 10.0.0.0/24 no mesmo roteador.<\/p>", "a": "<p>VRF (VRF-Lite, sem MPLS). Cada cliente fica em uma tabela própria, e o endereço repetido não conflita.<\/p>", "kw": []}, {"id": "s5q2", "n": 2, "q": "<p>Uma empresa quer que o tráfego da rede de visitantes saia por um link de internet barato, e o resto pelo link principal, mesmo que o destino seja o mesmo.<\/p>", "a": "<p>PBR, com um route-map que casa a origem (a rede de visitantes) e define o próximo salto.<\/p>", "kw": []}, {"id": "s5q3", "n": 3, "q": "<p>O data center precisa de mais de 4094 segmentos de camada 2, e eles precisam atravessar uma rede IP.<\/p>", "a": "<p>VXLAN, com VNI de 24 bits (cerca de 16 milhões de segmentos) encapsulado em UDP.<\/p>", "kw": []}, {"id": "s5q4", "n": 4, "q": "<p>A equipe quer saber quem está consumindo a banda do link WAN, por aplicação e por par de endereços.<\/p>", "a": "<p>Flexible NetFlow, que registra os fluxos com endereços, portas e volume.<\/p>", "kw": []}, {"id": "s5q5", "n": 5, "q": "<p>A CPU de um roteador de borda está sendo derrubada por excesso de pacotes destinados a ele.<\/p>", "a": "<p>CoPP, que limita o tráfego que chega ao plano de controle (à CPU).<\/p>", "kw": []}, {"id": "s5q6", "n": 6, "q": "<p>As filiais usam MPLS e internet, e a empresa quer mandar a videoconferência sempre pelo link com menor perda medida naquele momento.<\/p>", "a": "<p>SD-WAN, que mede a qualidade dos caminhos e escolhe o transporte por aplicação.<\/p>", "kw": []}, {"id": "s5q7", "n": 7, "q": "<p>O roteador deve gerar automaticamente um backup da configuração sempre que aparecer uma mensagem de syslog específica.<\/p>", "a": "<p>Um applet do EEM disparado pelo evento de syslog.<\/p>", "kw": []}], "tail": ""}, {"title": "Planejamento (difícil)", "intro": "", "items": [{"id": "s6all", "n": null, "q": "<p><b>F1.<\/b> Você passou na CCNA e quer o CCNP Enterprise em um ano, estudando 8 horas por semana. Distribua as horas da ENCOR pelos domínios na proporção dos pesos, supondo 200 horas de estudo para ela. Quantas horas vão para infraestrutura e quantas para segurança?<\/p>\n<p><b>F2.<\/b> Um colega trabalha num provedor regional, mexe com BGP todo dia e quer um exame de concentração. Outro trabalha numa equipe de DevOps que cuida da rede com Python e Ansible. Qual concentração você sugere para cada um, e por quê?<\/p>\n<p><b>F3.<\/b> Explique, com suas palavras, por que um laboratório só no Packet Tracer não basta para a ENCOR, e o que você usaria no lugar.<\/p>", "a": "<p>F1. Infraestrutura vale 30%, então 0,30 × 200 = 60 horas. Segurança vale 20%, então 40 horas. Os demais ficam com 30 horas (arquitetura), 20 (virtualização), 20 (assurance) e 30 (automação e IA), o que soma 200. As 200 horas, a 8 por semana, dão 25 semanas, e sobra tempo no ano para a concentração.<\/p>\n<p>F2. Para o colega do provedor, a ENARSI, que aprofunda BGP, redistribuição, route maps, MPLS e VPNs. Para o colega de DevOps, a ENAUTO, que é de automação por dispositivo e por controlador, e ainda conta para o CCNP Automation.<\/p>\n<p>F3. O Packet Tracer simula um subconjunto dos comandos e não tem SD-WAN, SD-Access, VXLAN, LISP e boa parte do assurance e da automação. Para isso você precisa de imagens reais, rodando no GNS3, no EVE-NG ou no Cisco Modeling Labs, e dos ambientes de teste da Cisco DevNet para as APIs.<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
