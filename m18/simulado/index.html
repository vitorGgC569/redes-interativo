</main><script>window.ACT={"kind": "exam", "id": "m18-sim", "title": "Simulado do módulo 18", "minutes": 15, "goal": 13, "qs": [{"q": "Quantos exames são necessários para o CCNP Enterprise?", "type": "mc", "opts": ["Um", "Dois", "Três", "Quatro"], "ans": [1], "expl": "<p>Um exame core e um de concentração.<\/p>"}, {"q": "Qual exame é o core do CCNP Enterprise?", "type": "mc", "opts": ["200-301", "300-410", "350-401", "350-101"], "ans": [2], "expl": "<p>A 350-401 ENCOR. A 200-301 é a CCNA, a 300-410 é a ENARSI e a 350-101 é o core do CCNP Wireless.<\/p>"}, {"q": "Qual domínio da ENCOR v1.2 tem o maior peso?", "type": "mc", "opts": ["Segurança", "Arquitetura", "Infraestrutura", "Automação e IA"], "ans": [2], "expl": "<p>Infraestrutura, com 30%.<\/p>"}, {"q": "Qual concentração é focada em projeto de redes?", "type": "mc", "opts": ["ENSLD", "ENARSI", "ENSDWI", "ENCC"], "ans": [0], "expl": "<p>A ENSLD é a de projeto. A ENARSI é de roteamento e serviços, a ENSDWI é de SD-WAN e a ENCC é de conexão com a nuvem.<\/p>"}, {"q": "Qual o nome do caminho de reserva livre de loop no EIGRP?", "type": "mc", "opts": ["Designated router", "Sucessor viável", "Next hop alternativo", "Rota flutuante"], "ans": [1], "expl": "<p>O sucessor viável, que o DUAL guarda para trocar de caminho sem recalcular.<\/p>"}, {"q": "No EIGRP, um vizinho é sucessor viável quando:", "type": "mc", "opts": ["A distância total por ele é a menor", "A distância anunciada por ele é menor que a FD do sucessor", "Ele tem o maior Router ID", "Ele está na mesma área"], "ans": [1], "expl": "<p>A condição de viabilidade compara a distância anunciada do vizinho com a feasible distance do sucessor.<\/p>"}, {"q": "Qual a distância administrativa padrão de uma rota EIGRP interna?", "type": "mc", "opts": ["90", "110", "120", "170"], "ans": [0], "expl": "<p>90 para interna e 170 para externa. 110 é o OSPF e 120 é o RIP.<\/p>"}, {"q": "Na seleção de caminho do BGP em roteadores Cisco, qual atributo é comparado primeiro?", "type": "mc", "opts": ["AS-path", "MED", "Local preference", "Weight"], "ans": [3], "expl": "<p>O weight, que é exclusivo da Cisco e local ao roteador. Depois vem a local preference.<\/p>"}, {"q": "Qual tecnologia permite tabelas de roteamento separadas no mesmo roteador?", "type": "mc", "opts": ["VRF", "HSRP", "PBR", "NetFlow"], "ans": [0], "expl": "<p>A VRF. O PBR escolhe caminho por política, mas usa a mesma tabela.<\/p>"}, {"q": "Quantos bits tem o identificador de segmento do VXLAN (VNI)?", "type": "mc", "opts": ["12", "16", "24", "32"], "ans": [2], "expl": "<p>24 bits, cerca de 16 milhões de segmentos.<\/p>"}, {"q": "No SD-Access, qual protocolo forma o plano de controle do fabric?", "type": "mc", "opts": ["OSPF", "LISP", "BGP", "EIGRP"], "ans": [1], "expl": "<p>O LISP. O plano de dados é o VXLAN e a política usa o TrustSec.<\/p>"}, {"q": "Qual recurso protege a CPU do roteador limitando o tráfego destinado ao plano de controle?", "type": "mc", "opts": ["CoPP", "SPAN", "IP SLA", "QoS LLQ"], "ans": [0], "expl": "<p>O CoPP (Control Plane Policing).<\/p>"}, {"q": "Qual ferramenta copia o tráfego de uma porta para outra, onde fica um analisador, no mesmo switch?", "type": "mc", "opts": ["NetFlow", "SPAN", "IP SLA", "EEM"], "ans": [1], "expl": "<p>O SPAN. O RSPAN leva a cópia por VLAN a outro switch, e o ERSPAN, por túnel GRE.<\/p>"}, {"q": "Qual combinação é comum para levar protocolos de roteamento por um túnel criptografado?", "type": "mc", "opts": ["VXLAN sobre LISP", "GRE sobre IPsec", "SPAN sobre GRE", "IPsec sobre ARP"], "ans": [1], "expl": "<p>GRE sobre IPsec: o GRE carrega multicast e roteamento, e o IPsec criptografa.<\/p>"}, {"q": "Para onde foi o wireless que saiu da ENCOR em 2026?", "type": "mc", "opts": ["Para a CCNA", "Para a ENARSI", "Para a trilha CCNP Wireless (350-101 WLCOR)", "Para o CCIE apenas"], "ans": [2], "expl": "<p>Para o CCNP Wireless, com o core 350-101 WLCOR.<\/p>"}], "scoring": null};</script><script src="../../assets/app.js"></script></body></html>
