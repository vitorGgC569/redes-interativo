<footer class="foot"><span>Curso de Redes de Computadores</span><span>·</span><a href="../../">Todas as atividades</a><span>·</span><span>Seu progresso fica salvo só neste navegador.</span></footer>
</main><script>window.ACT={"kind": "exam", "id": "m08-sim", "title": "Simulado do módulo 8", "minutes": 15, "goal": 13, "qs": [{"q": "Qual protocolo de transporte usa o handshake de três vias?", "type": "mc", "opts": ["UDP", "TCP", "ICMP", "ARP"], "ans": [1], "expl": "<p>O TCP abre conexão com SYN, SYN+ACK e ACK. O UDP não tem conexão, e ICMP e ARP nem são protocolos de transporte.<\/p>"}, {"q": "Qual destas portas está na faixa das bem conhecidas?", "type": "mc", "opts": ["443", "3389", "8080", "49152"], "ans": [0], "expl": "<p>As bem conhecidas vão de 0 a 1023. A 3389 e a 8080 são registradas, e a 49152 é o começo das dinâmicas.<\/p>"}, {"q": "Qual o tamanho do cabeçalho UDP?", "type": "mc", "opts": ["4 bytes", "8 bytes", "20 bytes", "60 bytes"], "ans": [1], "expl": "<p>São 8 bytes: portas de origem e destino, comprimento e checksum, com 16 bits cada.<\/p>"}, {"q": "Quais flags estão ligadas no segundo segmento do handshake?", "type": "mc", "opts": ["SYN", "ACK", "SYN e ACK", "FIN e ACK"], "ans": [2], "expl": "<p>O servidor responde com SYN e ACK no mesmo segmento.<\/p>"}, {"q": "Qual serviço usa a porta UDP 69?", "type": "mc", "opts": ["TFTP", "SNMP", "NTP", "Syslog"], "ans": [0], "expl": "<p>O TFTP usa UDP 69. O SNMP usa 161 e 162, o NTP usa 123 e o syslog usa 514.<\/p>"}, {"q": "Para que serve a flag RST?", "type": "mc", "opts": ["Reiniciar o roteador", "Abortar ou recusar uma conexão", "Pedir retransmissão do último segmento", "Confirmar dados"], "ans": [1], "expl": "<p>O RST derruba a conexão imediatamente, ou recusa uma tentativa numa porta fechada.<\/p>"}, {"q": "O número de confirmação (ACK) do TCP indica:", "type": "mc", "opts": ["O último byte enviado", "O próximo byte que se espera receber", "O tamanho da janela", "O número da porta"], "ans": [1], "expl": "<p>O ACK é cumulativo e informa o próximo byte esperado, ou seja, confirma tudo o que veio antes.<\/p>"}, {"q": "O controle de fluxo do TCP é feito principalmente por:", "type": "mc", "opts": ["cwnd", "A janela anunciada pelo receptor", "TTL", "MTU"], "ans": [1], "expl": "<p>O receptor anuncia no campo janela quanto cabe no buffer. O cwnd é do controle de congestionamento, e TTL e MTU são do IP.<\/p>"}, {"q": "A janela de congestionamento (cwnd) tem como objetivo:", "type": "mc", "opts": ["Proteger o receptor de excesso de dados", "Proteger a rede de congestionamento", "Criptografar o tráfego", "Detectar erros de bit"], "ans": [1], "expl": "<p>A cwnd é uma janela mantida pelo remetente, que cresce enquanto não há perdas e diminui quando há, protegendo a rede. Quem protege o receptor é a janela anunciada.<\/p>"}, {"q": "Um socket é a combinação de:", "type": "mc", "opts": ["MAC e porta", "IP e porta", "IP e máscara", "Porta e VLAN"], "ans": [1], "expl": "<p>Endereço IP mais número da porta, por exemplo 192.168.1.10:50001.<\/p>"}, {"q": "Qual lado de uma conexão TCP entra em TIME-WAIT?", "type": "mc", "opts": ["Quem enviou o primeiro SYN", "Quem enviou o primeiro FIN, ao receber o FIN final do outro", "O servidor, sempre", "Nenhum dos dois"], "ans": [1], "expl": "<p>Quem fecha primeiro (envia o primeiro FIN) espera em TIME-WAIT depois de enviar o último ACK, para garantir que o outro lado o recebeu.<\/p>"}, {"q": "Quais as portas UDP do DHCP?", "type": "mc", "opts": ["53 e 54", "67 e 68", "80 e 443", "161 e 162"], "ans": [1], "expl": "<p>Servidor na 67 e cliente na 68. A 53 é DNS e a 161 e 162 são SNMP.<\/p>"}, {"q": "Qual comando lista os sockets TCP e UDP em escuta no Linux?", "type": "mc", "opts": ["<code>ss -tuln<\/code>", "<code>ipconfig /all<\/code>", "<code>arp -a<\/code>", "<code>tracert<\/code>"], "ans": [0], "expl": "<p>No Linux, <code>ss -tuln<\/code> mostra os sockets TCP e UDP em escuta, sem resolver nomes. <code>ipconfig<\/code> mostra IP, <code>arp -a<\/code> mostra a tabela ARP e <code>tracert<\/code> mostra o caminho.<\/p>"}, {"q": "Qual filtro do Wireshark mostra só os SYN iniciais (sem SYN+ACK)?", "type": "mc", "opts": ["<code>tcp.port == 80<\/code>", "<code>tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0<\/code>", "<code>udp.port == 53<\/code>", "<code>tcp.analysis.retransmission<\/code>"], "ans": [1], "expl": "<p>O SYN inicial tem SYN ligado e ACK desligado. No SYN+ACK os dois estão ligados.<\/p>"}, {"q": "Por que o DNS usa UDP na maioria das consultas?", "type": "mc", "opts": ["UDP é criptografado", "Pergunta e resposta cabem em poucos bytes, e evitar o handshake economiza tempo", "O TCP não funciona na porta 53", "UDP garante a entrega"], "ans": [1], "expl": "<p>Em geral a pergunta e a resposta são pequenas, e o UDP evita o handshake. Quando a resposta é grande demais ou numa transferência de zona o DNS usa TCP, então a C está errada. A A e a D também estão: o UDP não criptografa nada e não garante entrega.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
