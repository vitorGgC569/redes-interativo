</main><script>window.ACT={"kind": "cards", "id": "m04-ex", "sections": [{"title": "Fácil", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Quantos bits tem um endereço MAC? E quantos bytes?<\/p>", "a": "<p><b>48 bits = 6 bytes<\/b>.<\/p>", "kw": ["48 bits = 6 bytes"]}, {"id": "s1q2", "n": 2, "q": "<p>Qual o MAC de broadcast?<\/p>", "a": "<p><b>FF:FF:FF:FF:FF:FF<\/b>.<\/p>", "kw": ["FF:FF:FF:FF:FF:FF"]}, {"id": "s1q3", "n": 3, "q": "<p>Qual o tamanho mínimo e o máximo de um quadro Ethernet II (sem tag VLAN)?<\/p>", "a": "<p><b>64<\/b> e <b>1518 bytes<\/b> (1522 com tag 802.1Q).<\/p>", "kw": ["64", "1518 bytes"]}, {"id": "s1q4", "n": 4, "q": "<p>O que o switch grava na tabela MAC ao receber um quadro: o MAC de origem ou de destino?<\/p>", "a": "<p>O <b>MAC de origem<\/b>, associado à porta de entrada. O destino é só consultado.<\/p>", "kw": ["MAC de origem"]}, {"id": "s1q5", "n": 5, "q": "<p>O ARP é usado para descobrir o quê a partir de quê?<\/p>", "a": "<p>O <b>MAC<\/b> a partir do <b>IP<\/b> (na mesma rede local).<\/p>", "kw": ["MAC", "IP"]}], "tail": ""}, {"title": "Fácil/médio: lendo um MAC", "intro": "<p>Para cada MAC, diga (a) o OUI, (b) se é unicast ou multicast, (c) se é global ou local.<\/p>", "items": [{"id": "s2q1", "n": 1, "q": "<p><code>00:1A:2B:3C:4D:5E<\/code><\/p>", "a": "<p>OUI <code>00:1A:2B<\/code>. Primeiro byte 00 = 00000000: <b>unicast<\/b>, <b>global<\/b>.<\/p>", "kw": ["unicast", "global"]}, {"id": "s2q2", "n": 2, "q": "<p><code>01:00:5E:00:00:05<\/code><\/p>", "a": "<p>OUI <code>01:00:5E<\/code>. 01 = 00000001: bit I/G = 1, <b>multicast<\/b> (é o multicast IPv4, no exemplo do OSPF 224.0.0.5); bit U/L = 0, global.<\/p>", "kw": ["multicast"]}, {"id": "s2q3", "n": 3, "q": "<p><code>02:42:AC:11:00:02<\/code><\/p>", "a": "<p>OUI <code>02:42:AC<\/code>. 02 = 00000010: <b>unicast<\/b>, <b>local<\/b> (U/L = 1), padrão de interfaces virtuais (por exemplo, contêineres).<\/p>", "kw": ["unicast", "local"]}, {"id": "s2q4", "n": 4, "q": "<p><code>FF:FF:FF:FF:FF:FF<\/code><\/p>", "a": "<p>FF = 11111111: <b>multicast/broadcast<\/b> e <b>local<\/b> (ambos os bits em 1); é o broadcast.<\/p>", "kw": ["multicast/broadcast", "local"]}], "tail": "<p>Para descobrir o fabricante de um OUI real, use uma consulta de OUI (por exemplo, a ferramenta de pesquisa de OUI do Wireshark).<\/p>"}, {"title": "Médio: multicast e tempo", "intro": "", "items": [{"id": "s3q1", "n": 1, "q": "<p>Qual é o MAC multicast do IPv4 224.0.0.9 (RIPv2)?<\/p>", "a": "<p><code>01:00:5E<\/code> + últimos 23 bits do IP. 224.0.0.9 → os 3 últimos bytes 00.00.09, então <b>01:00:5E:00:00:09<\/b>.<\/p>", "kw": ["01:00:5E:00:00:09"]}, {"id": "s3q2", "n": 2, "q": "<p>Quanto tempo leva para transmitir um quadro de 1518 bytes a 1 Gb/s?<\/p>", "a": "<p>1518 × 8 = 12.144 bits; 12.144 ÷ 1.000.000.000 = <b>12,144 µs<\/b>.<\/p>", "kw": ["12,144 µs"]}, {"id": "s3q3", "n": 3, "q": "<p>Qual o tamanho mínimo do campo de dados (payload) em um quadro de 64 bytes?<\/p>", "a": "<p>64 − 14 (cabeçalho) − 4 (FCS) = <b>46 bytes<\/b>. Se o pacote for menor, o padding completa.<\/p>", "kw": ["46 bytes"]}], "tail": ""}, {"title": "Médio: tabela MAC passo a passo", "intro": "", "items": [{"id": "s4all", "n": null, "q": "<p>O switch SW1 acabou de ser ligado (tabela vazia). PC-A (MAC A) na porta 1, PC-B (MAC B) na porta 2, PC-C (MAC C) na porta 3. Ocorrem em ordem: (1) A envia para B; (2) B responde para A; (3) C envia broadcast; (4) A envia para C.<\/p>\n<p>Para cada evento, diga como o switch trata o quadro e como fica a tabela ao final.<\/p>", "a": "<ol><li>A → B: aprende <b>A = porta 1<\/b>. Destino B desconhecido: <b>inunda<\/b> (portas 2 e 3).<\/li><li>B → A: aprende <b>B = porta 2<\/b>. A é conhecido: <b>encaminha só pela porta 1<\/b>.<\/li><li>C → broadcast: aprende <b>C = porta 3<\/b>. Broadcast sempre é <b>inundado<\/b> (portas 1 e 2).<\/li><li>A → C: C conhecido: encaminha só pela porta 3.<\/li><\/ol>\n<p>Tabela final: A=1, B=2, C=3. Note que o endereço de <b>destino nunca<\/b> é gravado; só o de origem.<\/p>", "kw": []}], "tail": ""}, {"title": "Médio/difícil: domínios", "intro": "", "items": [{"id": "s5all", "n": null, "q": "<p>Topologia: o roteador R1 tem duas interfaces: Gi0/0 liga ao SW1 e Gi0/1 liga ao SW2. O SW1 tem: PC1, R1 e um <b>hub<\/b> (com PC2 e PC3 conectados ao hub). O SW2 tem: PC4, PC5 e R1. Quantos domínios de colisão e quantos de broadcast existem?<\/p>", "a": "<p><b>Domínios de colisão = 6.<\/b> SW1: porta de PC1 (1), porta de R1 (1) e a porta do hub, que, com PC2 e PC3, forma um único domínio (1) = 3. SW2: PC4, PC5 e R1 = 3. Total 3 + 3 = 6.<\/p>\n<p><b>Domínios de broadcast = 2:<\/b> um para cada interface do roteador (a rede do SW1 e a rede do SW2).<\/p>", "kw": []}], "tail": ""}, {"title": "Difícil: ARP e quadros", "intro": "<p>PC-A (192.168.1.10/24, MAC AA) quer enviar um pacote para o servidor 10.5.5.5. O gateway é 192.168.1.1 (MAC GG). O cache ARP de A está vazio.<\/p>", "items": [{"id": "s6q1", "n": 1, "q": "<p>Qual IP o PC-A tenta resolver por ARP? Por quê?<\/p>", "a": "<p><b>192.168.1.1<\/b>, o IP do gateway: o destino 10.5.5.5 está fora da sub-rede (192.168.1.0/24), então o PC entrega o quadro ao gateway.<\/p>", "kw": ["192.168.1.1"]}, {"id": "s6q2", "n": 2, "q": "<p>Qual o MAC de destino e o IP de destino do quadro de dados enviado?<\/p>", "a": "<p>MAC destino = <b>GG<\/b> (gateway); IP destino = <b>10.5.5.5<\/b> (permanece o do servidor).<\/p>", "kw": ["GG", "10.5.5.5"]}, {"id": "s6q3", "n": 3, "q": "<p>Qual o MAC de destino do ARP Request?<\/p>", "a": "<p><b>FF:FF:FF:FF:FF:FF<\/b> (broadcast). A resposta ARP é unicast para AA.<\/p>", "kw": ["FF:FF:FF:FF:FF:FF"]}, {"id": "s6q4", "n": 4, "q": "<p>Se o gateway estiver desligado, o que acontece?<\/p>", "a": "<p>Não haverá ARP Reply; a entrada fica \"incompleta\" e o envio falha (ping com \"Destination host unreachable\" ou timeout). Problema de camada 2/3 local.<\/p>", "kw": []}], "tail": ""}, {"title": "Desafio", "intro": "", "items": [{"id": "s7q1", "n": 1, "q": "<p>Um link entre um switch (automático) e um servidor (duplex fixado em full, velocidade 1000) fica lento, e <code>show interfaces<\/code> no switch mostra muitas colisões tardias e erros de CRC. Explique a causa provável e a correção.<\/p>", "a": "<p>Provável <b>duplex mismatch<\/b>: o servidor está fixo em full-duplex e o switch, em auto, não recebe a negociação e assume <b>half-duplex<\/b>. O lado half detecta colisões quando o outro transmite ao mesmo tempo. Correção: usar <b>auto nos dois lados<\/b> (ou fixar nos dois com os mesmos valores) e limpar os contadores para confirmar.<\/p>", "kw": ["duplex mismatch", "half-duplex", "auto nos dois lados"]}, {"id": "s7q2", "n": 2, "q": "<p>Em um quadro capturado, o campo EtherType é 0x0806. Qual protocolo vem dentro? E se for 0x86DD?<\/p>", "a": "<p>0x0806 = <b>ARP<\/b>; 0x86DD = <b>IPv6<\/b>.<\/p>", "kw": ["ARP", "IPv6"]}, {"id": "s7q3", "n": 3, "q": "<p>Calcule a eficiência (dados úteis ÷ bytes no fio) de um quadro com 46 bytes de payload, considerando preâmbulo (8) e intervalo entre quadros (12), cabeçalho (14) e FCS (4). Compare com 1500 bytes de payload.<\/p>", "a": "<p>Bytes no fio: 8 + 14 + 46 + 4 + 12 = 84 → 46 ÷ 84 = <b>54,8%<\/b>. Com 1500: 8 + 14 + 1500 + 4 + 12 = 1538 → 1500 ÷ 1538 = <b>97,5%<\/b>. Quadros pequenos desperdiçam mais banda com overhead.<\/p>", "kw": ["54,8%", "97,5%"]}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
