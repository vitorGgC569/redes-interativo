</main><script>window.ACT={"kind": "cards", "id": "m01-ex", "sections": [{"title": "Binário → decimal", "intro": "", "items": [{"id": "s1all", "n": null, "q": "<ol><li>00000001<\/li><li>00001111<\/li><li>00010000<\/li><li>10000000<\/li><li>11110000<\/li><li>11111000<\/li><li>01100100<\/li><li>10101010<\/li><li>11100000<\/li><li>00110111<\/li><\/ol>", "a": "<table><thead><tr><th>Nº<\/th><th>Resposta<\/th><th>Conta<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>15<\/td><td>8+4+2+1<\/td><\/tr><tr><td>3<\/td><td>16<\/td><td>16<\/td><\/tr><tr><td>4<\/td><td>128<\/td><td>128<\/td><\/tr><tr><td>5<\/td><td>240<\/td><td>128+64+32+16<\/td><\/tr><tr><td>6<\/td><td>248<\/td><td>128+64+32+16+8<\/td><\/tr><tr><td>7<\/td><td>100<\/td><td>64+32+4<\/td><\/tr><tr><td>8<\/td><td>170<\/td><td>128+32+8+2<\/td><\/tr><tr><td>9<\/td><td>224<\/td><td>128+64+32<\/td><\/tr><tr><td>10<\/td><td>55<\/td><td>32+16+4+2+1<\/td><\/tr><\/tbody><\/table>", "kw": []}], "tail": ""}, {"title": "Decimal → binário (8 bits)", "intro": "", "items": [{"id": "s2all", "n": null, "q": "<ol><li>5<\/li><li>12<\/li><li>25<\/li><li>64<\/li><li>99<\/li><li>127<\/li><li>150<\/li><li>200<\/li><li>224<\/li><li>255<\/li><\/ol>", "a": "<table><thead><tr><th>Nº<\/th><th>Resposta<\/th><th>Conta<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>00000101<\/td><td>4+1<\/td><\/tr><tr><td>2<\/td><td>00001100<\/td><td>8+4<\/td><\/tr><tr><td>3<\/td><td>00011001<\/td><td>16+8+1<\/td><\/tr><tr><td>4<\/td><td>01000000<\/td><td>64<\/td><\/tr><tr><td>5<\/td><td>01100011<\/td><td>64+32+2+1<\/td><\/tr><tr><td>6<\/td><td>01111111<\/td><td>127 = 128 − 1<\/td><\/tr><tr><td>7<\/td><td>10010110<\/td><td>128+16+4+2<\/td><\/tr><tr><td>8<\/td><td>11001000<\/td><td>128+64+8<\/td><\/tr><tr><td>9<\/td><td>11100000<\/td><td>128+64+32<\/td><\/tr><tr><td>10<\/td><td>11111111<\/td><td>todos os bits<\/td><\/tr><\/tbody><\/table>", "kw": []}], "tail": ""}, {"title": "Hexadecimal", "intro": "", "items": [{"id": "s3q1", "n": 1, "q": "<p>Binário → hex: 11111111<\/p>", "a": "<p>FF (1111 1111)<\/p>", "kw": []}, {"id": "s3q2", "n": 2, "q": "<p>Binário → hex: 10100101<\/p>", "a": "<p>A5 (1010 = A; 0101 = 5)<\/p>", "kw": []}, {"id": "s3q3", "n": 3, "q": "<p>Binário → hex: 00111100<\/p>", "a": "<p>3C (0011 = 3; 1100 = C)<\/p>", "kw": []}, {"id": "s3q4", "n": 4, "q": "<p>Hex → decimal: 0x2F<\/p>", "a": "<p>47 (2×16 + 15)<\/p>", "kw": []}, {"id": "s3q5", "n": 5, "q": "<p>Hex → decimal: 0xC0<\/p>", "a": "<p>192 (12×16 + 0)<\/p>", "kw": []}, {"id": "s3q6", "n": 6, "q": "<p>Hex → decimal: 0x7E<\/p>", "a": "<p>126 (7×16 + 14)<\/p>", "kw": []}, {"id": "s3q7", "n": 7, "q": "<p>Decimal → hex: 255<\/p>", "a": "<p>FF (15×16 + 15 = 255)<\/p>", "kw": []}, {"id": "s3q8", "n": 8, "q": "<p>Decimal → hex: 172<\/p>", "a": "<p>AC (172 = 10×16 + 12)<\/p>", "kw": []}, {"id": "s3q9", "n": 9, "q": "<p>Decimal → hex: 100<\/p>", "a": "<p>64 (100 = 6×16 + 4)<\/p>", "kw": []}], "tail": ""}, {"title": "Bits, bytes e velocidade", "intro": "", "items": [{"id": "s4q1", "n": 1, "q": "<p>Quantos valores diferentes cabem em 1 byte? E em 3 bits? E em 10 bits?<\/p>", "a": "<p>256; 8; 1.024.<\/p>", "kw": []}, {"id": "s4q2", "n": 2, "q": "<p>Quantos bits há em 1.500 bytes (tamanho típico máximo do payload de um quadro Ethernet)?<\/p>", "a": "<p>1.500 × 8 = 12.000 bits.<\/p>", "kw": []}, {"id": "s4q3", "n": 3, "q": "<p>Quanto tempo leva, no mínimo, para baixar 250 MB em um link de 200 Mbps?<\/p>", "a": "<p>250 × 8 = 2.000 Mb; 2.000 ÷ 200 = 10 segundos.<\/p>", "kw": []}, {"id": "s4q4", "n": 4, "q": "<p>Um link de 1 Gbps equivale a quantos MB/s (teóricos)?<\/p>", "a": "<p>1.000 Mbps ÷ 8 = 125 MB/s.<\/p>", "kw": []}, {"id": "s4q5", "n": 5, "q": "<p>Quantos bits tem um endereço IPv4? Um MAC? Um IPv6?<\/p>", "a": "<p>IPv4: 32 bits; MAC: 48 bits; IPv6: 128 bits.<\/p>", "kw": []}, {"id": "s4q6", "n": 6, "q": "<p>Qual o maior valor decimal de 4 bits? E de 8 bits?<\/p>", "a": "<p>15 (2⁴ − 1) e 255 (2⁸ − 1).<\/p>", "kw": []}], "tail": ""}, {"title": "Computador e rede (conceitual)", "intro": "", "items": [{"id": "s5q1", "n": 1, "q": "<p>Qual componente guarda dados temporariamente enquanto os programas executam?<\/p>", "a": "<p>RAM.<\/p>", "kw": []}, {"id": "s5q2", "n": 2, "q": "<p>Qual componente liga o computador à rede e possui endereço MAC?<\/p>", "a": "<p>NIC (placa de rede / interface de rede).<\/p>", "kw": []}, {"id": "s5q3", "n": 3, "q": "<p>O que acontece com o conteúdo da RAM quando o computador é desligado? E com o de um SSD?<\/p>", "a": "<p>A RAM é volátil e perde o conteúdo; o SSD é não volátil e mantém.<\/p>", "kw": []}, {"id": "s5q4", "n": 4, "q": "<p>Por que a startup-config de um roteador não some quando ele é desligado?<\/p>", "a": "<p>Porque é gravada em memória não volátil (NVRAM), ao contrário da running-config, que fica na RAM.<\/p>", "kw": []}], "tail": ""}, {"title": "Desafios", "intro": "", "items": [{"id": "s6q1", "n": 1, "q": "<p>Converta cada octeto de 172.16.5.9 para binário.<\/p>", "a": "<p>172 = 10101100; 16 = 00010000; 5 = 00000101; 9 = 00001001.<\/p>", "kw": []}, {"id": "s6q2", "n": 2, "q": "<p>Calcule 172.16.5.9 AND 255.255.0.0.<\/p>", "a": "<p>Octetos com 255 mantêm o valor; octetos com 0 zeram: <b>172.16.0.0<\/b>.<\/p>", "kw": ["172.16.0.0"]}, {"id": "s6q3", "n": 3, "q": "<p>Converta o MAC <code>00:1A:2B:3C:4D:5E<\/code> para binário (somente os dois primeiros bytes).<\/p>", "a": "<p>00 = 00000000; 1A = 0001 1010 = 00011010.<\/p>", "kw": []}, {"id": "s6q4", "n": 4, "q": "<p>Qual o valor decimal de 0xFFFF? (dica: 16 bits ligados)<\/p>", "a": "<p>2¹⁶ − 1 = <b>65.535<\/b>.<\/p>", "kw": ["65.535"]}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
