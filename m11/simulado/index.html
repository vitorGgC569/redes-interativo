<header class="top"><p class="eyebrow">Módulo 11 · Roteamento estático, OSPF e BGP</p><h1>Simulado</h1><p class="lead">15 questões, cronômetro e revisão comentada.</p></header>

</main><script>window.ACT={"kind": "exam", "id": "m11-sim", "title": "Simulado do módulo 11", "minutes": 15, "goal": 13, "qs": [{"q": "O que a tabela de roteamento contém?", "type": "mc", "opts": ["Endereços MAC das portas", "Redes de destino e como chegar a elas", "Nomes DNS", "Leases de DHCP"], "ans": [1], "expl": "<p>A tabela lista as redes de destino e o próximo salto ou a interface de saída para cada uma.<\/p>"}, {"q": "Qual critério o roteador usa primeiro?", "type": "mc", "opts": ["Menor métrica", "Menor distância administrativa", "Prefixo mais longo", "Ordem de aprendizado"], "ans": [2], "expl": "<p>Primeiro o prefixo mais longo, depois a distância administrativa, depois a métrica.<\/p>"}, {"q": "Qual a distância administrativa padrão do OSPF?", "type": "mc", "opts": ["1", "90", "110", "120"], "ans": [2], "expl": "<p>OSPF é 110. EIGRP é 90 e RIP é 120.<\/p>"}, {"q": "Qual comando cria a rota padrão para o provedor 203.0.113.1?", "type": "mc", "opts": ["<code>ip route 0.0.0.0 0.0.0.0 203.0.113.1<\/code>", "<code>ip default 203.0.113.1<\/code>", "<code>route 0.0.0.0/0 203.0.113.1<\/code>", "<code>ip gateway 203.0.113.1<\/code>"], "ans": [0], "expl": "<p>O formato é <code>ip route 0.0.0.0 0.0.0.0 &lt;próximo salto&gt;<\/code>.<\/p>"}, {"q": "O que torna uma rota estática flutuante?", "type": "mc", "opts": ["Usar interface de saída", "Distância administrativa maior que a da rota principal", "Máscara /32", "Estar em IPv6"], "ans": [1], "expl": "<p>A distância mais alta faz a rota ficar escondida até a principal sumir.<\/p>"}, {"q": "Em IPv6, qual comando habilita o roteamento no roteador?", "type": "mc", "opts": ["<code>ipv6 enable<\/code>", "<code>ipv6 unicast-routing<\/code>", "<code>ipv6 routing<\/code>", "<code>ip routing ipv6<\/code>"], "ans": [1], "expl": "<p><code>ipv6 unicast-routing<\/code>. Sem ele, o equipamento não encaminha pacotes IPv6.<\/p>"}, {"q": "Qual o protocolo IP e os endereços multicast do OSPF?", "type": "mc", "opts": ["TCP 179, sem multicast", "UDP 520, 224.0.0.9", "Protocolo 89, 224.0.0.5 e 224.0.0.6", "Protocolo 88, 224.0.0.10"], "ans": [2], "expl": "<p>O OSPF roda direto sobre o IP (protocolo 89) e usa 224.0.0.5 e 224.0.0.6. A opção D é do EIGRP e a B do RIPv2.<\/p>"}, {"q": "Qual parâmetro NÃO precisa coincidir para dois roteadores virarem vizinhos OSPF?", "type": "mc", "opts": ["Área", "Intervalo Hello", "Sub-rede", "ID do processo OSPF"], "ans": [3], "expl": "<p>O ID do processo é local e pode ser diferente. Área, Hello e sub-rede precisam coincidir.<\/p>"}, {"q": "Quem é o DR em um segmento multiacesso?", "type": "mc", "opts": ["O de maior prioridade, e no empate, o de maior Router ID", "O de menor IP", "O primeiro a ligar sempre", "O de menor MAC"], "ans": [0], "expl": "<p>Maior prioridade, e no empate o maior Router ID, e a eleição não é preemptiva.<\/p>"}, {"q": "Qual a máscara curinga de uma rede /26?", "type": "mc", "opts": ["0.0.0.63", "0.0.0.31", "0.0.0.127", "0.0.0.255"], "ans": [0], "expl": "<p>/26 é 255.255.255.192, e o curinga é 0.0.0.63.<\/p>"}, {"q": "Com a referência padrão do OSPF, qual o custo de uma interface Gigabit?", "type": "mc", "opts": ["10", "100", "1", "0"], "ans": [2], "expl": "<p>100 Mbit/s dividido por 1000 Mbit/s dá 0,1, arredondado para o mínimo, 1.<\/p>"}, {"q": "Um vizinho OSPF está preso em ExStart. Qual a causa mais provável?", "type": "mc", "opts": ["MTU diferente", "Senha de enable errada", "Hostname repetido", "Banner configurado"], "ans": [0], "expl": "<p>MTU diferente trava a troca de DBD (ExStart e Exchange).<\/p>"}, {"q": "Qual o código de uma rota OSPF de outra área na tabela?", "type": "mc", "opts": ["O", "O IA", "O E2", "B"], "ans": [1], "expl": "<p>O IA indica rota inter-area. O O é da mesma área e O E2 é externa.<\/p>"}, {"q": "Qual protocolo foi feito para trocar rotas entre sistemas autônomos?", "type": "mc", "opts": ["OSPF", "RIP", "BGP", "EIGRP"], "ans": [2], "expl": "<p>BGP é o EGP, usado entre sistemas autônomos.<\/p>"}, {"q": "Em qual caso a rota estática padrão é a melhor escolha?", "type": "mc", "opts": ["Rede de 200 roteadores", "Filial com um único caminho para a matriz", "Ligação a dois provedores com ASN próprio", "Rede que muda de topologia todo dia"], "ans": [1], "expl": "<p>Com um só caminho, a estática padrão basta e não gasta recursos com protocolo.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
