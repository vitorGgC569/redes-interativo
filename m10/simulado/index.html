</main><script>window.ACT={"kind": "exam", "id": "m10-sim", "title": "Simulado do módulo 10", "minutes": 15, "goal": 13, "qs": [{"q": "O que cada VLAN forma?", "type": "mc", "opts": ["Um domínio de colisão", "Um domínio de broadcast", "Um domínio de roteamento", "Uma zona DNS"], "ans": [1], "expl": "<p>Uma VLAN é um domínio de broadcast.<\/p>"}, {"q": "Quantos bytes o 802.1Q adiciona ao quadro Ethernet?", "type": "mc", "opts": ["2", "4", "8", "18"], "ans": [1], "expl": "<p>4 bytes (TPID, PCP, DEI e VID).<\/p>"}, {"q": "Qual a VLAN que atravessa o tronco sem etiqueta por padrão?", "type": "mc", "opts": ["A VLAN 0", "A VLAN nativa", "A VLAN de voz", "A VLAN 1002"], "ans": [1], "expl": "<p>A VLAN nativa trafega sem etiqueta, e é a 1 por padrão.<\/p>"}, {"q": "Qual comando mostra os troncos e as VLANs permitidas?", "type": "mc", "opts": ["<code>show vlan brief<\/code>", "<code>show interfaces trunk<\/code>", "<code>show spanning-tree<\/code>", "<code>show ip interface brief<\/code>"], "ans": [1], "expl": "<p><code>show vlan brief<\/code> não mostra as portas tronco.<\/p>"}, {"q": "No router-on-a-stick, o que a subinterface precisa para a VLAN 20?", "type": "mc", "opts": ["<code>switchport access vlan 20<\/code>", "<code>encapsulation dot1q 20<\/code> e um IP", "<code>vlan 20<\/code>", "<code>channel-group 20<\/code>"], "ans": [1], "expl": "<p>A subinterface tem <code>encapsulation dot1q 20<\/code> e o endereço IP do gateway.<\/p>"}, {"q": "Qual a prioridade padrão do STP na VLAN 10 em um switch Cisco?", "type": "mc", "opts": ["32768", "32778", "4106", "24576"], "ans": [1], "expl": "<p>32768 mais o número da VLAN, 10, dá 32778.<\/p>"}, {"q": "O que decide a root bridge?", "type": "mc", "opts": ["O maior MAC", "O menor Bridge ID", "O switch mais rápido", "O primeiro a ligar"], "ans": [1], "expl": "<p>O menor Bridge ID (prioridade, e depois MAC).<\/p>"}, {"q": "Quais custos o STP clássico usa para 100 Mbit/s e 1 Gbit/s?", "type": "mc", "opts": ["19 e 4", "100 e 19", "4 e 2", "10 e 1"], "ans": [0], "expl": "<p>19 para 100 Mbit/s e 4 para 1 Gbit/s.<\/p>"}, {"q": "Quais os tempos padrão do STP clássico?", "type": "mc", "opts": ["Hello 1 s e forward delay 5 s", "Hello 2 s, forward delay 15 s e max age 20 s", "Hello 10 s e max age 30 s", "Hello 5 s e forward delay 30 s"], "ans": [1], "expl": "<p>Hello de 2 s, forward delay de 15 s e max age de 20 s.<\/p>"}, {"q": "O que o RSTP faz melhor que o STP clássico?", "type": "mc", "opts": ["Usa mais bandas", "Converge em segundos", "Elimina a root bridge", "Dispensa BPDUs"], "ans": [1], "expl": "<p>O RSTP converge em poucos segundos graças à negociação entre vizinhos.<\/p>"}, {"q": "Qual recurso derruba uma porta PortFast que recebe BPDU?", "type": "mc", "opts": ["Root guard", "BPDU Guard", "Loop guard", "DTP"], "ans": [1], "expl": "<p>O BPDU Guard coloca a porta em err-disabled.<\/p>"}, {"q": "Qual par forma um EtherChannel LACP?", "type": "mc", "opts": ["passive e passive", "active e passive", "auto e auto", "on e active"], "ans": [1], "expl": "<p>Active com passive (ou active com active). Passive com passive não forma, e <code>on<\/code> não negocia com LACP.<\/p>"}, {"q": "Qual comando mostra o estado do EtherChannel?", "type": "mc", "opts": ["<code>show etherchannel summary<\/code>", "<code>show lacp trunk<\/code>", "<code>show channel<\/code>", "<code>show interfaces vlan<\/code>"], "ans": [0], "expl": "<p><code>show etherchannel summary<\/code> mostra os grupos e o estado (SU, por exemplo) e as portas (P para agrupada).<\/p>"}, {"q": "Em que situação o router-on-a-stick se torna um problema?", "type": "mc", "opts": ["Quando há poucas VLANs", "Quando o tráfego entre VLANs é muito grande, por usar um único enlace", "Quando se usa 802.1Q", "Quando há um switch só"], "ans": [1], "expl": "<p>Todo o tráfego entre VLANs sobe e desce pelo mesmo enlace.<\/p>"}, {"q": "Uma VLAN não passa pelo tronco, embora exista nos dois switches. Qual a causa mais provável?", "type": "mc", "opts": ["A VLAN está fora da lista de VLANs permitidas do tronco", "A VLAN não tem nome", "A VLAN tem número par", "O DTP está desligado"], "ans": [0], "expl": "<p>O tronco só transporta as VLANs na lista de permitidas. O nome da VLAN e a paridade não interferem.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
