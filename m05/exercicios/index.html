</main><script>window.ACT={"kind": "cards", "id": "m05-ex", "sections": [{"title": "Fácil: classificando endereços", "intro": "", "items": [{"id": "s1all", "n": null, "q": "<p>Classifique cada endereço (privado, público, loopback, APIPA, CGNAT, multicast, documentação): <code>10.20.30.40<\/code>, <code>172.15.1.1<\/code>, <code>172.31.255.254<\/code>, <code>192.168.100.5<\/code>, <code>169.254.10.2<\/code>, <code>127.0.0.5<\/code>, <code>8.8.8.8<\/code>, <code>100.64.1.1<\/code>, <code>224.0.0.5<\/code>, <code>203.0.113.9<\/code>.<\/p>", "a": "<table><thead><tr><th>IP<\/th><th>Tipo<\/th><th>Comentário<\/th><\/tr><\/thead><tbody><tr><td>10.20.30.40<\/td><td>Privado<\/td><td>Dentro de 10.0.0.0/8<\/td><\/tr><tr><td>172.15.1.1<\/td><td><b>Público<\/b><\/td><td>O bloco privado é 172.16 a 172.31; 172.15 está fora<\/td><\/tr><tr><td>172.31.255.254<\/td><td>Privado<\/td><td>Último endereço útil de 172.16.0.0/12<\/td><\/tr><tr><td>192.168.100.5<\/td><td>Privado<\/td><td><\/td><\/tr><tr><td>169.254.10.2<\/td><td>APIPA (link-local)<\/td><td>O host não obteve DHCP<\/td><\/tr><tr><td>127.0.0.5<\/td><td>Loopback<\/td><td>Todo 127.0.0.0/8, não só 127.0.0.1<\/td><\/tr><tr><td>8.8.8.8<\/td><td>Público<\/td><td><\/td><\/tr><tr><td>100.64.1.1<\/td><td>CGNAT (espaço compartilhado)<\/td><td>Não é RFC 1918 nem público \"normal\"<\/td><\/tr><tr><td>224.0.0.5<\/td><td>Multicast<\/td><td>AllSPFRouters (OSPF)<\/td><\/tr><tr><td>203.0.113.9<\/td><td>Documentação (TEST-NET-3)<\/td><td>Não roteável na Internet<\/td><\/tr><\/tbody><\/table>", "kw": []}], "tail": ""}, {"title": "Fácil/médio: máscaras", "intro": "", "items": [{"id": "s2q1", "n": 1, "q": "<p>Converta para decimal pontuado: /20, /23, /27, /30.<\/p>", "a": "<p>/20 = <b>255.255.240.0<\/b> (16 + 4 bits: 11110000 = 240); /23 = <b>255.255.254.0<\/b>; /27 = <b>255.255.255.224<\/b> (11100000 = 224); /30 = <b>255.255.255.252<\/b>.<\/p>", "kw": ["255.255.240.0", "255.255.254.0", "255.255.255.224", "255.255.255.252"]}, {"id": "s2q2", "n": 2, "q": "<p>Converta para prefixo: 255.255.255.192, 255.255.240.0, 255.255.252.0.<\/p>", "a": "<p>255.255.255.192 = <b>/26<\/b> (24 + 2); 255.255.240.0 = <b>/20<\/b> (16 + 4); 255.255.252.0 = <b>/22<\/b> (16 + 6).<\/p>", "kw": ["/26", "/20", "/22"]}, {"id": "s2q3", "n": 3, "q": "<p>Quantos hosts úteis tem uma rede /27?<\/p>", "a": "<p>h = 5 bits: 2^5 − 2 = <b>30 hosts<\/b>.<\/p>", "kw": ["30 hosts"]}], "tail": ""}, {"title": "Médio: rede, broadcast e faixa", "intro": "<p>Para cada interface, calcule endereço de rede, broadcast, primeiro e último host e hosts úteis:<\/p>", "items": [{"id": "s3q1", "n": 1, "q": "<p>192.168.10.77/26<\/p>", "a": "<p><b>192.168.10.77/26<\/b>: bloco 64; rede 192.168.10.64; broadcast 192.168.10.127; hosts .65 a .126; <b>62<\/b> hosts.<\/p>", "kw": ["192.168.10.77/26", "62"]}, {"id": "s3q2", "n": 2, "q": "<p>172.16.45.200/20<\/p>", "a": "<p><b>172.16.45.200/20<\/b>: máscara 255.255.240.0; o bloco no 3º octeto é 256 − 240 = 16; 45 está em 32 a 47. Rede <b>172.16.32.0<\/b>; broadcast <b>172.16.47.255<\/b>; hosts 172.16.32.1 a 172.16.47.254; 2^12 − 2 = <b>4094<\/b> hosts.<\/p>", "kw": ["172.16.45.200/20", "172.16.32.0", "172.16.47.255", "4094"]}, {"id": "s3q3", "n": 3, "q": "<p>10.1.2.3/30<\/p>", "a": "<p><b>10.1.2.3/30<\/b>: bloco 4 (0 a 3). Rede 10.1.2.0; broadcast <b>10.1.2.3<\/b>; hosts .1 e .2; <b>2<\/b> hosts. Armadilha: o endereço informado, 10.1.2.3, é o <b>broadcast<\/b> e não pode ser configurado em um host.<\/p>", "kw": ["10.1.2.3/30", "10.1.2.3", "2", "broadcast"]}], "tail": ""}, {"title": "Médio: mesma rede ou não?", "intro": "<p>Os hosts abaixo podem se comunicar diretamente (sem roteador)?<\/p>", "items": [{"id": "s4q1", "n": 1, "q": "<p>192.168.1.130/25 e 192.168.1.100/25<\/p>", "a": "<p><b>Não.<\/b> /25 divide em 0 a 127 e 128 a 255. O .130 está em 192.168.1.128/25 e o .100 em 192.168.1.0/25.<\/p>", "kw": ["Não."]}, {"id": "s4q2", "n": 2, "q": "<p>10.0.5.10/22 e 10.0.7.200/22<\/p>", "a": "<p><b>Sim.<\/b> /22 tem bloco 4 no 3º octeto: 4 a 7. Ambos estão em 10.0.4.0/22 (10.0.4.0 a 10.0.7.255).<\/p>", "kw": ["Sim."]}, {"id": "s4q3", "n": 3, "q": "<p>172.16.20.1/23 e 172.16.21.254/23<\/p>", "a": "<p><b>Sim.<\/b> /23 tem bloco 2: 20 a 21. Ambos estão em 172.16.20.0/23 (172.16.20.0 a 172.16.21.255). Atenção: .21.254 é um endereço válido de host (o broadcast é .21.255).<\/p>", "kw": ["Sim."]}], "tail": ""}, {"title": "Médio: encontre o erro de configuração", "intro": "", "items": [{"id": "s5q1", "n": 1, "q": "<p>PC 192.168.1.50/24, gateway 192.168.2.1: acessa os vizinhos mas não a Internet. Por quê?<\/p>", "a": "<p>O gateway 192.168.2.1 está <b>fora<\/b> da sub-rede 192.168.1.0/24: o PC não consegue chegar a ele. Corrija o gateway para 192.168.1.1 (ou o IP/máscara).<\/p>", "kw": ["fora"]}, {"id": "s5q2", "n": 2, "q": "<p>PC 10.0.0.255/24: o Windows reclama. Por quê?<\/p>", "a": "<p>10.0.0.255/24 é o <b>endereço de broadcast<\/b> da rede 10.0.0.0/24; não pode ser de host.<\/p>", "kw": ["endereço de broadcast"]}, {"id": "s5q3", "n": 3, "q": "<p>Dois PCs na mesma LAN com 192.168.1.20: o que ocorre?<\/p>", "a": "<p><b>IP duplicado<\/b>: conflito, perdas intermitentes; o Windows alerta \"endereço IP em conflito\". O ARP gratuito ajuda a detectar.<\/p>", "kw": ["IP duplicado"]}, {"id": "s5q4", "n": 4, "q": "<p>Roteador com 192.168.1.1/24 numa porta e PC com 192.168.1.2/25 ligado a ela (gateway 192.168.1.1). Funciona?<\/p>", "a": "<p>Funciona para o PC alcançar o gateway (192.168.1.1 está na faixa 192.168.1.0/25 do PC), mas a <b>máscara incompatível<\/b> é uma má prática: o roteador acha que o PC está na /24 e o PC acha que a rede tem só 126 hosts; hosts .128 a .254 serão tratados como remotos pelo PC e enviados ao gateway. Máscaras devem ser <b>iguais<\/b> dentro da mesma sub-rede.<\/p>", "kw": ["máscara incompatível", "iguais"]}], "tail": ""}, {"title": "Difícil: AND, cabeçalho e fragmentação", "intro": "", "items": [{"id": "s6q1", "n": 1, "q": "<p>Calcule, em binário, o endereço de rede de 192.168.77.130 com máscara 255.255.255.192.<\/p>", "a": "<p>O 4º octeto: 130 = 10000010; 192 = 11000000; AND = 10000000 = 128. Os outros octetos permanecem (a máscara tem 255). Rede: <b>192.168.77.128<\/b> (/26: 128 a 191).<\/p>", "kw": ["192.168.77.128"]}, {"id": "s6q2", "n": 2, "q": "<p>Um cabeçalho IPv4 com IHL = 8 e tamanho total 1500. Quantos bytes tem o cabeçalho e quantos de dados?<\/p>", "a": "<p>Cabeçalho = 8 × 4 = <b>32 bytes<\/b>; dados = 1500 − 32 = <b>1468 bytes<\/b> (o cabeçalho tem 12 bytes de opções).<\/p>", "kw": ["32 bytes", "1468 bytes"]}, {"id": "s6q3", "n": 3, "q": "<p>Um pacote IP de 4000 bytes (20 de cabeçalho, 3980 de dados) precisa passar por um enlace de MTU 1500 (DF = 0). Descreva os fragmentos: tamanho total, bytes de dados, deslocamento (offset) e flag MF.<\/p>", "a": "<p>Cada fragmento comporta 1500 − 20 = 1480 bytes de dados (1480 é divisível por 8 = 185 unidades). Fragmentos:<\/p>", "kw": []}], "tail": "<table><thead><tr><th>Fragmento<\/th><th>Tamanho total<\/th><th>Dados<\/th><th>Offset (unidades de 8 bytes)<\/th><th>MF<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1500<\/td><td>1480<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>1500<\/td><td>1480<\/td><td>185<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>1040<\/td><td>1020<\/td><td>370<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>Conferência: 1480 + 1480 + 1020 = 3980 ✓. O offset do 3º é (1480 + 1480) ÷ 8 = 370.<\/p>"}, {"title": "Desafio", "intro": "", "items": [{"id": "s7q1", "n": 1, "q": "<p>Uma filial precisa de 1000 hosts em uma única sub-rede. Qual o menor prefixo que atende? Qual a máscara e quantos hosts sobram?<\/p>", "a": "<p>Precisa de 2^h − 2 ≥ 1000: h = 9 dá 510 (insuficiente); h = 10 dá <b>1022<\/b>. Prefixo = 32 − 10 = <b>/22<\/b>, máscara <b>255.255.252.0<\/b>, sobram 22 endereços.<\/p>", "kw": ["1022", "/22", "255.255.252.0"]}, {"id": "s7q2", "n": 2, "q": "<p>Quantas sub-redes /24 cabem em um /16? E quantas /26 cabem em um /24?<\/p>", "a": "<p>2^(24 − 16) = <b>256<\/b> redes /24 em um /16; 2^(26 − 24) = <b>4<\/b> redes /26 em um /24.<\/p>", "kw": ["256", "4"]}, {"id": "s7q3", "n": 3, "q": "<p>Um ping para um servidor retornou \"TTL=116\". Estime o TTL inicial e o número de roteadores.<\/p>", "a": "<p>TTL inicial provável = 128 (próximo valor padrão acima de 116); 128 − 116 = <b>12 roteadores<\/b> (estimativa).<\/p>", "kw": ["12 roteadores"]}, {"id": "s7q4", "n": 4, "q": "<p>Um <code>tracert<\/code> mostra, no salto 4, \"* * * Esgotado o tempo limite\". O que isso significa? O destino está inacessível?<\/p>", "a": "<p>O salto 4 não respondeu ao TTL expirado (muitos roteadores/firewalls bloqueiam ou limitam ICMP). Isso <b>não<\/b> significa que o destino está inacessível: se os saltos seguintes responderem, o caminho está funcionando.<\/p>", "kw": ["não"]}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
