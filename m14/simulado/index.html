</main><script>window.ACT={"kind": "exam", "id": "m14-sim", "title": "Simulado do módulo 14", "minutes": 15, "goal": 13, "qs": [{"q": "Que plano é responsável por construir a tabela de roteamento?", "type": "mc", "opts": ["Dados", "Controle", "Gerência", "Física"], "ans": [1], "expl": "<p>O plano de controle constrói as tabelas (OSPF, STP, ARP). O de dados apenas encaminha.<\/p>"}, {"q": "Em uma arquitetura SDN, o que a API northbound conecta?", "type": "mc", "opts": ["Controlador e equipamentos", "Aplicações e controlador", "Dois controladores", "Dois switches"], "ans": [1], "expl": "<p>Northbound é entre as aplicações e o controlador, e southbound entre o controlador e os equipamentos.<\/p>"}, {"q": "Qual protocolo costuma ser usado na API southbound?", "type": "mc", "opts": ["NETCONF", "HTML", "SMTP", "DHCP"], "ans": [0], "expl": "<p>NETCONF (além de RESTCONF, SSH, OpenFlow). HTML, SMTP e DHCP não servem a esse fim.<\/p>"}, {"q": "Qual verbo HTTP é usado para criar um recurso?", "type": "mc", "opts": ["GET", "POST", "DELETE", "HEAD"], "ans": [1], "expl": "<p>POST cria. GET lê, DELETE apaga.<\/p>"}, {"q": "Qual código de status significa \"não autenticado\"?", "type": "mc", "opts": ["200", "401", "404", "500"], "ans": [1], "expl": "<p>401 Unauthorized, não autenticado. 404 é recurso inexistente.<\/p>"}, {"q": "Qual delas é uma estrutura JSON válida?", "type": "mc", "opts": ["<code>{'a': 1}<\/code>", "<code>{\"a\": 1}<\/code>", "<code>{a: 1}<\/code>", "<code>{\"a\": 1,}<\/code>"], "ans": [1], "expl": "<p>JSON exige aspas duplas nas chaves, e não aceita aspas simples, chave sem aspas nem vírgula no final.<\/p>"}, {"q": "Que formato de dados usa indentação, e é o padrão dos playbooks do Ansible?", "type": "mc", "opts": ["XML", "JSON", "YAML", "CSV"], "ans": [2], "expl": "<p>YAML.<\/p>"}, {"q": "Qual ferramenta é agentless e usa um modelo push?", "type": "mc", "opts": ["Puppet", "Chef", "Ansible", "Todas as anteriores"], "ans": [2], "expl": "<p>Só o Ansible é agentless e push. Puppet e Chef usam agentes e modelo pull, em geral.<\/p>"}, {"q": "O que o YANG faz?", "type": "mc", "opts": ["Transporta mensagens de configuração", "Modela os dados de configuração", "Criptografa a sessão", "Substitui o SSH"], "ans": [1], "expl": "<p>O YANG modela os dados. Quem transporta é o NETCONF ou o RESTCONF.<\/p>"}, {"q": "Qual a porta padrão do NETCONF sobre SSH?", "type": "mc", "opts": ["22", "80", "443", "830"], "ans": [3], "expl": "<p>830. A porta 22 é a do SSH em geral, e 443 é a do HTTPS (RESTCONF).<\/p>"}, {"q": "O que é o underlay?", "type": "mc", "opts": ["A rede virtual dos usuários", "A rede física de transporte", "O controlador", "O banco de dados"], "ans": [1], "expl": "<p>O underlay é a rede IP física. O overlay é a virtual por cima dela.<\/p>"}, {"q": "Qual a vantagem do VXLAN sobre a VLAN tradicional em termos de escala?", "type": "mc", "opts": ["Usa menos energia", "Identificador de 24 bits (cerca de 16 milhões de segmentos)", "Funciona sem IP", "Elimina o STP"], "ans": [1], "expl": "<p>24 bits de VNI, cerca de 16 milhões, contra 4094 das VLANs.<\/p>"}, {"q": "O que a idempotência garante?", "type": "mc", "opts": ["Que a automação roda mais rápido", "Que rodar de novo o mesmo código produz o mesmo estado, só alterando o necessário", "Que o código é seguro", "Que o equipamento reinicia"], "ans": [1], "expl": "<p>Idempotência é o mesmo resultado a cada execução.<\/p>"}, {"q": "Qual descreve o SASE?", "type": "mc", "opts": ["SD-WAN somada a serviços de segurança entregues pela nuvem", "Um tipo de cabo", "Um protocolo de roteamento", "Um padrão Wi-Fi"], "ans": [0], "expl": "<p>SD-WAN com segurança entregue pela nuvem.<\/p>"}, {"q": "Qual dessas práticas é a mais adequada para as senhas de um projeto de automação?", "type": "mc", "opts": ["Gravar no script", "Em um repositório público", "Em um cofre ou arquivo cifrado (como o Ansible Vault)", "Em um e-mail para a equipe"], "ans": [2], "expl": "<p>Cofre de segredos ou arquivo cifrado, nunca em texto claro no código ou em repositório.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
