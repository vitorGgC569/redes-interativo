</main><script>window.ACT={"kind": "cards", "id": "m14-ex", "sections": [{"title": "Conceitos (fácil)", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Cite três vantagens de automatizar a configuração da rede.<\/p>", "a": "<p>Velocidade (mudanças em minutos), consistência (mesma configuração em todos os equipamentos, sem erros de digitação) e rastreabilidade (o que mudou fica registrado em arquivo, com histórico e possibilidade de desfazer). Também reduz trabalho repetitivo.<\/p>", "kw": []}, {"id": "s1q2", "n": 2, "q": "<p>O que fazem o plano de dados, o plano de controle e o plano de gerência?<\/p>", "a": "<p>O plano de dados encaminha os pacotes de fato. O plano de controle decide como encaminhar e constrói as tabelas (OSPF, STP, ARP). O plano de gerência é o acesso administrativo ao equipamento (SSH, SNMP, syslog, NETCONF).<\/p>", "kw": []}, {"id": "s1q3", "n": 3, "q": "<p>Qual a diferença principal entre uma rede tradicional e uma rede com controlador SDN?<\/p>", "a": "<p>Na rede tradicional, o plano de controle é distribuído, e cada equipamento decide por si. Na SDN, o plano de controle é separado e centralizado em um controlador, que enxerga a rede toda e instrui os equipamentos, e eles ficam com o plano de dados.<\/p>", "kw": []}, {"id": "s1q4", "n": 4, "q": "<p>O que é a API northbound e o que é a API southbound?<\/p>", "a": "<p>A northbound liga aplicações e administradores ao controlador, e em geral é REST com JSON. A southbound liga o controlador aos equipamentos, com protocolos como NETCONF, RESTCONF, SSH e OpenFlow.<\/p>", "kw": []}, {"id": "s1q5", "n": 5, "q": "<p>O que são underlay, overlay e fabric?<\/p>", "a": "<p>O underlay é a rede IP física de transporte, o overlay é a rede virtual criada por túneis (como VXLAN) em cima dela, e a fabric é o conjunto dos dois, gerenciado como uma unidade.<\/p>", "kw": []}, {"id": "s1q6", "n": 6, "q": "<p>O que significa CRUD e qual verbo HTTP corresponde a cada letra?<\/p>", "a": "<p>Create (POST), Read (GET), Update (PUT para substituir o recurso inteiro e PATCH para alterar uma parte) e Delete (DELETE).<\/p>", "kw": []}, {"id": "s1q7", "n": 7, "q": "<p>O que o YANG, o NETCONF e o RESTCONF fazem, e como se relacionam?<\/p>", "a": "<p>O YANG é a linguagem que modela os dados do equipamento. O NETCONF usa esses modelos para ler e configurar, em XML sobre SSH (porta 830). O RESTCONF dá acesso aos mesmos modelos por uma API REST sobre HTTPS, com JSON ou XML.<\/p>", "kw": []}, {"id": "s1q8", "n": 8, "q": "<p>O que significa uma ferramenta ser agentless? Dê um exemplo.<\/p>", "a": "<p>Que nada precisa ser instalado no equipamento gerenciado. O Ansible é o exemplo clássico, e conecta por SSH ou APIs.<\/p>", "kw": []}, {"id": "s1q9", "n": 9, "q": "<p>O que é idempotência em automação?<\/p>", "a": "<p>Rodar a mesma automação várias vezes produz o mesmo resultado, e ela só altera o que ainda não está como deveria. A segunda execução de um playbook deve mostrar changed=0.<\/p>", "kw": []}, {"id": "s1q10", "n": 10, "q": "<p>O REST é um protocolo? Explique.<\/p>", "a": "<p>Não. É um estilo de arquitetura de API sobre HTTP, em que os recursos são identificados por URLs e manipulados com os verbos HTTP, sem guardar estado no servidor entre as requisições.<\/p>", "kw": []}], "tail": ""}, {"title": "Associações (fácil)", "intro": "<p>Ligue cada item da primeira lista à resposta correta.<\/p>", "items": [{"id": "s2q1", "n": 1, "q": "<p>Verbo HTTP para consultar sem alterar.<\/p>", "a": "<p>GET.<\/p>", "kw": []}, {"id": "s2q2", "n": 2, "q": "<p>Verbo HTTP para criar um recurso novo.<\/p>", "a": "<p>POST.<\/p>", "kw": []}, {"id": "s2q3", "n": 3, "q": "<p>Código de status: o recurso foi criado.<\/p>", "a": "<p>201 Created.<\/p>", "kw": []}, {"id": "s2q4", "n": 4, "q": "<p>Código de status: você não se autenticou.<\/p>", "a": "<p>401 Unauthorized.<\/p>", "kw": []}, {"id": "s2q5", "n": 5, "q": "<p>Código de status: você se autenticou, mas não tem permissão.<\/p>", "a": "<p>403 Forbidden.<\/p>", "kw": []}, {"id": "s2q6", "n": 6, "q": "<p>Código de status: recurso não encontrado.<\/p>", "a": "<p>404 Not Found.<\/p>", "kw": []}, {"id": "s2q7", "n": 7, "q": "<p>Ferramenta de configuração em modelo pull com receitas escritas em Ruby.<\/p>", "a": "<p>Chef.<\/p>", "kw": []}, {"id": "s2q8", "n": 8, "q": "<p>Ferramenta que descreve infraestrutura em HCL e tem os comandos plan e apply.<\/p>", "a": "<p>Terraform.<\/p>", "kw": []}], "tail": ""}, {"title": "Lendo JSON, requisições e playbooks (médio)", "intro": "", "items": [{"id": "s3q1", "n": 1, "q": "<p>Dado o JSON abaixo, escreva o que <code>dados[\"vlans\"][1][\"nome\"]<\/code> devolve (em Python) e quantos objetos há na lista.<\/p>\n<pre><code>{\n  \"site\": \"Matriz\",\n  \"ativo\": true,\n  \"vlans\": [\n    { \"id\": 10, \"nome\": \"VENDAS\" },\n    { \"id\": 20, \"nome\": \"RH\" },\n    { \"id\": 30, \"nome\": \"TI\" }\n  ]\n}<\/code><\/pre>", "a": "<p>Devolve <code>RH<\/code> (a contagem da lista começa em zero, então o índice 1 é o segundo item). A lista tem 3 objetos.<\/p>", "kw": []}, {"id": "s3q2", "n": 2, "q": "<p>Aponte os erros neste JSON:<\/p>\n<pre><code>{\n  'host': \"sw1\",\n  \"porta\": 22,\n  \"ativo\": True,\n  \"interfaces\": [\"g0/1\", \"g0/2\",],\n}<\/code><\/pre>", "a": "<p>Quatro erros: as aspas simples em <code>'host'<\/code> (JSON exige aspas duplas), o <code>True<\/code> com maiúscula (o certo é <code>true<\/code>), a vírgula depois de <code>\"g0/2\"<\/code> (vírgula sobrando no fim da lista) e a vírgula depois do último par (que também não é permitida).<\/p>", "kw": []}, {"id": "s3q3", "n": 3, "q": "<p>Leia a requisição e diga o que ela faz, qual o verbo e o que se espera na resposta:<\/p>\n<pre><code>POST https://controlador.exemplo.com/api/v1/vlans\nContent-Type: application/json\nX-Auth-Token: eyJ0eXAi...\n\n{ \"id\": 40, \"nome\": \"VISITANTES\" }<\/code><\/pre>", "a": "<p>É um POST, que cria um recurso novo, uma VLAN 40 chamada VISITANTES, no controlador, usando o token do cabeçalho <code>X-Auth-Token<\/code> para se autenticar e o corpo em JSON. O esperado é um código 2xx, como 201 Created (ou 200/202, conforme a API), com um corpo descrevendo o resultado. Se o token não for válido, voltaria 401.<\/p>", "kw": []}, {"id": "s3q4", "n": 4, "q": "<p>Uma chamada GET devolve 401, e outra, feita depois de um login, devolve 403. O que cada resposta indica?<\/p>", "a": "<p>O 401 indica que a requisição não está autenticada (token ausente, errado ou vencido). O 403 indica que o usuário foi reconhecido, mas o perfil dele não tem permissão para aquele recurso, como o perfil Observer (somente leitura) tentando alterar algo.<\/p>", "kw": []}, {"id": "s3q5", "n": 5, "q": "<p>Leia o trecho de playbook e explique o que ele faz:<\/p>\n<pre><code>- hosts: switches\n  gather_facts: false\n  tasks:\n    - name: Garantir a VLAN 50\n      cisco.ios.ios_vlans:\n        config:\n          - vlan_id: 50\n            name: CAMERAS\n        state: merged<\/code><\/pre>", "a": "<p>Em todos os equipamentos do grupo <code>switches<\/code>, sem coletar fatos, a tarefa garante que a VLAN 50 exista com o nome CAMERAS. Com <code>state: merged<\/code>, ela acrescenta ou ajusta essa VLAN sem apagar as demais.<\/p>", "kw": []}, {"id": "s3q6", "n": 6, "q": "<p>Um administrador roda o playbook acima duas vezes. O que o Ansible reporta na segunda vez e por quê?<\/p>", "a": "<p>Na primeira execução, a tarefa mostra <code>changed<\/code> (a VLAN foi criada). Na segunda, mostra <code>ok<\/code>, sem alteração, porque o estado desejado já existe. É a idempotência.<\/p>", "kw": []}], "tail": ""}, {"title": "Cálculos e decisões (médio)", "intro": "", "items": [{"id": "s4q1", "n": 1, "q": "<p>Quantos segmentos distintos o VXLAN oferece com 24 bits de VNI? Compare com as VLANs.<\/p>", "a": "<p>2^24 = 16.777.216 segmentos, contra 4094 VLANs úteis (de 1 a 4094) no 802.1Q.<\/p>", "kw": []}, {"id": "s4q2", "n": 2, "q": "<p>Escolha o verbo HTTP: (a) listar equipamentos, (b) trocar o nome inteiro de uma VLAN substituindo o recurso, (c) alterar só a descrição de uma interface, (d) remover uma VLAN, (e) criar um novo site.<\/p>", "a": "<p>(a) GET, (b) PUT, (c) PATCH, (d) DELETE, (e) POST.<\/p>", "kw": []}, {"id": "s4q3", "n": 3, "q": "<p>Escolha entre NETCONF e RESTCONF: (a) o time prefere trabalhar com JSON e ferramentas HTTP como o Postman, (b) o time usa uma biblioteca que fala XML sobre SSH.<\/p>", "a": "<p>(a) RESTCONF, (b) NETCONF.<\/p>", "kw": []}, {"id": "s4q4", "n": 4, "q": "<p>Uma equipe de 8 pessoas altera as mesmas configurações em um repositório. Que prática evita que uma sobrescreva o trabalho da outra e que recurso mostra o conflito?<\/p>", "a": "<p>Controle de versão com ramos (branches) e um repositório central. Quando duas pessoas mudam a mesma linha, o Git aponta o conflito na hora de juntar (merge), e uma delas resolve antes de a mudança entrar na versão principal.<\/p>", "kw": []}, {"id": "s4q5", "n": 5, "q": "<p>Para cada necessidade, escolha a ferramenta mais adequada entre Ansible, Terraform, Postman e Python com netmiko: (a) criar um ambiente de nuvem por código com plan e apply, (b) testar manualmente uma chamada de API, (c) rodar a mesma configuração em 40 switches sem instalar agente, (d) ler a saída de <code>show<\/code> e processá-la com lógica própria.<\/p>", "a": "<p>(a) Terraform, (b) Postman, (c) Ansible, (d) Python com netmiko.<\/p>", "kw": []}, {"id": "s4q6", "n": 6, "q": "<p>Converta para YAML o objeto JSON <code>{\"host\": \"sw1\", \"vlans\": [10, 20]}<\/code>.<\/p>", "a": "<pre><code>host: sw1\nvlans:\n  - 10\n  - 20<\/code><\/pre>", "kw": []}], "tail": ""}, {"title": "Cenários (difícil)", "intro": "", "items": [{"id": "s5q1", "n": 1, "q": "<p>O seu script Python recebe o token, mas a segunda chamada (GET da lista de equipamentos) devolve 401. Liste as causas mais prováveis e como corrigir cada uma.<\/p>", "a": "<p>As causas mais prováveis são: o cabeçalho com o token não foi enviado, ou foi enviado com o nome errado (no Catalyst Center é <code>X-Auth-Token<\/code>); o token venceu (tokens têm validade, então peça outro); o token foi pego de outro ambiente ou de outro usuário; ou o script está mandando o token no corpo e não no cabeçalho. A correção é conferir, com <code>print(r.request.headers)<\/code>, o que realmente foi enviado, e renovar o token quando o status for 401.<\/p>", "kw": []}, {"id": "s5q2", "n": 2, "q": "<p>Você precisa criar 12 VLANs em 60 switches da empresa, e depois conferir que todos ficaram iguais. Descreva a abordagem com Ansible (arquivos, módulos e como verifica).<\/p>", "a": "<p>Crie um inventário com os 60 switches agrupados, um playbook com a tarefa <code>cisco.ios.ios_vlans<\/code> listando as 12 VLANs em <code>config<\/code> com <code>state: merged<\/code> (ou <code>replaced<\/code>, se quiser que o switch fique exatamente com aquele conjunto), e rode-o contra o grupo. Para conferir, rode um segundo playbook (ou segunda execução) com <code>state: gathered<\/code> ou <code>ios_command: show vlan brief<\/code> e compare, ou simplesmente rode o mesmo playbook de novo, que deve responder com <code>changed=0<\/code> em todos (idempotência). Senhas ficam no Ansible Vault e o playbook fica no Git.<\/p>", "kw": []}, {"id": "s5q3", "n": 3, "q": "<p>O gerente pergunta por que a empresa deveria comprar um controlador SDN em vez de continuar configurando pela CLI. Dê três argumentos e uma ressalva honesta.<\/p>", "a": "<p>Argumentos: configuração e políticas consistentes e centralizadas para toda a rede; menos erro humano e mais velocidade nas mudanças; visibilidade e análise da saúde da rede em um painel único; provisionamento automático de novos equipamentos. Ressalva: o controlador é um ponto central que precisa ser protegido e ter alta disponibilidade, tem custo de licença e curva de aprendizado, e a equipe precisa saber operar a ferramenta (e continuar sabendo a CLI para diagnosticar).<\/p>", "kw": []}, {"id": "s5q4", "n": 4, "q": "<p>Um colega afirma que \"REST é seguro porque usa token\". Aponte o que está incompleto nessa frase.<\/p>", "a": "<p>O token só resolve a autenticação (quem é você). Falta usar HTTPS (para o token e os dados não irem em texto claro), validade curta e renovação do token, autorização por perfil (o que cada token pode fazer), proteção do token (não colocar em repositório ou em log) e validação das entradas. REST descreve o estilo da API, e não a segurança dela.<\/p>", "kw": []}, {"id": "s5q5", "n": 5, "q": "<p>Você roda <code>ansible-playbook<\/code> e recebe, em um dos switches, <code>UNREACHABLE<\/code>. Que verificações faz, da mais simples para a mais complexa?<\/p>", "a": "<p>Primeiro, o ping para o IP do switch; depois, o SSH manual com o mesmo usuário e senha (o SSH está ativo? a ACL da VTY permite o IP do computador de controle?); depois, conferir <code>ansible_host<\/code>, <code>ansible_user<\/code>, <code>ansible_network_os<\/code> e <code>ansible_connection<\/code> no inventário; depois, a senha e o <code>enable<\/code>; por fim, rodar com <code>-vvv<\/code> para ver o erro detalhado de conexão.<\/p>", "kw": []}, {"id": "s5q6", "n": 6, "q": "<p>Explique, com as suas palavras, o caminho completo de um clique de um administrador no painel de um controlador, até uma VLAN aparecer em um switch.<\/p>", "a": "<p>O administrador aciona a ação no painel. O painel (ou um script) chama a API northbound do controlador, em geral um POST REST com JSON. O controlador valida e traduz o pedido em configuração do equipamento, e a envia pela API southbound (NETCONF, RESTCONF ou SSH com CLI). O switch aplica e confirma, e o controlador atualiza o inventário e o estado, que o painel mostra de volta.<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
