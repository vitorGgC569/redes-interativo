</main><script>window.ACT={"kind": "exam", "id": "m12-sim", "title": "Simulado do módulo 12", "minutes": 15, "goal": 13, "qs": [{"q": "Qual método de acesso ao meio o Wi-Fi usa?", "type": "mc", "opts": ["CSMA/CD", "CSMA/CA", "Token passing", "TDMA"], "ans": [1], "expl": "<p>O Wi-Fi não detecta colisões, ele tenta evitá-las (CSMA/CA).<\/p>"}, {"q": "O que o BSSID identifica?", "type": "mc", "opts": ["O nome da rede", "O MAC do rádio do AP", "O IP do AP", "A senha"], "ans": [1], "expl": "<p>O BSSID é o endereço MAC do rádio do AP. O nome é o SSID.<\/p>"}, {"q": "Quais canais de 2,4 GHz não se sobrepõem?", "type": "mc", "opts": ["1, 2 e 3", "1, 6 e 11", "2, 7 e 12", "3, 8 e 13"], "ans": [1], "expl": "<p>Só 1, 6 e 11 não se sobrepõem.<\/p>"}, {"q": "Qual padrão introduziu o OFDMA?", "type": "mc", "opts": ["802.11n", "802.11ac", "802.11ax", "802.11g"], "ans": [2], "expl": "<p>O 802.11ax (Wi-Fi 6).<\/p>"}, {"q": "Qual faixa alcança mais longe e atravessa melhor obstáculos?", "type": "mc", "opts": ["2,4 GHz", "5 GHz", "6 GHz", "Todas iguais"], "ans": [0], "expl": "<p>A faixa de 2,4 GHz alcança mais longe, em troca de menos canais e menos velocidade.<\/p>"}, {"q": "Quantos mW correspondem a 20 dBm?", "type": "mc", "opts": ["1 mW", "10 mW", "100 mW", "1000 mW"], "ans": [2], "expl": "<p>20 dBm são 100 mW.<\/p>"}, {"q": "Um aumento de 3 dB significa aproximadamente", "type": "mc", "opts": ["Metade da potência", "O dobro da potência", "Dez vezes a potência", "Nenhuma mudança"], "ans": [1], "expl": "<p>Cada 3 dB dobra a potência.<\/p>"}, {"q": "Qual valor de SNR é melhor?", "type": "mc", "opts": ["5 dB", "10 dB", "25 dB", "0 dB"], "ans": [2], "expl": "<p>Quanto maior a SNR, melhor. 25 dB é uma boa relação.<\/p>"}, {"q": "Qual protocolo conecta o AP leve à controladora?", "type": "mc", "opts": ["CAPWAP", "LACP", "RADIUS", "OSPF"], "ans": [0], "expl": "<p>O CAPWAP (UDP 5246 e 5247).<\/p>"}, {"q": "Qual modo de AP leve comuta o tráfego localmente na filial?", "type": "mc", "opts": ["Local", "Monitor", "FlexConnect", "Sniffer"], "ans": [2], "expl": "<p>O FlexConnect é o modo para comutação local em filiais.<\/p>"}, {"q": "Qual protocolo de segurança usa AES-CCMP?", "type": "mc", "opts": ["WEP", "WPA com TKIP", "WPA2", "Nenhum"], "ans": [2], "expl": "<p>O WPA2 usa AES no modo CCMP.<\/p>"}, {"q": "O que o WPA3-Personal usa no lugar do PSK handshake do WPA2?", "type": "mc", "opts": ["RC4", "SAE", "TKIP", "CHAP"], "ans": [1], "expl": "<p>O SAE (Simultaneous Authentication of Equals).<\/p>"}, {"q": "No 802.1X, qual elemento é o autenticador?", "type": "mc", "opts": ["O cliente", "O AP ou a WLC", "O servidor RADIUS", "O DHCP"], "ans": [1], "expl": "<p>O cliente é o suplicante, o AP ou a WLC é o autenticador e o RADIUS é o servidor de autenticação.<\/p>"}, {"q": "Qual destas NÃO é uma proteção real da rede?", "type": "mc", "opts": ["WPA3", "Esconder o SSID", "802.1X", "Chave longa"], "ans": [1], "expl": "<p>Esconder o SSID não protege a rede, porque o nome aparece em outros quadros.<\/p>"}, {"q": "A conexão está lenta, com sinal de menos 50 dBm. O que verificar primeiro?", "type": "mc", "opts": ["A cor do AP", "A SNR e a ocupação do canal", "O comprimento do cabo de energia", "O tamanho do SSID"], "ans": [1], "expl": "<p>Com sinal excelente, o gargalo costuma ser ruído, interferência, ocupação do canal ou número de clientes.<\/p>"}], "scoring": "Pontuação: 13 ou mais, ótimo. De 10 a 12, revise os pontos errados. Abaixo de 10, releia a Teoria e refaça os exercícios."};</script><script src="../../assets/app.js"></script></body></html>
