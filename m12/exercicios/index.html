</main><script>window.ACT={"kind": "cards", "id": "m12-ex", "sections": [{"title": "Conceitos (fácil)", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Que padrão do IEEE define as redes Wi-Fi?<\/p>", "a": "<p>O IEEE 802.11.<\/p>", "kw": []}, {"id": "s1q2", "n": 2, "q": "<p>Por que o Wi-Fi usa CSMA/CA e não CSMA/CD?<\/p>", "a": "<p>Em um meio sem fio, a estação não consegue ouvir o canal enquanto transmite, então não detecta colisões. O CSMA/CA tenta evitá-las, escutando antes, esperando um tempo aleatório e exigindo um ACK para cada quadro unicast.<\/p>", "kw": []}, {"id": "s1q3", "n": 3, "q": "<p>Qual a diferença entre SSID, BSSID e ESS?<\/p>", "a": "<p>O SSID é o nome da rede que o usuário vê. O BSSID é o endereço MAC do rádio do AP, que identifica um BSS (um AP e seus clientes). O ESS é um conjunto de BSS com o mesmo SSID, ligados por uma rede cabeada, que permite o roaming.<\/p>", "kw": []}, {"id": "s1q4", "n": 4, "q": "<p>Quais os três canais de 2,4 GHz que não se sobrepõem?<\/p>", "a": "<p>Os canais 1, 6 e 11.<\/p>", "kw": []}, {"id": "s1q5", "n": 5, "q": "<p>Qual faixa alcança mais longe, 2,4 ou 5 GHz? Qual tem mais canais?<\/p>", "a": "<p>A de 2,4 GHz alcança mais longe, e a de 5 GHz tem mais canais e velocidade.<\/p>", "kw": []}, {"id": "s1q6", "n": 6, "q": "<p>O que é um AP leve (lightweight) e o que ele precisa para funcionar?<\/p>", "a": "<p>É um AP sem configuração própria completa, que depende de uma controladora (WLC) para receber a configuração, as políticas e o gerenciamento.<\/p>", "kw": []}, {"id": "s1q7", "n": 7, "q": "<p>Qual protocolo liga o AP leve à WLC e quais portas UDP usa?<\/p>", "a": "<p>O CAPWAP, com UDP 5246 (controle) e 5247 (dados).<\/p>", "kw": []}, {"id": "s1q8", "n": 8, "q": "<p>Qual o algoritmo de criptografia do WPA2 e qual o do WEP?<\/p>", "a": "<p>O WPA2 usa AES no modo CCMP. O WEP usa RC4.<\/p>", "kw": []}, {"id": "s1q9", "n": 9, "q": "<p>O que é o 802.1X e que três papéis ele tem?<\/p>", "a": "<p>É o padrão de autenticação por porta, usado no WPA2 e no WPA3 Enterprise. Os papéis são o suplicante (o cliente), o autenticador (o AP ou a WLC) e o servidor de autenticação (RADIUS).<\/p>", "kw": []}, {"id": "s1q10", "n": 10, "q": "<p>Quantos caracteres pode ter a chave pré-compartilhada de um WPA2 Personal?<\/p>", "a": "<p>De 8 a 63 caracteres.<\/p>", "kw": []}], "tail": ""}, {"title": "Padrões e faixas (fácil)", "intro": "<p>Para cada item, indique o padrão ou a característica.<\/p>", "items": [{"id": "s2q1", "n": 1, "q": "<p>Padrão de 2,4 GHz com taxa máxima de 11 Mbit/s.<\/p>", "a": "<p>802.11b.<\/p>", "kw": []}, {"id": "s2q2", "n": 2, "q": "<p>Padrão de 5 GHz com taxa máxima de 54 Mbit/s.<\/p>", "a": "<p>802.11a.<\/p>", "kw": []}, {"id": "s2q3", "n": 3, "q": "<p>Padrão que trouxe o MIMO e opera em 2,4 e 5 GHz.<\/p>", "a": "<p>802.11n (Wi-Fi 4).<\/p>", "kw": []}, {"id": "s2q4", "n": 4, "q": "<p>Padrão que trouxe o MU-MIMO (descida) e os canais de 80 e 160 MHz, apenas em 5 GHz.<\/p>", "a": "<p>802.11ac (Wi-Fi 5).<\/p>", "kw": []}, {"id": "s2q5", "n": 5, "q": "<p>Padrão que trouxe o OFDMA.<\/p>", "a": "<p>802.11ax (Wi-Fi 6).<\/p>", "kw": []}, {"id": "s2q6", "n": 6, "q": "<p>Qual o nome Wi-Fi do 802.11n, do 802.11ac e do 802.11ax?<\/p>", "a": "<p>Wi-Fi 4, Wi-Fi 5 e Wi-Fi 6, respectivamente.<\/p>", "kw": []}, {"id": "s2q7", "n": 7, "q": "<p>O que significa o \"E\" em Wi-Fi 6E?<\/p>", "a": "<p>Extended: indica o suporte à faixa de 6 GHz, além de 2,4 e 5 GHz.<\/p>", "kw": []}, {"id": "s2q8", "n": 8, "q": "<p>Por que a taxa de 600 Mbit/s do 802.11n nunca é a velocidade que você mede?<\/p>", "a": "<p>A taxa de 600 Mbit/s é a taxa de sinalização máxima teórica, com quatro fluxos e canal de 40 MHz. A vazão real é menor por causa do CSMA/CA, dos ACKs, da distância, das interferências e do número de fluxos que o cliente realmente suporta.<\/p>", "kw": []}], "tail": ""}, {"title": "Segurança (médio)", "intro": "", "items": [{"id": "s3q1", "n": 1, "q": "<p>Ordene do mais fraco ao mais forte: WPA2, WEP, WPA3, WPA.<\/p>", "a": "<p>WEP, WPA, WPA2, WPA3.<\/p>", "kw": []}, {"id": "s3q2", "n": 2, "q": "<p>Por que esconder o SSID e filtrar endereços MAC não protegem uma rede?<\/p>", "a": "<p>O SSID aparece nos quadros de associação e é descoberto com qualquer analisador. O MAC trafega no ar sem criptografia e pode ser copiado por quem escuta a rede. Os dois são só obstáculos e não substituem a criptografia e a autenticação.<\/p>", "kw": []}, {"id": "s3q3", "n": 3, "q": "<p>Qual a vantagem do WPA2-Enterprise em relação ao Personal quando um funcionário é desligado?<\/p>", "a": "<p>No Enterprise, cada usuário tem uma credencial própria. Basta desativar a conta dele no servidor RADIUS, sem trocar a senha da empresa inteira. No Personal, a senha é igual para todos.<\/p>", "kw": []}, {"id": "s3q4", "n": 4, "q": "<p>O que o SAE do WPA3 melhora em relação ao PSK do WPA2?<\/p>", "a": "<p>O SAE resiste a ataques de dicionário offline sobre o handshake capturado, dá sigilo futuro (uma chave descoberta no futuro não abre o tráfego antigo) e a proteção dos quadros de gerenciamento é obrigatória.<\/p>", "kw": []}, {"id": "s3q5", "n": 5, "q": "<p>O que o OWE (Enhanced Open) faz?<\/p>", "a": "<p>Criptografa o tráfego de redes abertas (sem senha), de modo que um bisbilhoteiro no ar não leia o conteúdo dos outros clientes, embora não autentique quem se conecta.<\/p>", "kw": []}, {"id": "s3q6", "n": 6, "q": "<p>Em uma rede de visitantes de um escritório, que três medidas você recomenda?<\/p>", "a": "<p>Uma VLAN separada da rede interna, isolamento entre clientes no AP (ou na WLC) e um limite de banda, além de preferencialmente uma senha ou portal para controlar o acesso.<\/p>", "kw": []}, {"id": "s3q7", "n": 7, "q": "<p>Por que o WPS é considerado um risco?<\/p>", "a": "<p>O PIN de 8 dígitos pode ser descoberto por tentativas, porque é validado em duas metades, e isso reduz muito o espaço de busca. Deve ser desligado.<\/p>", "kw": []}], "tail": ""}, {"title": "Contas de sinal (médio)", "intro": "", "items": [{"id": "s4q1", "n": 1, "q": "<p>Converta 20 dBm e 30 dBm em mW (0 dBm é 1 mW, e cada 10 dB multiplica por 10).<\/p>", "a": "<p>20 dBm são 100 mW (0 dBm = 1 mW, 10 dBm = 10 mW e 20 dBm = 100 mW). 30 dBm são 1000 mW, ou seja, 1 W.<\/p>", "kw": []}, {"id": "s4q2", "n": 2, "q": "<p>Um AP com transmissor de 17 dBm, antena de 6 dBi e cabo com perda de 2 dB: qual o EIRP?<\/p>", "a": "<p>EIRP = 17 mais 6 menos 2 = 21 dBm (cerca de 126 mW).<\/p>", "kw": []}, {"id": "s4q3", "n": 3, "q": "<p>Um cliente recebe menos 68 dBm e o ruído é menos 92 dBm. Qual a SNR? E se o ruído subir para menos 78 dBm?<\/p>", "a": "<p>SNR = menos 68 menos (menos 92) = 24 dB, uma boa SNR. Com ruído de menos 78 dBm, a SNR cai para 10 dB, uma conexão fraca, mesmo com o mesmo sinal.<\/p>", "kw": []}, {"id": "s4q4", "n": 4, "q": "<p>Uma mudança de 3 dB a mais na potência faz o que com a potência em mW?<\/p>", "a": "<p>Dobra a potência (aproximadamente 2 vezes).<\/p>", "kw": []}, {"id": "s4q5", "n": 5, "q": "<p>Se a distância entre o AP e o cliente dobra, o que acontece, aproximadamente, com o sinal em espaço livre?<\/p>", "a": "<p>Perde cerca de 6 dB, e o sinal fica mais fraco.<\/p>", "kw": []}, {"id": "s4q6", "n": 6, "q": "<p>Um sinal de menos 67 dBm é suficiente para voz? E menos 82 dBm?<\/p>", "a": "<p>Menos 67 dBm é o valor de referência para voz (Cisco costuma indicar esse limite), então é suficiente se a SNR também for boa. Menos 82 dBm é fraco e deve causar quedas e retransmissões.<\/p>", "kw": []}], "tail": ""}, {"title": "Cenários (difícil)", "intro": "", "items": [{"id": "s5q1", "n": 1, "q": "<p>Um escritório tem quatro APs 802.11n em 2,4 GHz, todos no canal 6, e a rede está lenta. Por que e como você corrigiria?<\/p>", "a": "<p>Os quatro APs disputam o mesmo canal e dividem o tempo de transmissão, e a rede fica lenta mesmo com sinal forte. Corrija usando 1, 6 e 11 de modo que vizinhos não repitam o canal (por exemplo 1, 6, 11 e 1 no AP mais distante), reduza a potência para diminuir a sobreposição e, se possível, migre os clientes capazes para 5 GHz.<\/p>", "kw": []}, {"id": "s5q2", "n": 2, "q": "<p>Uma empresa tem 300 APs em 12 filiais e quer configurar tudo em um lugar só. Que arquitetura você recomenda e o que muda na topologia?<\/p>", "a": "<p>A arquitetura com controladora (APs leves e WLC, ou uma solução em nuvem como o Meraki). Os APs ficam ligados a switches de acesso e se registram na WLC por CAPWAP, e em filiais é comum usar o modo FlexConnect para que o tráfego local não precise subir até a matriz.<\/p>", "kw": []}, {"id": "s5q3", "n": 3, "q": "<p>Um cliente antigo (WPA2 apenas) não conecta na rede nova, que foi configurada em WPA3-Personal. O que fazer?<\/p>", "a": "<p>A melhor solução é atualizar ou trocar o cliente. Se não for possível, use o modo de transição do WPA3-Personal (que aceita WPA2) ou crie uma rede separada em WPA2 para esses dispositivos, sabendo que ela fica mais fraca.<\/p>", "kw": []}, {"id": "s5q4", "n": 4, "q": "<p>Na WLC, você precisa criar uma WLAN para os funcionários, com WPA2 e autenticação por usuário. Quais as informações que você precisa definir?<\/p>", "a": "<p>O SSID e o nome do perfil, a interface dinâmica (a VLAN dos funcionários), o método de segurança (WPA2 ou WPA3 com 802.1X), o servidor RADIUS (endereço IP e segredo compartilhado) e a habilitação da WLAN.<\/p>", "kw": []}, {"id": "s5q5", "n": 5, "q": "<p>Os usuários reclamam que a rede está lenta no fim da tarde e o sinal, medido, é de menos 55 dBm. O que investigar?<\/p>", "a": "<p>O sinal está ótimo, então o problema não é cobertura. Investigue a SNR e o ruído, a ocupação do canal (muitos clientes ou redes vizinhas), a quantidade de clientes por AP no horário, a faixa que os clientes usam (muitos em 2,4 GHz) e uma saída de internet saturada.<\/p>", "kw": []}, {"id": "s5q6", "n": 6, "q": "<p>Para cada caso, diga qual segurança você usaria: (a) casa com equipamentos novos, (b) empresa com 500 funcionários, (c) café com Wi-Fi para clientes.<\/p>", "a": "<p>(a) WPA3-Personal (ou WPA2-AES se algum equipamento não suportar) com senha longa. (b) WPA2 ou WPA3-Enterprise com 802.1X e RADIUS. (c) OWE (Enhanced Open), se os clientes suportarem, ou uma rede aberta com portal captivo e isolamento de clientes, em VLAN separada.<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
