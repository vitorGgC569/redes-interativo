</main><script>window.ACT={"kind": "cards", "id": "m02-ex", "sections": [{"title": "Fácil: conceitos rápidos", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Qual dispositivo cria um domínio de colisão separado por porta?<\/p>", "a": "<p><b>Switch<\/b>. O hub cria um único domínio de colisão para todas as portas.<\/p>", "kw": ["Switch"]}, {"id": "s1q2", "n": 2, "q": "<p>Qual é o comprimento máximo de um segmento Ethernet em UTP?<\/p>", "a": "<p><b>100 m<\/b> (90 m de cabo fixo + 10 m de patch cords).<\/p>", "kw": ["100 m"]}, {"id": "s1q3", "n": 3, "q": "<p>Que cabo é usado entre um PC e um switch (regra clássica)?<\/p>", "a": "<p><b>Cabo direto (straight-through)<\/b>, pois PC e switch são dispositivos diferentes.<\/p>", "kw": ["Cabo direto (straight-through)"]}, {"id": "s1q4", "n": 4, "q": "<p>Quais pinos do RJ45 transmitem em 10/100BASE-T?<\/p>", "a": "<p>Pinos <b>1 e 2<\/b> transmitem (dispositivos MDI) e <b>3 e 6<\/b> recebem. No switch (MDIX) é o inverso.<\/p>", "kw": ["1 e 2", "3 e 6"]}, {"id": "s1q5", "n": 5, "q": "<p>Qual conector de fibra é o mais comum em módulos SFP?<\/p>", "a": "<p><b>LC<\/b>.<\/p>", "kw": ["LC"]}], "tail": ""}, {"title": "Fácil/médio: T568A e T568B", "intro": "<p>Monte a sequência de cores do pino 1 ao 8:<\/p>", "items": [{"id": "s2q1", "n": 1, "q": "<p>T568B em ambas as pontas.<\/p>", "a": "<p>T568B nas duas pontas: branco/laranja, laranja, branco/verde, azul, branco/azul, verde, branco/marrom, marrom. Cabo <b>direto<\/b>.<\/p>", "kw": ["direto"]}, {"id": "s2q2", "n": 2, "q": "<p>T568A em ambas as pontas.<\/p>", "a": "<p>T568A nas duas pontas: branco/verde, verde, branco/laranja, azul, branco/azul, laranja, branco/marrom, marrom. Cabo <b>direto<\/b>.<\/p>", "kw": ["direto"]}, {"id": "s2q3", "n": 3, "q": "<p>Uma ponta T568A e a outra T568B. Que tipo de cabo é esse?<\/p>", "a": "<p>É um cabo <b>crossover<\/b>.<\/p>", "kw": ["crossover"]}, {"id": "s2q4", "n": 4, "q": "<p>Quais pinos mudam de cor entre T568A e T568B?<\/p>", "a": "<p>Os pinos <b>1, 2, 3 e 6<\/b> (os pares verde e laranja trocam de lugar). Os pinos 4, 5, 7 e 8 não mudam.<\/p>", "kw": ["1, 2, 3 e 6"]}], "tail": ""}, {"title": "Médio: escolha o cabo", "intro": "<p>Para cada cenário, escolha o meio adequado e justifique.<\/p>", "items": [{"id": "s3q1", "n": 1, "q": "<p>Ligar o PC de uma mesa ao switch a 15 m de distância, 1 Gbps.<\/p>", "a": "<p><b>UTP Cat5e ou Cat6, cabo direto<\/b>: 15 m &amp;lt; 100 m e 1 Gbps é suportado por Cat5e.<\/p>", "kw": ["UTP Cat5e ou Cat6, cabo direto"]}, {"id": "s3q2", "n": 2, "q": "<p>Ligar dois prédios distantes 3 km.<\/p>", "a": "<p><b>Fibra monomodo<\/b>: 3 km excede o limite do cobre e do multimodo comum.<\/p>", "kw": ["Fibra monomodo"]}, {"id": "s3q3", "n": 3, "q": "<p>Ligar dois switches em um datacenter a 40 m, 10 Gbps, em cabo de cobre.<\/p>", "a": "<p><b>Cat6a<\/b> (10GBASE-T até 100 m) ou Cat6 (até cerca de 55 m, 40 m cabe). Alternativa: Twinax/DAC.<\/p>", "kw": ["Cat6a"]}, {"id": "s3q4", "n": 4, "q": "<p>Ligar um access point a 80 m do switch, sem tomada elétrica próxima.<\/p>", "a": "<p><b>UTP Cat5e/Cat6 com PoE<\/b> (802.3af ou at): 80 m &amp;lt; 100 m e o cabo também leva energia.<\/p>", "kw": ["UTP Cat5e/Cat6 com PoE"]}, {"id": "s3q5", "n": 5, "q": "<p>Ligar dois switches na mesma sala usando equipamentos antigos sem Auto-MDIX.<\/p>", "a": "<p><b>Cabo crossover<\/b> (T568A de um lado e T568B do outro), pois são dispositivos iguais.<\/p>", "kw": ["Cabo crossover"]}, {"id": "s3q6", "n": 6, "q": "<p>Ligar dois andares de um prédio (vertical de 120 m) a 10 Gbps, ambiente com muitos motores de elevador.<\/p>", "a": "<p><b>Fibra<\/b> (monomodo ou multimodo OM3/OM4): 120 m excede os 100 m do cobre e a fibra é imune à interferência dos motores.<\/p>", "kw": ["Fibra"]}], "tail": ""}, {"title": "Médio: tempo de transferência", "intro": "<p>Considere 1 GB = 8 000 Mb e ignore o overhead (valor ideal).<\/p>", "items": [{"id": "s4q1", "n": 1, "q": "<p>Quanto tempo leva para copiar um arquivo de 4 GB em um link de 1 Gbps?<\/p>", "a": "<p>4 GB = 32 000 Mb ÷ 1 000 Mbps = <b>32 s<\/b>.<\/p>", "kw": ["32 s"]}, {"id": "s4q2", "n": 2, "q": "<p>E em um link de 100 Mbps?<\/p>", "a": "<p>32 000 Mb ÷ 100 Mbps = <b>320 s<\/b> (5 min 20 s).<\/p>", "kw": ["320 s"]}, {"id": "s4q3", "n": 3, "q": "<p>Em um link Wi-Fi com 300 Mbps de taxa negociada, mas vazão real de 40% disso, quanto tempo leva para copiar 1,5 GB?<\/p>", "a": "<p>Vazão real = 300 × 0,4 = 120 Mbps. 1,5 GB = 12 000 Mb ÷ 120 = <b>100 s<\/b>.<\/p>", "kw": ["100 s"]}], "tail": ""}, {"title": "Médio/difícil: domínios de colisão e broadcast", "intro": "<p>Topologia: 1 roteador com 2 interfaces (LAN1 e LAN2). Na LAN1 há 1 hub com 3 PCs ligados ao roteador. Na LAN2 há 1 switch com 4 PCs ligados ao roteador.<\/p>", "items": [{"id": "s5q1", "n": 1, "q": "<p>Quantos domínios de broadcast existem?<\/p>", "a": "<p><b>2<\/b> (um por interface do roteador: LAN1 e LAN2).<\/p>", "kw": ["2"]}, {"id": "s5q2", "n": 2, "q": "<p>Quantos domínios de colisão existem na LAN1?<\/p>", "a": "<p><b>1<\/b>: o hub junta o roteador e os 3 PCs em um só domínio.<\/p>", "kw": ["1"]}, {"id": "s5q3", "n": 3, "q": "<p>Quantos domínios de colisão existem na LAN2?<\/p>", "a": "<p><b>5<\/b>: o switch tem 1 porta para o roteador e 4 para os PCs; cada porta é um domínio de colisão.<\/p>", "kw": ["5"]}, {"id": "s5q4", "n": 4, "q": "<p>Quantos domínios de colisão existem no total?<\/p>", "a": "<p>1 + 5 = <b>6<\/b>.<\/p>", "kw": ["6"]}], "tail": ""}, {"title": "Difícil: orçamento de PoE", "intro": "<p>Um switch PoE tem <b>370 W<\/b> de orçamento. Você precisa ligar 10 access points 802.11ax que exigem PoE+ (30 W reservados cada) e câmeras IP que exigem PoE 802.3af (15,4 W reservados cada).<\/p>", "items": [{"id": "s6q1", "n": 1, "q": "<p>Quanta energia os 10 APs reservam?<\/p>", "a": "<p>10 × 30 W = <b>300 W<\/b>.<\/p>", "kw": ["300 W"]}, {"id": "s6q2", "n": 2, "q": "<p>Quantas câmeras ainda cabem no orçamento restante?<\/p>", "a": "<p>Restam 370 − 300 = 70 W. 70 ÷ 15,4 = 4,54, então cabem <b>4 câmeras<\/b> (4 × 15,4 = 61,6 W; sobram 8,4 W).<\/p>", "kw": ["4 câmeras"]}, {"id": "s6q3", "n": 3, "q": "<p>Quantos APs de 30 W caberiam se o switch só tivesse APs e nenhuma câmera?<\/p>", "a": "<p>370 ÷ 30 = 12,33, então <b>12 APs<\/b> (360 W).<\/p>", "kw": ["12 APs"]}], "tail": ""}, {"title": "Desafio: plano de canais", "intro": "<p>Um escritório tem 3 access points em 2,4 GHz, todos no canal 6, e os usuários reclamam de lentidão.<\/p>", "items": [{"id": "s7q1", "n": 1, "q": "<p>Qual é o problema?<\/p>", "a": "<p>Os 3 APs compartilham o mesmo canal: eles competem pelo mesmo meio (interferência co-canal), dividindo a capacidade.<\/p>", "kw": []}, {"id": "s7q2", "n": 2, "q": "<p>Proponha uma configuração de canais e largura de canal.<\/p>", "a": "<p>Use canais <b>1, 6 e 11<\/b>, largura de <b>20 MHz<\/b> (40 MHz em 2,4 GHz consome quase metade da banda e aumenta a sobreposição).<\/p>", "kw": ["1, 6 e 11", "20 MHz"]}, {"id": "s7q3", "n": 3, "q": "<p>Cite duas outras melhorias.<\/p>", "a": "<p>Por exemplo: migrar clientes compatíveis para <b>5 GHz<\/b> (mais canais), ajustar a potência de transmissão dos APs, e posicionar os APs para sobrepor cobertura pouco (cerca de 10-15%).<\/p>", "kw": ["5 GHz"]}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
