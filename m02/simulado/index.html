</main><script>window.ACT={"kind": "exam", "id": "m02-sim", "title": "Simulado do módulo 2", "minutes": 15, "goal": 13, "qs": [{"q": "Qual é o comprimento máximo recomendado de um segmento Ethernet em UTP?", "type": "mc", "opts": ["55 m", "90 m", "100 m", "185 m"], "ans": [2], "expl": "<p>100 m (90 m fixos + 10 m de patch cords).<\/p>"}, {"q": "Qual categoria é a mínima para 10GBASE-T em 100 m?", "type": "mc", "opts": ["Cat5e", "Cat6", "Cat6a", "Cat5"], "ans": [2], "expl": "<p>Cat6a faz 10 Gbps em 100 m; Cat6 só até ~55 m.<\/p>"}, {"q": "No padrão T568B, qual é a cor do pino 1?", "type": "mc", "opts": ["branco/verde", "branco/laranja", "verde", "azul"], "ans": [1], "expl": "<p>T568B pino 1 = branco/laranja (T568A é branco/verde).<\/p>"}, {"q": "Que cabo liga um PC a um switch, pela regra clássica?", "type": "mc", "opts": ["Crossover", "Rollover (console)", "Direto (straight-through)", "Coaxial"], "ans": [2], "expl": "<p>dispositivos diferentes usam cabo direto.<\/p>"}, {"q": "Que cabo liga dois switches sem Auto-MDIX?", "type": "mc", "opts": ["Crossover", "Direto", "Rollover", "Serial"], "ans": [0], "expl": "<p>dispositivos iguais, sem Auto-MDIX, usam crossover.<\/p>"}, {"q": "Que meio é indicado para 20 km entre dois prédios?", "type": "mc", "opts": ["Cat6a", "Fibra multimodo OM3", "Fibra monomodo", "Cat8"], "ans": [2], "expl": "<p>monomodo alcança dezenas de km.<\/p>"}, {"q": "Qual conector de fibra é pequeno, duplex e usado em SFP?", "type": "mc", "opts": ["SC", "ST", "LC", "RJ45"], "ans": [2], "expl": "<p>LC.<\/p>"}, {"q": "Qual meio é imune à interferência eletromagnética?", "type": "mc", "opts": ["UTP", "STP", "Coaxial", "Fibra óptica"], "ans": [3], "expl": "<p>a fibra transmite luz, não sinal elétrico.<\/p>"}, {"q": "Qual padrão PoE fornece até 30 W por porta no PSE?", "type": "mc", "opts": ["802.3af", "802.3at", "802.3ab", "802.3z"], "ans": [1], "expl": "<p>802.3at (PoE+) = 30 W. O 802.3af é 15,4 W.<\/p>"}, {"q": "Quais canais de 2,4 GHz (20 MHz) não se sobrepõem?", "type": "mc", "opts": ["1, 2 e 3", "1, 6 e 11", "2, 7 e 12", "3, 6 e 9"], "ans": [1], "expl": "<p>1, 6 e 11.<\/p>"}, {"q": "Qual nome comercial corresponde ao 802.11ax?", "type": "mc", "opts": ["Wi-Fi 4", "Wi-Fi 5", "Wi-Fi 6", "Wi-Fi 7"], "ans": [2], "expl": "<p>Wi-Fi 6.<\/p>"}, {"q": "Um hub de 8 portas forma quantos domínios de colisão?", "type": "mc", "opts": ["1", "2", "8", "16"], "ans": [0], "expl": "<p>o hub repete para todas as portas: um único domínio de colisão.<\/p>"}, {"q": "Qual dispositivo separa domínios de broadcast sem usar VLANs?", "type": "mc", "opts": ["Hub", "Switch", "Roteador", "Repetidor"], "ans": [2], "expl": "<p>o roteador (cada interface é um domínio de broadcast).<\/p>"}, {"q": "Qual padrão 802.11 funciona somente em 5 GHz?", "type": "mc", "opts": ["802.11b", "802.11g", "802.11n", "802.11ac"], "ans": [3], "expl": "<p>802.11ac opera só em 5 GHz (o 802.11n usa as duas bandas).<\/p>"}, {"q": "Qual método de acesso ao meio é usado no Wi-Fi?", "type": "mc", "opts": ["CSMA/CD", "CSMA/CA", "Token passing", "TDM"], "ans": [1], "expl": "<p>CSMA/CA (CSMA/CD era do Ethernet half-duplex).<\/p>"}], "scoring": "Pontuação: 13-15 excelente · 11-12 bom · menos de 11: refaça as seções 2, 3 e 6 e os exercícios B, C e E."};</script><script src="../../assets/app.js"></script></body></html>
