<footer class="foot"><span>Curso de Redes de Computadores</span><span>·</span><a href="../../">Todas as atividades</a><span>·</span><span>Seu progresso fica salvo só neste navegador.</span></footer>
</main><script>window.ACT={"kind": "exam", "id": "m17-sim", "title": "Simulado do módulo 17", "minutes": 15, "goal": 13, "qs": [{"q": "Qual destes é um hypervisor tipo 1?", "type": "mc", "opts": ["VirtualBox", "VMware Workstation", "KVM", "Docker Desktop"], "ans": [2], "expl": "<p>O KVM (e o ESXi e o Hyper-V) roda direto sobre o hardware, tipo 1. O VirtualBox e o VMware Workstation são tipo 2, e o Docker Desktop executa containers (e usa uma máquina virtual leve por baixo em alguns sistemas), não é um hypervisor tipo 1.<\/p>"}, {"q": "O que um container compartilha com o sistema operacional hospedeiro?", "type": "mc", "opts": ["O BIOS", "O kernel", "O disco virtual inteiro", "A placa de rede física, de forma exclusiva"], "ans": [1], "expl": "<p>Todos os containers do hospedeiro usam o mesmo kernel, e é por isso que são leves.<\/p>"}, {"q": "Qual comando mostra os servidores DNS configurados em um Mac?", "type": "mc", "opts": ["ipconfig /all", "ip route", "route print", "scutil --dns"], "ans": [3], "expl": "<p>O <code>scutil --dns<\/code> lista os resolvedores no macOS. O <code>ipconfig /all<\/code> e o <code>route print<\/code> são do Windows, e o <code>ip route<\/code> é do Linux (e mostra rotas, não o DNS).<\/p>"}, {"q": "Uma porta mostra late collisions e a outra, CRC. Qual a causa mais provável?", "type": "mc", "opts": ["Duplex mismatch", "Loop de camada 2", "DNS errado", "VLAN errada"], "ans": [0], "expl": "<p>O lado half duplex vê colisões (late collisions) e o lado full duplex vê CRC. Um loop causaria tempestade de broadcast e MAC flapping.<\/p>"}, {"q": "Que recurso coloca em err-disabled uma porta com PortFast que recebe um BPDU?", "type": "mc", "opts": ["Root guard", "BPDU Guard", "Loop guard", "Storm control"], "ans": [1], "expl": "<p>O BPDU Guard coloca a porta em err-disabled ao receber BPDU. O root guard coloca a porta em estado inconsistente, e o loop guard cuida da perda de BPDUs.<\/p>"}, {"q": "Qual protocolo de descoberta de vizinhos é aberto e funciona com equipamentos de vários fabricantes?", "type": "mc", "opts": ["CDP", "VTP", "LLDP", "DTP"], "ans": [2], "expl": "<p>O LLDP (IEEE 802.1AB) é o padrão aberto. O CDP é proprietário da Cisco, e o VTP e o DTP não são de descoberta de vizinhos.<\/p>"}, {"q": "Qual combinação de modos do LACP forma um EtherChannel?", "type": "mc", "opts": ["Passive e passive", "Active e passive", "On e active", "Auto e desirable"], "ans": [1], "expl": "<p>Active e passive negociam o LACP. Passive com passive nunca inicia a negociação, e o modo <code>on<\/code> não negocia (só fecha com outro <code>on<\/code>).<\/p>"}, {"q": "Que recurso impede que uma porta se torne root port ao receber um BPDU superior?", "type": "mc", "opts": ["PortFast", "BPDU Guard", "Loop guard", "Root guard"], "ans": [3], "expl": "<p>O root guard impede que a porta aceite um BPDU superior e se torne root port. O BPDU Guard desliga a porta, e o loop guard previne loops por perda de BPDUs.<\/p>"}, {"q": "Qual o endereço multicast que o OSPFv3 usa para falar com o DR e o BDR?", "type": "mc", "opts": ["FF02::5", "224.0.0.5", "FF02::6", "224.0.0.6"], "ans": [2], "expl": "<p>FF02::6 alcança o DR e o BDR, e FF02::5 todos os roteadores OSPF. No OSPFv2 seriam 224.0.0.6 e 224.0.0.5.<\/p>"}, {"q": "Qual a prioridade padrão em um grupo VRRP?", "type": "mc", "opts": ["1", "100", "255", "150"], "ans": [1], "expl": "<p>O padrão é 100, e o maior valor vence a eleição de master.<\/p>"}, {"q": "A rota para uma rede é aprendida por OSPF (distância administrativa 110). Qual distância faz uma rota estática ser flutuante, ou seja, de reserva?", "type": "mc", "opts": ["1", "90", "120", "5"], "ans": [2], "expl": "<p>A rota flutuante precisa de uma distância maior que a da rota principal (110). Com 120, ela só entra na tabela quando a rota OSPF some.<\/p>"}, {"q": "Qual registro DNS associa um nome a um endereço IPv6?", "type": "mc", "opts": ["A", "PTR", "CNAME", "AAAA"], "ans": [3], "expl": "<p>O AAAA associa um nome a um IPv6. O A é para IPv4, o PTR é a resolução reversa e o CNAME é um apelido.<\/p>"}, {"q": "Qual protocolo copia arquivos de forma segura usando o SSH?", "type": "mc", "opts": ["SCP", "TFTP", "FTP", "SNMPv2c"], "ans": [0], "expl": "<p>O SCP roda sobre o SSH. O TFTP e o FTP não criptografam. O SNMPv2c é de gerenciamento.<\/p>"}, {"q": "O RA guard protege contra qual ataque?", "type": "mc", "opts": ["Servidor DHCP IPv4 falso", "Anúncio de roteador IPv6 falso", "ARP falso", "Loop de camada 2"], "ans": [1], "expl": "<p>O RA guard descarta anúncios de roteador (ICMPv6 tipo 134) de portas não confiáveis. A proteção contra o servidor DHCP falso é o DHCP snooping, e a contra o ARP falso é o DAI.<\/p>"}, {"q": "Em um prompt para uma IA generativa, que componente define quais informações podem ser enviadas?", "type": "mc", "opts": ["Persona", "Formato da saída", "Classificação dos dados", "Instruções"], "ans": [2], "expl": "<p>A classificação dos dados define o que é permitido enviar (e o que é proibido, como senhas e dados de clientes). A persona, o formato da saída e as instruções moldam a resposta, e não a segurança da entrada.<\/p>"}], "scoring": null};</script><script src="../../assets/app.js"></script></body></html>
