</main><script>window.ACT={"kind": "cards", "id": "m17-ex", "sections": [{"title": "Conceitos (fácil)", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Qual a diferença entre um hypervisor tipo 1 e um tipo 2? Dê um exemplo de cada.<\/p>", "a": "<p>O tipo 1 (bare metal) roda direto sobre o hardware, como o VMware ESXi, o KVM e o Hyper-V, e é o usado em servidores. O tipo 2 (hospedado) roda como programa sobre um sistema operacional, como o VirtualBox e o VMware Workstation.<\/p>", "kw": []}, {"id": "s1q2", "n": 2, "q": "<p>Por que um container é mais leve que uma máquina virtual?<\/p>", "a": "<p>Porque ele compartilha o kernel do sistema operacional do hospedeiro e isola só o aplicativo e suas dependências. A VM carrega um sistema operacional completo.<\/p>", "kw": []}, {"id": "s1q3", "n": 3, "q": "<p>Que endereços multicast o OSPFv3 usa, e o que cada um alcança?<\/p>", "a": "<p>FF02::5, que alcança todos os roteadores OSPF do enlace, e FF02::6, que alcança o DR e o BDR.<\/p>", "kw": []}, {"id": "s1q4", "n": 4, "q": "<p>Que registro DNS você consultaria para descobrir para onde vai o e-mail de um domínio?<\/p>", "a": "<p>O registro MX, que indica o servidor de e-mail do domínio, com uma prioridade (o menor número é tentado primeiro).<\/p>", "kw": []}, {"id": "s1q5", "n": 5, "q": "<p>Por que SCP e SFTP são preferíveis ao TFTP e ao FTP, e em que porta TCP trabalham?<\/p>", "a": "<p>Porque criptografam o canal (usam o SSH), enquanto o FTP e o TFTP enviam os dados, e no FTP também as senhas, em texto claro. Usam a porta TCP 22.<\/p>", "kw": []}, {"id": "s1q6", "n": 6, "q": "<p>Qual a diferença entre o ESP e o AH no IPsec?<\/p>", "a": "<p>O ESP (protocolo IP 50) oferece confidencialidade, integridade e autenticação. O AH (protocolo IP 51) oferece integridade e autenticação, mas não criptografa.<\/p>", "kw": []}, {"id": "s1q7", "n": 7, "q": "<p>O que o RA guard bloqueia, e em que tipo de porta ele é aplicado?<\/p>", "a": "<p>Ele descarta os anúncios de roteador (RA, ICMPv6 tipo 134) que chegam por portas não confiáveis, como as portas de acesso, para impedir um roteador falso. Só aceita os RAs de portas autorizadas.<\/p>", "kw": []}, {"id": "s1q8", "n": 8, "q": "<p>Quais domínios da CCNA v2.0 valem 25% da prova?<\/p>", "a": "<p>O 1.0 (Infraestrutura e conectividade de rede) e o 2.0 (Switching e acesso à rede).<\/p>", "kw": []}], "tail": ""}, {"title": "Associações (fácil)", "intro": "", "items": [{"id": "s2all", "n": null, "q": "<p>Ligue cada descrição da primeira lista ao item da segunda.<\/p>\n<ol><li>Resolução reversa, do endereço para o nome.<\/li><li>Apelido: um nome que aponta para outro nome.<\/li><li>Lista os servidores de nomes autoritativos de uma zona.<\/li><li>Protocolo IP 50 do IPsec.<\/li><li>Endereço multicast das mensagens do VRRP.<\/li><li>Endereço multicast de todos os roteadores OSPFv3.<\/li><li>Protocolo que negocia as chaves do IPsec, na porta UDP 500.<\/li><li>Mensagem ICMPv6 tipo 134.<\/li><\/ol>\n<p>Itens: (a) ESP. (b) PTR. (c) 224.0.0.18. (d) NS. (e) Router Advertisement. (f) CNAME. (g) FF02::5. (h) IKE.<\/p>", "a": "<ol><li>b. 2. f. 3. d. 4. a. 5. c. 6. g. 7. h. 8. e.<\/li><\/ol>", "kw": []}], "tail": ""}, {"title": "Leitura de saídas (médio)", "intro": "", "items": [{"id": "s3all", "n": null, "q": "<p><b>C1.<\/b> Qual roteador é o master, qual o endereço virtual, e o preempt está ligado?<\/p>\n<pre><code>R1# show vrrp brief\nInterface   Grp Pri Time  Own Pre State   Master addr     Group addr\nGi0/0       1   110 3570      Y   Master  192.168.1.2     192.168.1.1<\/code><\/pre>\n<p><b>C2.<\/b> O que é este roteador na rede (DR, BDR ou DROTHER), e por quê?<\/p>\n<pre><code>R1# show ipv6 ospf neighbor\nNeighbor ID   Pri  State     Dead Time  Interface ID  Interface\n2.2.2.2       1    FULL/DR   00:00:33   4             GigabitEthernet0/0\n3.3.3.3       1    FULL/BDR  00:00:38   3             GigabitEthernet0/0<\/code><\/pre>\n<p><b>C3.<\/b> Para qual servidor um remetente tentará entregar o e-mail primeiro?<\/p>\n<pre><code>C:\\&gt; nslookup -type=MX exemplo.com\nexemplo.com    MX preference = 20, mail exchanger = mail2.exemplo.com\nexemplo.com    MX preference = 10, mail exchanger = mail1.exemplo.com<\/code><\/pre>\n<p><b>C4.<\/b> Qual porta passou do limite, e o que o switch está fazendo?<\/p>\n<pre><code>SW1# show storm-control broadcast\nInterface  Filter State   Upper    Lower    Current\nGi0/5      Forwarding     20.00%   20.00%   0.00%\nGi0/6      Blocking       20.00%   20.00%   35.12%<\/code><\/pre>\n<p><b>C5.<\/b> Decomponha a mensagem: facilidade, gravidade e mnemônico. Qual o significado da gravidade?<\/p>\n<pre><code>*Mar  1 00:10:21.123: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down<\/code><\/pre>\n<p><b>C6.<\/b> Este roteador está pronto para ser servidor SCP? O que falta?<\/p>\n<pre><code>hostname R1\nip domain-name lab.local\nusername admin privilege 15 secret SenhaForte\nip scp server enable\nline vty 0 4\n login local\n transport input ssh<\/code><\/pre>\n<p><b>C7.<\/b> Em uma captura no meio do caminho de uma VPN site-to-site, você vê pacotes ESP entre 203.0.113.1 e 198.51.100.1. O que um observador consegue ver do tráfego interno?<\/p>\n<p><b>C8.<\/b> Qual dos três prompts é o mais adequado para pedir a uma IA generativa a análise de um log, e por quê?<\/p>\n<pre><code>Prompt 1: \"Arrume minha rede.\"\nPrompt 2: \"Atue como engenheiro de redes. Segue o log do switch (IPs e nomes trocados por exemplos, sem senhas).\n           Liste, em uma tabela (evento, gravidade, causa provável), os cinco eventos mais graves.\"\nPrompt 3: \"Aqui estão minha configuração completa com as senhas e o log. Descubra tudo.\"<\/code><\/pre>", "a": "<p>C1. O R1 é o master: o endereço do master (192.168.1.2) é o do próprio roteador, e a coluna State diz Master. O endereço virtual (Group addr) é 192.168.1.1, a prioridade é 110, e a coluna Pre mostra Y, ou seja, o preempt está ligado.<\/p>\n<p>C2. É um DROTHER. Os outros dois roteadores são o DR (2.2.2.2) e o BDR (3.3.3.3), e a eleição só escolhe um de cada, então o terceiro roteador do segmento não tem esses papéis. Ele forma adjacência FULL só com o DR e o BDR.<\/p>\n<p>C3. Para o mail1.exemplo.com, que tem a menor preferência (10). O mail2, com 20, só é tentado se o primeiro falhar.<\/p>\n<p>C4. A Gi0/6: a taxa atual de broadcast (35,12%) passou do limite de 20%, e o estado é Blocking, ou seja, o storm control está filtrando o excesso. O estado Forwarding da Gi0/5 indica tráfego normal. Como a ação configurada é a padrão, a porta não foi desligada (o shutdown só ocorreria com <code>storm-control action shutdown<\/code>).<\/p>\n<p>C5. A facilidade é LINK, a gravidade é 3 e o mnemônico é UPDOWN. A gravidade 3 é Error (de 0 Emergency a 7 Debug). A interface Gi0/1 mudou para down.<\/p>\n<p>C6. Falta a autenticação AAA. O servidor SCP do IOS precisa do <code>aaa new-model<\/code> e do <code>aaa authorization exec default local<\/code> (e de uma chave RSA gerada para o SSH, que não aparece na saída porque as chaves não ficam na configuração). O <code>username<\/code>, o SSH nas linhas VTY e o <code>ip scp server enable<\/code> já estão ali.<\/p>\n<p>C7. Só os cabeçalhos externos (os endereços dos dois gateways, o protocolo ESP e o SPI, que identifica a associação de segurança) e o tamanho e o momento dos pacotes. O conteúdo e os endereços internos estão criptografados no modo túnel.<\/p>\n<p>C8. O Prompt 2. Tem persona (engenheiro de redes), instrução clara, formato de saída (a tabela) e cuidado com a classificação dos dados (sem senhas). O Prompt 1 é vago e o Prompt 3 expõe senhas e a configuração completa a um serviço externo. Em todos os casos, o resultado precisa de revisão humana.<\/p>", "kw": []}], "tail": ""}, {"title": "Cenários (médio e difícil)", "intro": "", "items": [{"id": "s4all", "n": null, "q": "<p><b>D1.<\/b> Você marcou a CCNA para 20/01/2027. Depois, pensou em remarcar para 10/02/2027. Qual versão você enfrenta em cada data, e o que muda no estudo?<\/p>\n<p><b>D2.<\/b> Um usuário de macOS acessa os sites por IP, mas não pelo nome. Que comandos você usa para verificar o endereço, a rota e o DNS dele?<\/p>\n<p><b>D3.<\/b> R1 (prioridade 100) e R2 (prioridade 110) usam VRRP com o endereço virtual 192.168.1.254, que não pertence a nenhum dos dois, e o preempt está no padrão. Quem é o master? O R2 cai e depois volta: quem é o master no fim?<\/p>\n<p><b>D4.<\/b> Dois roteadores têm só endereços IPv6, e você configurou <code>ipv6 router ospf 1<\/code> e <code>ipv6 ospf 1 area 0<\/code> nas interfaces. O OSPFv3 não sobe. Cite três causas que você verificaria.<\/p>\n<p><b>D5.<\/b> A matriz e a filial vão ser ligadas por uma VPN IPsec entre os roteadores de borda, e a filial está atrás de um NAT. Qual o modo do IPsec, que protocolo você escolhe para ter confidencialidade, e que tráfego o firewall precisa permitir?<\/p>\n<p><b>D6.<\/b> Um usuário ligou um mini-switch na porta de acesso do escritório e criou um loop entre duas portas dele. A rede do andar caiu. Que recursos da porta de acesso teriam evitado ou limitado o problema?<\/p>\n<p><b>D7.<\/b> Hosts IPv6 de uma VLAN começaram a receber um gateway link-local estranho, e o tráfego passa por um notebook. O que aconteceu, e que recurso previne isso?<\/p>\n<p><b>D8.<\/b> Você faz backup das configurações dos roteadores por TFTP. Proponha uma troca segura e diga o que precisa estar configurado.<\/p>", "a": "<p>D1. Em 20/01/2027 é a v1.1 (válida até 02/02/2027), com seis domínios e tópicos como REST, JSON, NTP, QoS e arquiteturas de WLAN. Em 10/02/2027 é a v2.0, com cinco domínios, mais troubleshooting e o domínio de IA, OSPFv3, VRRP, SFTP e SCP, registros DNS, storm control e RA guard. O estudo muda em relação aos tópicos que entram e saem, e os Módulos 14 e 17 mostram a diferença.<\/p>\n<p>D2. <code>ifconfig<\/code> (endereço e máscara), <code>netstat -rn<\/code> (tabela de rotas, com o gateway padrão), <code>scutil --dns<\/code> (servidores DNS configurados) e <code>nslookup nome<\/code> (testa a resolução). Se o IP funciona e o nome não, o foco é o DNS.<\/p>\n<p>D3. O R2 é o master (prioridade 110 contra 100). Quando o R2 cai, o R1 assume. Quando o R2 volta, ele retoma o papel de master, porque tem a maior prioridade e o preempt do VRRP vem ligado por padrão. No HSRP seria diferente, pois o preempt vem desligado.<\/p>\n<p>D4. Falta o <code>ipv6 unicast-routing<\/code> (o roteador não encaminha IPv6). Falta o Router ID de 32 bits, porque o roteador não tem nenhum endereço IPv4 e o OSPFv3 exige um ID no formato IPv4 (configure com <code>router-id<\/code>). As interfaces dos dois lados podem estar em áreas diferentes, ou ter parâmetros divergentes (hello e dead, tipo de rede, MTU), e o <code>ipv6 ospf 1 area 0<\/code> pode ter ficado em uma interface errada. Também vale checar se os endereços link-local se enxergam, e se alguma ACL IPv6 ou a interface passiva bloqueia.<\/p>\n<p>D5. Modo túnel (o pacote original inteiro é protegido e encapsulado), com o ESP (que criptografa). O firewall precisa permitir o IKE (UDP 500) e, como há NAT no caminho, o UDP 4500 (NAT-T), e o ESP (protocolo 50) quando não há encapsulamento em UDP.<\/p>\n<p>D6. O BPDU Guard (a porta vai para err-disabled ao receber BPDUs, que o mini-switch pode enviar), o storm control (limita a tempestade de broadcast), o port security (limita a quantidade de MACs na porta, e um mini-switch com vários dispositivos o violaria) e o STP em geral, com o PortFast apenas em portas de acesso.<\/p>\n<p>D7. Um dispositivo enviou anúncios de roteador (RA) falsos e se tornou o gateway da VLAN, o que permite interceptar o tráfego. O RA guard nas portas de acesso (não confiáveis) descarta os RAs.<\/p>\n<p>D8. Usar o SCP (ou o SFTP), que roda sobre o SSH. É preciso ter nome de domínio e chave RSA, o SSH habilitado, usuário local, o AAA (<code>aaa new-model<\/code> e <code>aaa authorization exec default local<\/code>) e o <code>ip scp server enable<\/code>. Do computador: <code>scp usuario@roteador:running-config backup.cfg<\/code>.<\/p>", "kw": []}], "tail": ""}, {"title": "Desafios (difícil)", "intro": "", "items": [{"id": "s5all", "n": null, "q": "<p><b>E1.<\/b> Escreva a configuração do OSPFv3 na área 0 para dois roteadores ligados pelo prefixo 2001:db8:12::/64 (R1 com ::1, R2 com ::2) e Router IDs 1.1.1.1 e 2.2.2.2, e liste os comandos de verificação.<\/p>\n<p><b>E2.<\/b> Compare HSRP, VRRP e GLBP em quatro aspectos: dono do protocolo, papéis, preempt por padrão e se há balanceamento de carga.<\/p>\n<p><b>E3.<\/b> Monte um prompt completo para pedir a uma IA que ajude a interpretar o <code>show ip ospf neighbor<\/code> de um roteador de produção, usando os quatro componentes, e diga o que você tiraria da saída antes de enviá-la.<\/p>\n<p><b>E4.<\/b> Um site novo, recém-migrado para outro servidor, abre para alguns usuários e não para outros. Explique, usando os registros DNS e o TTL, e diga como investigar.<\/p>\n<p><b>E5.<\/b> Você tem 20 horas de revisão para a v2.0 e quer dividi-las na proporção dos pesos dos domínios. Calcule as horas e diga o que você faria com o domínio que, na sua autoavaliação, é o mais fraco.<\/p>\n<p><b>E6.<\/b> Você roda duas VMs no VirtualBox e quer que elas conversem entre si e com a internet, mas sem aparecer na rede física. Que modo de rede escolheria, e que outros modos o VirtualBox oferece?<\/p>\n<p><b>E7.<\/b> Uma equipe quer que um agente de IA aplique correções automaticamente nos switches. Cite os controles que você exigiria.<\/p>\n<p><b>E8.<\/b> Dê as vantagens e as limitações de usar o SCP em vez do TFTP para atualizar o IOS de um roteador, e diga o que verificaria depois da cópia.<\/p>", "a": "<p>E1. R1: <code>ipv6 unicast-routing<\/code>, <code>ipv6 router ospf 1<\/code>, <code>router-id 1.1.1.1<\/code>, e na interface <code>ipv6 address 2001:db8:12::1/64<\/code> e <code>ipv6 ospf 1 area 0<\/code>. R2: igual, com <code>router-id 2.2.2.2<\/code> e o endereço <code>2001:db8:12::2/64<\/code>. Verificação: <code>show ipv6 ospf neighbor<\/code> (estado FULL), <code>show ipv6 ospf interface<\/code>, <code>show ipv6 route ospf<\/code> e <code>ping<\/code> ao endereço do vizinho.<\/p>\n<p>E2. O HSRP é da Cisco, tem um roteador ativo e um standby, e o preempt vem desligado por padrão. Não balanceia entre grupos sozinho (só com vários grupos configurados à mão). O VRRP é um padrão aberto (IETF), tem um master e backups, e o preempt vem ligado por padrão. O GLBP é da Cisco, elege um AVG que distribui diferentes MACs virtuais, e por isso balanceia o tráfego entre vários gateways ao mesmo tempo.<\/p>\n<p>E3. Um exemplo: \"Atue como engenheiro de redes sênior e explique em português. O texto abaixo é o <code>show ip ospf neighbor<\/code> de um roteador de produção, com os nomes e os endereços trocados por exemplos. Explique cada estado dos vizinhos, indique qual está com problema e liste, em uma tabela (causa provável, comando para verificar, correção), as causas mais prováveis. Não invente comandos e avise se faltar informação.\" Antes de enviar, trocaria os endereços reais, os nomes de equipamentos e de interfaces que revelem a topologia, e removeria qualquer senha, chave ou dado de cliente.<\/p>\n<p>E4. Os servidores DNS recursivos guardam a resposta em cache pelo TTL do registro A (ou AAAA) antigo. Quem consultou há pouco ainda recebe o IP antigo, e quem consultou depois recebe o novo. Também pode haver um NS antigo respondendo, ou um registro CNAME apontando para o lugar errado. Para investigar: <code>nslookup site.com<\/code> e <code>nslookup site.com 8.8.8.8<\/code> (comparam respostas), <code>nslookup -type=NS site.com<\/code>, <code>dig site.com<\/code> (mostra o TTL restante) e limpar o cache do cliente (<code>ipconfig /flushdns<\/code> no Windows). O ideal é baixar o TTL antes da migração.<\/p>\n<p>E5. Na proporção 25, 25, 20, 20 e 10 por cento, as horas são 5, 5, 4, 4 e 2. Para o domínio mais fraco, eu tiraria horas do mais forte e reforçaria com laboratório e questões desse domínio (mas sem zerar nenhum), refazendo os laboratórios do módulo e acompanhando o desempenho nos simulados.<\/p>\n<p>E6. Para as VMs falarem entre si e com a internet sem aparecerem na rede física, o modo NAT Network é a escolha (as VMs compartilham uma rede privada e saem por NAT). O VirtualBox também oferece o NAT (cada VM isolada, saindo por NAT), a rede em ponte (bridged, a VM aparece na rede física como mais um host), a rede interna (só entre as VMs, sem saída) e a rede apenas de hospedeiro (host-only, entre as VMs e o computador, sem internet).<\/p>\n<p>E7. Privilégio mínimo (credenciais só com os comandos necessários), aprovação humana antes de aplicar mudanças fora de uma lista segura, ambiente de teste, registro de todas as ações (AAA e syslog), cópia da configuração e plano de reversão, janelas de mudança, limite de escopo (quais equipamentos e quais comandos) e revisão periódica dos resultados.<\/p>\n<p>E8. As vantagens são a criptografia do canal e a autenticação do usuário. As limitações são a necessidade de SSH e AAA configurados no equipamento e o processamento extra da criptografia no roteador. Depois da cópia, verifico a integridade comparando o hash (<code>verify /md5 flash:imagem.bin<\/code> contra o valor publicado pelo fabricante) e só então configuro o boot e reinicio.<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
