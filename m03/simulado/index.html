</main><script>window.ACT={"kind": "exam", "id": "m03-sim", "title": "Simulado do módulo 3", "minutes": 15, "goal": 13, "qs": [{"q": "<p>Qual camada do OSI é responsável pelo roteamento entre redes?<\/p>", "type": "open", "expl": "<p><b>Camada 3 (Rede)<\/b>.<\/p>"}, {"q": "<p>Qual é a PDU da camada de transporte quando o protocolo é TCP?<\/p>", "type": "open", "expl": "<p><b>Segmento<\/b>.<\/p>"}, {"q": "<p>Um switch comum encaminha com base em qual endereço?<\/p>", "type": "open", "expl": "<p><b>MAC de destino<\/b> (camada 2).<\/p>"}, {"q": "<p>Qual camada do TCP/IP (4 camadas) engloba as camadas 5, 6 e 7 do OSI?<\/p>", "type": "open", "expl": "<p><b>Aplicação<\/b>.<\/p>"}, {"q": "<p>Em qual camada atua o protocolo UDP?<\/p>", "type": "open", "expl": "<p><b>Camada 4 (Transporte)<\/b>.<\/p>"}, {"q": "<p>O cabo de rede foi desconectado. Qual camada do OSI está com problema?<\/p>", "type": "open", "expl": "<p><b>Camada 1 (Física)<\/b>.<\/p>"}, {"q": "<p>Qual camada adiciona o trailer FCS ao quadro?<\/p>", "type": "open", "expl": "<p><b>Camada 2 (Enlace)<\/b>: o FCS é um trailer do quadro Ethernet.<\/p>"}, {"q": "<p>A parte que identifica \"para qual programa\" os dados vão, dentro do host, é:<\/p>", "type": "open", "expl": "<p><b>Número de porta<\/b> (camada 4).<\/p>"}, {"q": "<p>O que muda a cada salto em uma rede roteada: IPs ou MACs?<\/p>", "type": "open", "expl": "<p><b>Os MACs mudam<\/b>; os IPs permanecem (sem NAT).<\/p>"}, {"q": "<p>Qual protocolo de aplicação resolve nomes em endereços IP?<\/p>", "type": "open", "expl": "<p><b>DNS<\/b>.<\/p>"}, {"q": "<p>Em qual ordem o emissor cria as PDUs?<\/p>", "type": "open", "expl": "<p>Dados → segmento → pacote → quadro → bits.<\/p>"}, {"q": "<p>Qual é o MSS em uma Ethernet com MTU 1500 (cabeçalhos IP e TCP sem opções)?<\/p>", "type": "open", "expl": "<p><b>1460 bytes<\/b> (1500 − 20 − 20).<\/p>"}, {"q": "<p>O ping para o gateway funciona, mas o site não abre e <code>nslookup<\/code> falha. Qual camada você investiga primeiro?<\/p>", "type": "open", "expl": "<p><b>DNS (camada 7)<\/b>: a conectividade IP até o gateway já funciona, então o problema está acima.<\/p>"}, {"q": "<p>Qual a diferença entre modelo OSI e TCP/IP quanto ao uso?<\/p>", "type": "open", "expl": "<p>O OSI é um modelo de <b>referência<\/b> (ensino e linguagem comum); o TCP/IP é o modelo <b>implementado<\/b> na Internet.<\/p>"}, {"q": "<p>Um hub está em qual camada? E um roteador?<\/p>", "type": "open", "expl": "<p>Hub: <b>camada 1<\/b>; roteador: <b>camada 3<\/b>.<\/p>"}], "scoring": "Pontuação: 13 a 15 = pronto para seguir; 10 a 12 = revise as seções 2 a 4; abaixo de 10 = refaça os exercícios A a D."};</script><script src="../../assets/app.js"></script></body></html>
