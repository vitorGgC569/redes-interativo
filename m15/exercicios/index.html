<header class="top"><p class="eyebrow">Módulo 15 · Troubleshooting</p><h1>Exercícios</h1><p class="lead">Listas do fácil ao difícil. Escreva a sua resposta, clique em <b>Verificar</b> e compare com o gabarito comentado; depois marque se acertou.</p></header>

</main><script>window.ACT={"kind": "cards", "id": "m15-ex", "sections": [{"title": "Conceitos (fácil)", "intro": "", "items": [{"id": "s1q1", "n": 1, "q": "<p>Cite as sete etapas da metodologia de troubleshooting, na ordem.<\/p>", "a": "<p>Identificar o problema; estabelecer uma teoria da causa provável; testar a teoria; estabelecer um plano de ação e avaliar os efeitos; implementar a solução ou escalar; verificar o funcionamento completo e prevenir; documentar.<\/p>", "kw": []}, {"id": "s1q2", "n": 2, "q": "<p>O que significa a abordagem bottom-up, e quando ela é a mais indicada?<\/p>", "a": "<p>Começar pela camada física e subir até a aplicação. É a mais completa, e a mais indicada quando se suspeita de cabo, porta ou equipamento, ou quando não se tem pista alguma.<\/p>", "kw": []}, {"id": "s1q3", "n": 3, "q": "<p>Que pergunta ao usuário costuma ser a mais valiosa na primeira etapa?<\/p>", "a": "<p>\"O que mudou?\". Redes que funcionavam raramente quebram sem motivo, e a mudança recente costuma ser a causa.<\/p>", "kw": []}, {"id": "s1q4", "n": 4, "q": "<p>O que significa um endereço 169.254.x.x em um PC?<\/p>", "a": "<p>É um endereço APIPA, atribuído pelo próprio sistema quando não consegue obter um endereço de um servidor DHCP. O problema é a obtenção do endereço (DHCP, VLAN, relay, cabo).<\/p>", "kw": []}, {"id": "s1q5", "n": 5, "q": "<p>O que a coluna \"Protocol\" do <code>show ip interface brief<\/code> indica, e o que significa <code>up/down<\/code>?<\/p>", "a": "<p>Indica o estado da camada 2 (protocolo de enlace). <code>up/down<\/code> significa que a camada física está ativa, mas o protocolo de enlace não, por exemplo por encapsulamento diferente em um serial ou por uma SVI cuja VLAN não tem porta ativa.<\/p>", "kw": []}, {"id": "s1q6", "n": 6, "q": "<p>Para que servem os comandos <code>ipconfig /release<\/code> e <code>ipconfig /renew<\/code>?<\/p>", "a": "<p>O <code>/release<\/code> devolve o endereço obtido por DHCP, e o <code>/renew<\/code> pede um novo (ou renova o atual) ao servidor.<\/p>", "kw": []}, {"id": "s1q7", "n": 7, "q": "<p>Qual a diferença entre um testador de cabo e um certificador?<\/p>", "a": "<p>O testador verifica continuidade e o mapeamento dos pares (aberto, curto, invertido). O certificador também mede o desempenho (atenuação, diafonia) e confirma se o cabo atende à categoria (como Cat 6).<\/p>", "kw": []}, {"id": "s1q8", "n": 8, "q": "<p>Para que servem a sonda e o gerador de tom?<\/p>", "a": "<p>Para encontrar a outra ponta de um cabo não identificado. O gerador envia um sinal em um dos lados, e a sonda o detecta perto do cabo correto, no patch panel por exemplo.<\/p>", "kw": []}, {"id": "s1q9", "n": 9, "q": "<p>Que porta e protocolo de transporte o syslog usa? E o NTP?<\/p>", "a": "<p>O syslog usa UDP 514, e o NTP usa UDP 123.<\/p>", "kw": []}, {"id": "s1q10", "n": 10, "q": "<p>Qual a diferença entre <code>Trap<\/code> e <code>Get<\/code> no SNMP?<\/p>", "a": "<p><code>Get<\/code> é uma consulta feita pelo gerenciador ao agente. <code>Trap<\/code> é um aviso que o agente envia por conta própria ao gerenciador, quando algo acontece (UDP 162).<\/p>", "kw": []}], "tail": ""}, {"title": "Associações (fácil)", "intro": "", "items": [{"id": "s2all", "n": null, "q": "<p>Ligue cada sintoma da primeira lista à causa mais provável.<\/p>\n<ol><li>Link down/down em uma porta de switch, sem luz.<\/li><li>Rede lenta, com colisões em um lado e CRC no outro.<\/li><li>Ping por IP funciona, por nome não.<\/li><li>Host com 169.254.10.7.<\/li><li>MAC aparecendo ora em uma porta, ora em outra, e rede inteira caída.<\/li><li>OSPF preso em EXSTART.<\/li><li>Sites grandes não abrem, mas os pequenos sim.<\/li><li>Porta do switch desligada sozinha, em <code>err-disabled<\/code>.<\/li><\/ol>\n<p>Causas: (a) Duplex mismatch. (b) Problema de DNS. (c) Cabo, porta ou ponta remota. (d) Loop de camada 2. (e) DHCP indisponível ou sem relay. (f) MTU diferente entre os vizinhos. (g) MTU do caminho menor que o esperado, com ICMP bloqueado. (h) Violação de port security ou BPDU Guard.<\/p>", "a": "<ol><li>c. 2. a. 3. b. 4. e. 5. d. 6. f (a vizinhança trava na troca de DBD quando os MTUs diferem). 7. g. 8. h.<\/li><\/ol>", "kw": []}], "tail": ""}, {"title": "Leitura de saídas (médio)", "intro": "", "items": [{"id": "s3all", "n": null, "q": "<p><b>C1.<\/b> Que problema a saída mostra, e qual o primeiro passo?<\/p>\n<pre><code>Switch# show ip interface brief\nInterface         IP-Address     OK? Method Status                Protocol\nVlan1             192.168.1.2    YES manual up                    up\nFastEthernet0/1   unassigned     YES unset  up                    up\nFastEthernet0/2   unassigned     YES unset  down                  down\nFastEthernet0/3   unassigned     YES unset  administratively down down<\/code><\/pre>\n<p><b>C2.<\/b> Em qual lado há half duplex?<\/p>\n<pre><code>R1# show interfaces gigabitEthernet 0/0 | include collisions|CRC|duplex\n  Full-duplex, 1000Mb/s\n  0 input errors, 4821 CRC, 0 frame\n  0 collisions, 0 late collision\nSW1# show interfaces gigabitEthernet 0/1 | include collisions|CRC|duplex\n  Half-duplex, 1000Mb/s\n  312 collisions, 97 late collision<\/code><\/pre>\n<p><b>C3.<\/b> O que o <code>tracert<\/code> mostra, e onde provavelmente está o defeito?<\/p>\n<pre><code>C:\\&gt; tracert 10.20.0.10\n  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.1.1\n  2     2 ms     2 ms     2 ms  10.0.0.2\n  3     *        *        *     Request timed out.\n  4     *        *        *     Request timed out.<\/code><\/pre>\n<p><b>C4.<\/b> Que mensagem de syslog é essa? Qual a facilidade, a gravidade e o significado?<\/p>\n<pre><code>%LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to down<\/code><\/pre>\n<p><b>C5.<\/b> O que o <code>show ip ospf neighbor<\/code> indica?<\/p>\n<pre><code>R1# show ip ospf neighbor\nNeighbor ID  Pri  State        Dead Time  Address      Interface\n2.2.2.2        1  EXSTART/DR   00:00:34   10.0.12.2    GigabitEthernet0/0<\/code><\/pre>", "a": "<p>C1. A Fa0/2 está down/down: problema físico (cabo ausente ou rompido, ponta remota desligada). A Fa0/3 está <code>administratively down<\/code>, ou seja, alguém a desligou com <code>shutdown<\/code>, e basta <code>no shutdown<\/code> se a porta deve estar ativa. A Fa0/1 e a VLAN 1 estão normais. Primeiro passo: verificar o cabo e a ponta remota da Fa0/2.<\/p>\n<p>C2. O SW1 está em half duplex (e vê colisões e late collisions). O R1 está em full duplex, e por isso vê CRC. É um duplex mismatch, e a correção é configurar os dois lados do mesmo jeito (de preferência, auto nos dois).<\/p>\n<p>C3. O tráfego passa pelo gateway (192.168.1.1) e pelo segundo salto (10.0.0.2), e some a partir do terceiro. O defeito está no salto seguinte a 10.0.0.2: pode ser falta de rota (no 10.0.0.2 ou depois dele) ou de rota de retorno, uma ACL ou um firewall. Os asteriscos só mostram que não houve resposta, o que também ocorre quando os equipamentos simplesmente não respondem ao traceroute.<\/p>\n<p>C4. Facilidade <code>LINK<\/code>, gravidade 3 (Error) e mnemônico <code>UPDOWN<\/code>. A interface Gi0/2 mudou para o estado down. Com <code>logging trap warnings<\/code> ela é enviada ao servidor, porque 3 é mais grave que 4.<\/p>\n<p>C5. O vizinho 2.2.2.2 está em EXSTART, e a troca de pacotes de descrição de banco de dados (DBD) não termina. A causa clássica é o MTU diferente entre as duas interfaces. Compare com <code>show interfaces<\/code> e <code>show ip ospf interface<\/code> nos dois lados.<\/p>", "kw": []}], "tail": ""}, {"title": "Cenários (médio e difícil)", "intro": "", "items": [{"id": "s4all", "n": null, "q": "<p><b>D1.<\/b> Um usuário diz que \"a internet caiu\". Você faz o ping do PC para o gateway e funciona, para 8.8.8.8 funciona, e para www.exemplo.com falha. Qual a causa e o próximo passo?<\/p>\n<p><b>D2.<\/b> Um PC novo foi ligado a uma porta que você configurou na VLAN 20. Ele pega 169.254.x.x, mas outros PCs da VLAN 20 funcionam bem. Dê três hipóteses e o comando para verificar cada uma.<\/p>\n<p><b>D3.<\/b> A filial A alcança a matriz, mas a matriz não alcança a filial A. O tracert da matriz morre no roteador de borda. O que você verifica?<\/p>\n<p><b>D4.<\/b> Depois de uma mudança na sexta à noite, a rede do prédio ficou instável, com LEDs piscando sem parar. Alguém conectou um switch pequeno de mesa entre duas tomadas de parede. Explique o que ocorreu e como prevenir.<\/p>\n<p><b>D5.<\/b> Dois roteadores ligados por Gigabit não formam vizinhança OSPF. Liste cinco itens que precisam ser iguais ou compatíveis nos dois lados.<\/p>\n<p><b>D6.<\/b> O Wi-Fi da sala de reuniões funciona de manhã e piora à tarde, quando a sala fica cheia. Dê três hipóteses.<\/p>\n<p><b>D7.<\/b> O link de 100 Mb/s entre dois switches funciona, mas <code>show interfaces<\/code> mostra milhares de CRC. Que testes você faz, em ordem?<\/p>", "a": "<p>D1. É um problema de DNS: o caminho IP funciona (gateway e internet), mas o nome não resolve. Confirme com <code>nslookup www.exemplo.com<\/code> e veja qual servidor DNS o PC usa (<code>ipconfig /all<\/code>). O próximo passo é testar outro servidor DNS (<code>nslookup www.exemplo.com 8.8.8.8<\/code>) e, se funcionar, o problema é o servidor DNS configurado (ou o DHCP que o entrega).<\/p>\n<p>D2. (1) A porta ou o cabo do PC novo está com problema: <code>show interfaces status<\/code> e trocar o cabo. (2) A porta está em VLAN errada ou em modo trunk: <code>show vlan brief<\/code>, <code>show interfaces trunk<\/code>. (3) Um recurso de segurança está bloqueando: port security (<code>show port-security interface<\/code>) ou DHCP snooping, e a porta virou err-disabled. Também é possível que a placa do PC esteja com o adaptador desativado ou com IP estático antigo (<code>ipconfig /all<\/code>).<\/p>\n<p>D3. Provavelmente a rota de retorno. Verifique na matriz se existe uma rota para a rede da filial A (<code>show ip route<\/code>) e, no roteador de borda, para onde ela aponta. Também confira ACLs (<code>show access-lists<\/code>, <code>show ip interface<\/code>), NAT e o próximo salto. A assimetria é comum: o pacote chega mas o retorno não encontra rota.<\/p>\n<p>D4. O switch de mesa, ligado em dois pontos da rede, criou um loop de camada 2. Sem o STP funcionando ou sem a proteção correta, o broadcast circula e se multiplica, e a rede cai. Para prevenir, mantenha o STP ativo, ative PortFast e BPDU Guard nas portas de acesso (o BPDU Guard desativa a porta ao receber um BPDU), e documente a política de que não se ligam switches sem autorização.<\/p>\n<p>D5. Hello e Dead intervals, ID da área, máscara e sub-rede da interface, tipo de rede (broadcast, ponto a ponto), autenticação (se configurada), MTU e Router ID distinto, além de a interface não estar como passiva e de nenhuma ACL bloquear o protocolo 89 do OSPF.<\/p>\n<p>D6. A sala cheia significa mais clientes no mesmo AP (capacidade e tempo de ar), mais dispositivos concorrendo, e possível interferência (outros APs no mesmo canal, ou celulares com hotspots). Verifique o número de clientes associados, os canais de redes vizinhas com um analisador de Wi-Fi, e considere a banda de 5 GHz, outro canal ou um segundo AP.<\/p>\n<p>D7. Primeiro, troque o cabo (por um de qualidade e com menos de 100 m) e teste de novo. Depois, confira o duplex nos dois lados (mismatch gera CRC e colisões). Em seguida, um certificador no cabo, se for um lance fixo, e mude de porta (porta com defeito). Procure fontes de interferência (cabos de energia paralelos) e, por último, a SFP ou o módulo, se for fibra.<\/p>", "kw": []}], "tail": ""}, {"title": "Desafios (difícil)", "intro": "", "items": [{"id": "s5all", "n": null, "q": "<p><b>E1.<\/b> Você recebeu o chamado: \"um PC da VLAN 10 não acessa o servidor da VLAN 20, mas outros PCs da VLAN 10 acessam\". Monte, por escrito, a sequência de oito testes (comandos e o que esperaria de cada um) que usaria, e diga para onde cada resultado aponta.<\/p>\n<p><b>E2.<\/b> Explique por que um ping bem-sucedido não prova que o aplicativo vai funcionar, e que testes você faria em seguida.<\/p>\n<p><b>E3.<\/b> Um colega diz que \"sempre que vê um erro CRC, o problema é o cabo\". Mostre por que a afirmação é incompleta.<\/p>", "a": "<p>E1. Uma sequência possível: (1) <code>ipconfig /all<\/code> no PC (IP, máscara, gateway, DNS; confirma se o problema é só deste PC). (2) Ping ao gateway da VLAN 10 (camada 1 a 3 local: se falhar, cabo, porta, VLAN, máscara). (3) <code>arp -a<\/code> e ping a outro PC da VLAN 10 (comunicação local). (4) Ping ao servidor por IP (alcance entre VLANs, ou seja, roteamento). (5) <code>tracert<\/code> ao servidor (onde o caminho para). (6) No switch: <code>show vlan brief<\/code> e <code>show interfaces status<\/code> da porta do PC (VLAN certa, status). (7) No roteador ou switch de camada 3: <code>show ip route<\/code> e <code>show access-lists<\/code> (ACL entre as VLANs). (8) <code>Test-NetConnection servidor -Port 443<\/code> (ou a porta do serviço), para confirmar a camada 4 e a aplicação. Como outros PCs da VLAN 10 funcionam, as causas mais prováveis são específicas deste PC: IP ou máscara ou gateway estáticos errados, porta em VLAN errada, ou firewall local do PC.<\/p>\n<p>E2. O ping só prova a conectividade IP (ICMP) entre os dois pontos. O aplicativo usa TCP ou UDP em uma porta específica, que pode estar bloqueada por ACL ou firewall, o serviço pode estar parado, o DNS pode apontar para outro lugar, e o MTU pode derrubar pacotes grandes. Os testes seguintes são: <code>Test-NetConnection -Port<\/code> ou <code>nmap -p<\/code> (a porta responde?), <code>nslookup<\/code> (o nome resolve para o IP certo?), <code>netstat -ano<\/code> no servidor (o serviço escuta?), uma captura com o Wireshark (o handshake TCP se completa?) e o ping com o bit DF para o MTU.<\/p>\n<p>E3. O CRC indica que o quadro chegou corrompido, mas a causa pode estar no cabo ou nos conectores, no duplex mismatch, na interferência eletromagnética, em uma placa ou porta com defeito, em um módulo óptico ou em um comprimento acima de 100 m. Por isso se investiga em ordem: duplex, cabo, porta, interferência.<\/p>", "kw": []}], "tail": ""}]};</script><script src="../../assets/app.js"></script></body></html>
