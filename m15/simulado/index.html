<footer class="foot"><span>Curso de Redes de Computadores</span><span>·</span><a href="../../">Todas as atividades</a><span>·</span><span>Seu progresso fica salvo só neste navegador.</span></footer>
</main><script>window.ACT={"kind": "exam", "id": "m15-sim", "title": "Simulado do módulo 15", "minutes": 15, "goal": 13, "qs": [{"q": "Qual é a primeira etapa da metodologia de troubleshooting da CompTIA?", "type": "mc", "opts": ["Testar a teoria", "Identificar o problema", "Documentar", "Implementar a solução"], "ans": [1], "expl": "<p>A metodologia começa por identificar o problema (reunir informações, perguntar ao usuário e saber o que mudou).<\/p>"}, {"q": "Depois de testar uma teoria e ela ser refutada, qual o passo seguinte?", "type": "mc", "opts": ["Documentar", "Estabelecer uma nova teoria ou escalar", "Implementar a solução", "Encerrar o chamado"], "ans": [1], "expl": "<p>Se a teoria é refutada, cria-se outra, ou escala-se o problema para quem tem mais conhecimento ou acesso.<\/p>"}, {"q": "Um PC mostra o endereço 169.254.33.8. Qual a causa mais provável?", "type": "mc", "opts": ["Falha no servidor DNS", "Não conseguiu obter endereço de um servidor DHCP", "Gateway errado", "Cabo de fibra defeituoso"], "ans": [1], "expl": "<p>169.254.0.0/16 é o APIPA, atribuído quando o host não obtém endereço por DHCP. Um DNS ou um gateway errado não muda o endereço do host.<\/p>"}, {"q": "A interface mostra <code>up/down<\/code> no <code>show ip interface brief<\/code>. O que isso indica?", "type": "mc", "opts": ["A interface foi desligada pelo administrador", "A camada física está ativa, mas o protocolo de enlace não", "Não há cabo", "Tudo está normal"], "ans": [1], "expl": "<p>O status (primeira coluna) é a camada física, e o protocolo (segunda) é a camada 2. Administratively down é o shutdown, e down/down é problema físico.<\/p>"}, {"q": "Em um duplex mismatch, o que se observa?", "type": "mc", "opts": ["Colisões e late collisions no lado half duplex, e CRC no lado full duplex", "Nada", "Perda do endereço IP", "Erro de DNS"], "ans": [0], "expl": "<p>O lado half duplex detecta colisões (inclusive late collisions), e o lado full duplex recebe quadros cortados e acusa CRC e erros de quadro. O usuário percebe lentidão.<\/p>"}, {"q": "Qual comando testa se uma porta TCP está aberta em um destino, no PowerShell?", "type": "mc", "opts": ["ping", "Test-NetConnection -Port", "ipconfig", "arp"], "ans": [1], "expl": "<p>O <code>Test-NetConnection destino -Port 443<\/code> testa a porta TCP. O ping só usa o ICMP.<\/p>"}, {"q": "O ping para um IP funciona, mas para o nome não. Qual a causa mais provável?", "type": "mc", "opts": ["Cabo", "Gateway", "DNS", "Máscara"], "ans": [2], "expl": "<p>Se o IP responde, o caminho existe. O que falha é a resolução do nome (<code>nslookup<\/code> confirma).<\/p>"}, {"q": "Qual ferramenta localiza uma ruptura em um cabo de fibra, informando a distância?", "type": "mc", "opts": ["Multímetro", "Gerador de tom", "OTDR", "Crimpador"], "ans": [2], "expl": "<p>O OTDR envia pulsos de luz e mede os reflexos, e indica a distância até emendas, perdas e rompimentos. O multímetro e o gerador de tom são para cobre.<\/p>"}, {"q": "Qual a gravidade do syslog \"Error\"?", "type": "mc", "opts": ["0", "3", "5", "7"], "ans": [1], "expl": "<p>As gravidades vão de 0 (Emergency), 1 (Alert), 2 (Critical), 3 (Error), 4 (Warning), 5 (Notice), 6 (Informational) a 7 (Debug).<\/p>"}, {"q": "Qual a porta e o protocolo de transporte do NTP?", "type": "mc", "opts": ["TCP 123", "UDP 123", "UDP 161", "UDP 514"], "ans": [1], "expl": "<p>O NTP usa UDP 123. UDP 161 é o SNMP e UDP 514 é o syslog.<\/p>"}, {"q": "Qual versão do SNMP oferece autenticação de usuário e criptografia?", "type": "mc", "opts": ["v1", "v2c", "v3", "Todas"], "ans": [2], "expl": "<p>O SNMPv3 acrescenta autenticação e criptografia. As versões 1 e 2c usam só uma community string em texto claro.<\/p>"}, {"q": "A rede inteira cai, os LEDs dos switches piscam sem parar e o MAC de um servidor muda de porta continuamente. Qual a causa provável?", "type": "mc", "opts": ["Duplex mismatch", "Loop de camada 2", "DNS fora do ar", "NTP desatualizado"], "ans": [1], "expl": "<p>É a tempestade de broadcast de um loop. O sinal do MAC mudando de porta (MAC flapping) é típico. A prevenção é o STP, o PortFast e o BPDU Guard.<\/p>"}, {"q": "Qual comando mostra os vizinhos OSPF e seus estados?", "type": "mc", "opts": ["show ip route", "show ip ospf neighbor", "show cdp neighbors", "show interfaces"], "ans": [1], "expl": "<p>O <code>show ip ospf neighbor<\/code> lista os vizinhos, o estado (Down, Init, 2-Way, ExStart, Exchange, Loading, Full) e a interface.<\/p>"}, {"q": "Qual das abordagens começa pela camada de aplicação e desce?", "type": "mc", "opts": ["Bottom-up", "Top-down", "Dividir para conquistar", "Substituição de componentes"], "ans": [1], "expl": "<p>Top-down vai da aplicação para a camada física. O bottom-up faz o contrário, e o dividir para conquistar começa no meio (geralmente um ping).<\/p>"}, {"q": "Um cabo passa no teste de continuidade, mas tem baixo desempenho e muita diafonia. Qual equipamento revelaria isso?", "type": "mc", "opts": ["Testador simples de continuidade", "Certificador de cabos", "Multímetro", "Loopback plug"], "ans": [1], "expl": "<p>O certificador mede o desempenho (atenuação, diafonia) e confirma se o cabo atende à categoria. Um testador simples só confere a continuidade e o mapeamento.<\/p>"}], "scoring": null};</script><script src="../../assets/app.js"></script></body></html>
