<header class="top"><p class="eyebrow">Módulo 16 · Simulados Network+</p><h1>Simulado</h1><p class="lead">15 questões, cronômetro e revisão comentada.</p></header>

<footer class="foot"><span>Curso de Redes de Computadores</span><span>·</span><a href="../../">Todas as atividades</a><span>·</span><span>Seu progresso fica salvo só neste navegador.</span></footer>
</main><script>window.ACT={"kind": "exam", "id": "m16-sim", "title": "Simulado do módulo 16", "minutes": 15, "goal": 13, "qs": [{"q": "Um técnico precisa de um conector de fibra pequeno, para um transceptor SFP duplex. Qual escolher?", "type": "mc", "opts": ["SC", "LC", "ST", "F-type"], "ans": [1], "expl": "<p>O LC é o conector pequeno dos SFP, geralmente em par. O SC é maior e quadrado, o ST é de baioneta, e o F-type é coaxial.<\/p>"}, {"q": "Qual modelo de nuvem permite executar seu código sem gerenciar o servidor nem o sistema operacional?", "type": "mc", "opts": ["IaaS", "PaaS", "SaaS", "Nuvem privada"], "ans": [1], "expl": "<p>No PaaS você traz o código e o provedor cuida da infraestrutura e da plataforma. No IaaS, você cuida do SO, e no SaaS recebe o software pronto.<\/p>"}, {"q": "Qual porta e protocolo usam o SSH e o SFTP?", "type": "mc", "opts": ["21 TCP", "22 TCP", "23 TCP", "443 TCP"], "ans": [1], "expl": "<p>SSH e SFTP usam a porta 22 TCP. 21 é o controle do FTP, 23 é o Telnet.<\/p>"}, {"q": "Um site com 40 servidores precisa de muita largura de banda entre eles (tráfego leste-oeste) e o mesmo número de saltos entre qualquer par. Qual arquitetura?", "type": "mc", "opts": ["Três camadas", "Hub e spoke", "Spine and leaf", "Barramento"], "ans": [2], "expl": "<p>Em spine and leaf, cada leaf liga em todos os spines, e o caminho entre servidores tem sempre o mesmo número de saltos.<\/p>"}, {"q": "Dois roteadores devem compartilhar um IP virtual como gateway padrão, com um deles ativo e o outro em espera. Qual protocolo (proprietário da Cisco) faz isso?", "type": "mc", "opts": ["HSRP", "OSPF", "STP", "LLDP"], "ans": [0], "expl": "<p>HSRP (Cisco). O VRRP é o equivalente aberto. OSPF e STP têm outras funções, e o LLDP descobre vizinhos.<\/p>"}, {"q": "Uma câmera IP exige 25 W. Qual o padrão PoE mínimo?", "type": "mc", "opts": ["802.3af", "802.3at", "802.3u", "802.1Q"], "ans": [1], "expl": "<p>O 802.3at (PoE+) fornece até 30 W. O 802.3af, só 15,4 W. Os padrões 802.3u e 802.1Q não são de energia.<\/p>"}, {"q": "O que o NAT com sobrecarga (PAT) usa para distinguir as conexões dos hosts internos?", "type": "mc", "opts": ["Os endereços MAC", "As portas de origem", "Os VLAN IDs", "Os TTL"], "ans": [1], "expl": "<p>O PAT distingue as conexões pelas portas de origem (e a tabela de tradução).<\/p>"}, {"q": "Uma empresa aceita perder no máximo 4 horas de dados, e precisa restaurar o sistema em 2 horas. Quais são o RPO e o RTO?", "type": "mc", "opts": ["RPO 2 h e RTO 4 h", "RPO 4 h e RTO 2 h", "RPO e RTO de 6 h", "RPO 4 h e RTO 4 h"], "ans": [1], "expl": "<p>O RPO é a perda de dados aceitável (4 horas), e o RTO é o tempo para restaurar (2 horas).<\/p>"}, {"q": "Qual item da documentação registra a etiqueta de cada cabo e as portas do patch panel?", "type": "mc", "opts": ["IPAM", "Mapa de cabos (cable map)", "SLA", "Baseline"], "ans": [1], "expl": "<p>O mapa de cabos. O IPAM registra endereços, o SLA é o acordo de serviço, e a baseline é a referência de desempenho.<\/p>"}, {"q": "Qual o objetivo de um sistema SIEM?", "type": "mc", "opts": ["Acelerar o Wi-Fi", "Agregar e correlacionar logs de muitos equipamentos", "Atribuir endereços IP", "Rotear pacotes"], "ans": [1], "expl": "<p>O SIEM centraliza e correlaciona logs, e gera alertas.<\/p>"}, {"q": "Um visitante liga um roteador Wi-Fi pessoal a uma tomada da empresa e passa a oferecer DHCP. Qual a ameaça e uma defesa?", "type": "mc", "opts": ["Rogue DHCP, com DHCP snooping", "DoS, com NAT", "Phishing, com VLAN", "Evil twin, com PoE"], "ans": [0], "expl": "<p>Um servidor DHCP não autorizado (rogue). A defesa é o DHCP snooping, que só aceita ofertas de portas confiáveis. Também ajudam o NAC e a política de uso.<\/p>"}, {"q": "Um servidor autentica administradores de switches e registra cada comando executado. Qual protocolo é o mais indicado?", "type": "mc", "opts": ["RADIUS", "TACACS+", "SNMPv2c", "DNS"], "ans": [1], "expl": "<p>O TACACS+ separa AAA e permite autorizar e registrar comandos. O RADIUS também faz AAA, mas é mais usado para acesso à rede (Wi-Fi, VPN).<\/p>"}, {"q": "Um usuário não acessa nada, e o <code>ipconfig<\/code> mostra 169.254.20.7. Qual o primeiro item a verificar?", "type": "mc", "opts": ["O gateway da internet", "Se o cliente alcança um servidor DHCP (cabo, VLAN, relay)", "O NTP", "O certificado TLS"], "ans": [1], "expl": "<p>O 169.254 é o APIPA, ou seja, o cliente não obteve endereço. O gateway só importa depois de ter endereço.<\/p>"}, {"q": "Em um link, o switch A mostra colisões tardias, e o switch B mostra erros de CRC. Qual a causa?", "type": "mc", "opts": ["Cabo cruzado errado", "Duplex mismatch", "STP bloqueando", "DNS lento"], "ans": [1], "expl": "<p>O lado half duplex vê colisões (inclusive tardias), e o full duplex vê CRC. Configure os dois com o mesmo duplex (auto).<\/p>"}, {"q": "Qual das opções é a segunda etapa da metodologia de troubleshooting?", "type": "mc", "opts": ["Documentar", "Estabelecer uma teoria da causa provável", "Implementar", "Verificar o sistema"], "ans": [1], "expl": "<p>Identificar o problema, estabelecer uma teoria, testar, planejar, implementar, verificar e documentar.<\/p>"}], "scoring": null};</script><script src="../../assets/app.js"></script></body></html>
